# WorldGuard region settings applied when a mine is created.
# Requires WorldGuard to be installed for any of these to take effect.
region-settings:
  # Automatically create a WorldGuard region with the settings below when a new mine is created.
  auto-create-wg-region: true
  # Region name pattern. %mine% is replaced with the mine's name.
  name: "%mine%"
  # WorldGuard region priority.
  priority: 2
  # WorldGuard flags set on every auto-created mine region. Add or remove flags as needed.
  flags:
    block-break: ALLOW
    upc-enchants: ALLOW

# Lines displayed by the hologram that floats above each mine.
# Supports legacy color codes (&a, &7, etc.). Placeholders: %mine%, %blocks%, %time%.
holograms:
  # Hologram shown when the mine resets based on remaining block percentage.
  blocks_left:
    - ' '
    - '&6◆ &fMỏ &e%mine% &fcòn &e%blocks%% Blocks'
    - ' '
  # Hologram shown after a reset listing how many blocks were mined.
  blocks_mined:
    - ' '
    - '&a✔ &fĐã đào &e%blocks% Blocks'
    - ' '
  # Hologram shown for timed resets, counting down to the next reset.
  timed_reset:
    - ' '
    - '&e⚠ &fReset tiếp theo sau &e%time%'
    - ' '
