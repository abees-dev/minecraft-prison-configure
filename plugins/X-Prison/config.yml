# Should plugin show debug messages?
debug-mode: true
# Should plugin log all SQL queries?
debug-sql-queries: false
# Should plugin use mini message for all messages/texts/prefixes ?
use-minimessage: true
# Player feedback sounds played on command outcomes (rankup, prestige, purchases,
# admin actions, errors, etc.). Set command-sounds to false to disable all of them.
feedback:
  command-sounds: true
  sounds:
    # Played on successful actions (rankup, prestige, purchase, admin success, ...)
    success: ENTITY_PLAYER_LEVELUP
    # Played on failures (not enough currency, invalid input, no permission, ...)
    error: BLOCK_NOTE_BLOCK_BASS
    # Played on neutral/informational actions (toggles, listings, ...)
    info: BLOCK_NOTE_BLOCK_PLING
# How large numbers are abbreviated in short-format displays and parsed from command input
# (e.g. /<currency> give <player> 10Q). One suffix per 10^3 tier, smallest first.
# Case-sensitive - note q and Q are different tiers:
#   k = 10^3, M = 10^6, B = 10^9, T = 10^12, q = 10^15, Q = 10^18,
#   QT = 10^21, S = 10^24, SP = 10^27, O = 10^30, N = 10^33, D = 10^36
number-format:
  suffixes:
    - k
    - M
    - B
    - T
    - q
    - Q
    - QT
    - S
    - SP
    - O
    - N
    - D
# Should plugin send your server data to bStats ? (https://bstats.org/)
enable-metrics: false
# Database type (H2, SQLite, MySQL)
database_type: MySQL
# MySQL connection details
mysql:
  host: 127.0.0.1
  port: 3306
  database: prison-rpg-db
  username: root
  password: "abeesdev"
  # Connect using SSL/TLS. Leave false for a local/trusted database.
  use-ssl: false
  # Server timezone used by the JDBC driver. Use a valid tz id (e.g. UTC, Europe/Berlin).
  timezone: UTC
# Connection properties
# HikariCP database connection properties, please refer to https://github.com/brettwooldridge/HikariCP#gear-configuration-knobs-baby for more information
connection_properties:
  connection_timeout: 60000
  idle_timeout: 600000
  keep_alive_time: 0
  max_life_time: 1800000
  # Connections kept warm when idle. Note: SQLite always uses a single connection regardless of these values.
  minimum_idle: 2
  maximum_pool_size: 10
  # Log a warning if a connection is held longer than this many ms (0 disables). Helps catch leaks.
  leak_detection_threshold: 30000
  connection_test_query: SELECT 1
  character_encoding: utf8
# Enabling / Disabling of specific modules
modules:
  currencies: false
  blocks: true
  ranks: true
  prestiges: true
  rebirths: true
  multipliers: false
  enchants: false
  autosell: false
  autominer: true
  pickaxe_levels: false
  pickaxe_skins: false
  gangs: false
  mines: true
  bombs: true
  history: true
  mining_stats: false
  battlepass: false
  quests: false
  dailyrewards: false
# List of supported pickaxes by UPC Enchants
supported-pickaxes:
  - DIAMOND_PICKAXE
# Aliases for main command
main-command-aliases:
  - xprison
  - prison
# Plugin prefix, usable via PAPI %xprison_prefix%, can be used across all messages
prefix:
  "<dark_gray>[</dark_gray><gradient:#f7b733:#fc4a1a><bold>X-PRISON</bold></gradient><dark_gray>]</dark_gray>
  <gray>»</gray> "
# How often (in minutes) all online player data is saved to the database as a safety checkpoint.
# Set to 0 to disable the periodic save entirely.
player-data-save-interval: 5
# Set to true once initial setup has been completed via /xprison setup
setup-completed: false
