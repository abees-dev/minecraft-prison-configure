# Pickaxe Levels settings
#
# Pickaxes level up by gaining experience. By default every broken block grants 1 exp,
# tunable via 'exp-sources' (per gain source) and 'exp-per-block' (per block type) below.
levels:
  '1':
    # Pickaxe display name
    display_name: '<gray>Level 1 Pickaxe'
    # Experience required to reach this level (legacy key 'blocks_required' is still accepted)
    exp_required: 0
  '10':
    display_name: '<green>Level 10 Pickaxe'
    rewards:
      - tokens give %player% 5000
  '25':
    display_name: '<aqua>Level 25 Pickaxe'
    rewards:
      - tokens give %player% 25000
      - gems give %player% 10
  '50':
    display_name: '<light_purple>Level 50 Pickaxe'
    rewards:
      - tokens give %player% 100000
      - gems give %player% 50
  '100':
    display_name: '<gold><bold>Level 100 Pickaxe</bold></gold>'
    rewards:
      - tokens give %player% 500000
      - gems give %player% 200
# Optional formula-generated level curve. When 'formula' is set, levels 1..max-level are generated
# from it (cumulative exp, variable: level) and the entries in 'levels' above only override
# display_name / rewards / exp_required for those specific levels.
levels-formula:
  # e.g. '1000 * (level - 1)^1.5'
  formula: '500 * (level - 1)^1.6'
  max-level: 100
  # Display name used for generated levels (%level% is replaced with the level number)
  display-name: '<gray>Level %level% Pickaxe'
# Multiplier applied to pickaxe exp per gain source (1 block = 1 exp before multipliers).
# Note: area enchants additionally award the origin block's manual exp, matching how the
# blocks-broken statistic has always counted it.
exp-sources:
  manual: 1.0
  area-enchants: 1.0
  autominer: 1.0
  # Exp granted through the XPrison API by addons
  api: 1.0
# Exp awarded per broken block type. Supports vanilla materials and custom-block ids
# (ItemsAdder 'namespace:id', Nexo 'nexo:id', Oraxen 'oraxen:id'). Unlisted blocks use 'default'.
exp-per-block:
  default: 1
  # ANCIENT_DEBRIS: 10
  # 'nexo:mythril_ore': 25
# Progress bar delimiter
progress-bar-delimiter: ":"
# Length of progress bar
progress-bar-length: 20
# Display progress (level + exp) directly on player experience bar
show-pickaxe-level-progress-on-exp-bar: true
messages:
  pickaxe-level-up: '<green>✔ <white>Cuốc của bạn đã đạt <yellow>Level %level%<white>!'
  pickaxe-progress: '<yellow>◆ <white>Tiến độ cuốc: <yellow>%exp%<gray>/<yellow>%exp_required% XP'
  no-permission: '<red>✘ <white>Bạn không có quyền sử dụng lệnh này.'
  admin-usage: '<yellow>◆ <white>Cú pháp: <yellow>/pickaxelevel set <player> <level>'
  admin-set: '<green>✔ <white>Đã đặt cuốc của <yellow>%player% <white>thành <yellow>Level %level%<white>.'
  player-not-online: '<red>✘ <white>Người chơi <yellow>%player% <white>không online.'
  invalid-level: '<red>✘ <white>Không tồn tại Level cuốc <yellow>%level%<white>.'
  no-pickaxe-found: '<red>✘ <white>Không tìm thấy cuốc trong túi đồ của <yellow>%player%<white>.'
