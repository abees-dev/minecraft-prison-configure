# Messages shown to players for various currency-related actions
messages:
  invalid_currency: "<red>✘ <white>Loại tiền tệ không hợp lệ."
  no_permission: "<red>✘ <white>Bạn không có quyền thực hiện thao tác này."
  not_enough_currency: "<red>✘ <white>Bạn không đủ <yellow>%currency%<white>."
  your_currency: "<yellow>◆ <white>Bạn đang có <yellow>%amount% %currency%<white>."
  other_currency: "<yellow>◆ <white>Số dư của <yellow>%player%<white>: <yellow>%amount% %currency%<white>."
  not_withdrawal_currency: "<red>✘ <yellow>%currency% <white>không thể rút thành vật phẩm."
  withdraw_successful: "<green>✔ <white>Đã rút <yellow>%amount% %currency%<white>."
  admin_set_currency: "<green>✔ <white>Đã đặt số dư %currency% của <yellow>%player% <white>thành <yellow>%amount%<white>."
  admin_give_currency: "<green>✔ <white>Đã trao <yellow>%amount% %currency% <white>cho <yellow>%player%<white>."
  player_give_currency: "<green>✔ <white>Bạn nhận <yellow>%amount% %currency% <white>từ <yellow>%sender%<white>."
  admin_remove_currency: "<green>✔ <white>Đã trừ <yellow>%amount% %currency% <white>của <yellow>%player%<white>."
  currency_redeem: "<green>✔ <white>Đã quy đổi <yellow>%amount% %currency%<white>."
  currency_send: "<green>✔ <white>Đã gửi <yellow>%amount% %currency% <white>cho <yellow>%player%<white>."
  currency_cant_send_to_yourself: "<red>✘ <white>Bạn không thể tự gửi tiền cho chính mình."
  currency_received: "<green>✔ <white>Bạn nhận <yellow>%amount% %currency% <white>từ <yellow>%player%<white>."
  currency_received_console: "<green>✔ <white>Bạn nhận <yellow>%amount% %currency%<white>."
  not_a_number: "<red>✘ <yellow>%input% <white>không phải số hợp lệ."
  player_not_online: "<red>✘ <white>Người chơi <yellow>%player% <white>không online."
  currency_message_disabled: "<yellow>⚠ <white>Thông báo %currency% đã <red><bold>TẮT"
  currency_message_enabled: "<green>✔ <white>Thông báo %currency% đã <green><bold>BẬT"
# Configuration for each available currency
currencies:
  money:
    enabled: true # If false, players won't be able to use this currency
    starting-amount: 0 # Initial balance for new players
    max-amount: "1E48" # Effectively unlimited (supports S-scale and beyond); set a plain number to impose a cap
    display-name: "Money" # Shown in GUI or messages
    format: "#,##0.##" # Number formatting
    short-format: true # Enables short formatting like 1M, 1B
    trim-zeros: true # Removes trailing zeros
    prefix: "$" # Added before the amount
    suffix: "" # Added after the amount
    physical-item: # Configuration for redeemable item
      material: PAPER # Item type
      custom_model_data: 0 # Custom model data for resource packs
      name: "<gradient:#FFFF00:#FFD700:#FFA500>%amount% <bold>Money</bold></gradient>" # Display name
      lore:
        - "<yellow>➥ <white>Right-Click to Redeem" # Description/lore line
  tokens:
    enabled: true
    starting-amount: 0
    max-amount: "1E48" # Effectively unlimited (supports S-scale and beyond); set a plain number to impose a cap
    display-name: "Tokens"
    format: "#.##"
    short-format: true
    trim-zeros: true
    prefix: "⛃"
    suffix: ""
    physical-item:
      material: SUNFLOWER
      custom_model_data: 0
      name: "<gradient:#FFFF00:#FFD700:#FFA500>%amount% <bold>Tokens</bold></gradient>"
      lore:
        - "<yellow>➥ <white>Right-Click to Redeem"
  gems:
    enabled: true
    starting-amount: 0
    max-amount: "1E48" # Effectively unlimited (supports S-scale and beyond); set a plain number to impose a cap
    display-name: "Gems"
    format: "#.##"
    short-format: true
    trim-zeros: true
    prefix: "💠"
    suffix: ""
    physical-item:
      custom_model_data: 0
      material: EMERALD
      name: "<gradient:#FFFF00:#FFD700:#FFA500>%amount% <bold>Gems</bold></gradient>"
      lore:
        - "<yellow>➥ <white>Right-Click to redeem"
