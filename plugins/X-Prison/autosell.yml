messages:
  autosell_enable:
    <gradient:#FFFF00:#FFD700:#FFA500><bold>AUTOSELL</bold></gradient>
    <green>✔ <white>Đã <green><bold>BẬT</bold> <white>Autosell.
  autosell_disable:
    <gradient:#FFFF00:#FFD700:#FFA500><bold>AUTOSELL</bold></gradient>
    <yellow>⚠ <white>Đã <red><bold>TẮT</bold> <white>Autosell.
  sell_all_complete:
    <gradient:#FFFF00:#FFD700:#FFA500><bold>SELLALL</bold></gradient>
    <green>✔ <white>Đã bán toàn bộ túi đồ với giá <yellow>%price%<white>.
  sell_all_nothing:
    <gradient:#FFFF00:#FFD700:#FFA500><bold>SELLALL</bold></gradient>
    <yellow>⚠ <white>Không có vật phẩm nào để bán.
  not_in_region: "&c✘ &fBạn phải ở trong khu mỏ để dùng &e/sellall&f."
  invalid_region: "&c✘ &fKhu vực được chỉ định không hợp lệ."
  no_permission_autosell_toggle:
    <gradient:#FFFF00:#FFD700:#FFA500><bold>AUTOSELL</bold></gradient>
    <red>✘ <white>Bạn không có quyền bật hoặc tắt Autosell.
  no_permission_sell:
    "&c✘ &fBạn không có quyền bán vật phẩm trong khu vực này.
    (%perm%)"
  no_permission_sellall:
    <gradient:#FFFF00:#FFD700:#FFA500><bold>SELLALL</bold></gradient>
    <red>✘ <white>Bạn không có quyền sử dụng <yellow>/sellall<white>.
# Should be autosell enabled automatically on player join?
enable-autosell-automatically: true

# Should blocks be smelted when mined? Example: STONE -> COBBLESTONE, IRON_ORE -> IRON_INGOT
auto-smelt:
  enabled: false
  map:
    STONE: COBBLESTONE
# IRON_ORE: IRON_INGOT

# Notification when player has full inventory
inventory_full_notification:
  # Should players be notified if they have full inventory?
  enabled: true
  title:
    # Set enabled: false to fall back to the chat message below instead
    enabled: true
    text: "&e&lTÚI ĐỒ ĐÃ ĐẦY!"
    subtitle: "&fDùng &e/sellall &fđể bán vật phẩm"
    fade-in: 1
    stay: 3
    fade-out: 1
  chat:
    <yellow>⚠ <white>Túi đồ đã đầy! Dùng <yellow>/sellall <white>để bán vật phẩm.
# Live action bar showing earnings while auto-selling / using /sellall.
# Earnings are batched and shown once every flush-ticks to avoid spam while mining.
earnings-actionbar:
  enabled: false
  # %price% = total earned this mining session, %currency% = currency display name
  format: <green>+ %price% %currency%
  # How often (in server ticks, 20 = 1s) the action bar is refreshed
  flush-ticks: 15
  # The action bar shows a running total for the current mining "session". When the player
  # stops mining for this many seconds, the session resets back to 0.
  reset-after-seconds: 3
# GOLD_ORE: 250.0
