messages:
  cooldown: <yellow>Please wait %time% seconds before executing this command again.
  no_permission: <gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient>
    <dark_gray>»</dark_gray> <red>You do not have permission to view other players'
    blocks!
  your_blocks: <gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient> <dark_gray>»</dark_gray>
    <white>You mined <yellow>%blocks%</yellow> <white>Blocks
  other_blocks: <gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient> <dark_gray>»</dark_gray>
    <yellow>%player%</yellow> <white>mined <yellow>%blocks%</yellow> <white>Blocks
  admin_set_blocks: <gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient>
    <dark_gray>»</dark_gray> <white>Successfully set <yellow>%blocks%</yellow>'s <white>blocks
    to <yellow>%blocks%</yellow>.
  admin_give_blocks: <gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient>
    <dark_gray>»</dark_gray> <white>Successfully given <yellow>%blocks%</yellow> <white>blocks
    to <yellow>%player%</yellow>.
  admin_remove_blocks: <gradient:#FFFF00:#FFD700:#FFA500><bold>BLOCKS</bold></gradient>
    <dark_gray>»</dark_gray> <white>Successfully removed <yellow>%blocks%</yellow>
    <white>blocks from <yellow>%player%</yellow>.
  lucky_block_mined: <gradient:#FFFF00:#FFD700:#FFA500><bold>LUCKY BLOCK</bold></gradient>
    <dark_gray>»</dark_gray> <white>You have mined a <yellow><bold>LUCKY BLOCK</bold></yellow>
    <white>and received <yellow>%amount%</yellow> Tokens!
# LuckyBlocks settings for rewards
lucky-blocks:
  SPONGE:
  - tokens give %player% 1000
# This value determines when will the next weekly top reset be. Updated automatically with /resetblockstopweekly command
next-reset-weekly: 1785945087518
# Interval in minutes for saving player data into database
player_data_save_interval: 10
# Cooldown in seconds to check other player's blocks (/blocks <player>)
blocks-command-cooldown: 5
# Amount of players displayed in top lists
top_players_amount: 10
blocks-top-format:
- <yellow><strikethrough>-------<white><strikethrough>-------<yellow><strikethrough>--------<white><strikethrough>--------<yellow><strikethrough>--------<white><strikethrough>-------<yellow><strikethrough>-------
- <yellow><bold>BLOCKS TOP</bold>
- '{FOR_EACH_PLAYER} <white><bold>#%position%.</bold> <yellow>%player% <dark_gray>»</dark_gray>
  <white>%blocks% Blocks'
- <yellow><strikethrough>-------<white><strikethrough>-------<yellow><strikethrough>--------<white><strikethrough>--------<yellow><strikethrough>--------<white><strikethrough>-------<yellow><strikethrough>-------
blocks-top-weekly-format:
- <yellow><strikethrough>-------<white><strikethrough>-------<yellow><strikethrough>--------<white><strikethrough>--------<yellow><strikethrough>--------<white><strikethrough>-------<yellow><strikethrough>-------
- <yellow><bold>BLOCKS TOP WEEKLY</bold>
- '{FOR_EACH_PLAYER} <white><bold>#%position%.</bold> <yellow>%player% <dark_gray>»</dark_gray>
  <white>%blocks% Blocks'
- <yellow><strikethrough>-------<white><strikethrough>-------<yellow><strikethrough>--------<white><strikethrough>--------<yellow><strikethrough>--------<white><strikethrough>-------<yellow><strikethrough>-------
# Aliases for /blockstop command
blocks-top-command-aliases:
- blockstop
- blocktop
