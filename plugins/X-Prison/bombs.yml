# Cooldown in seconds between throwing another bomb
bomb-throw-cooldown: 3
# Events that will cause the bomb to explode
# PlayerInteractEvent -> Will cause the bomb to explode on right click air / block
# PlayerDropItemEvent -> Will cause the bomb to explode when it is dropped by player
bomb-trigger-events:
  - PlayerInteractEvent
# Command aliases for /bombs command
bombs-command-aliases:
  - bomb
  - bombs
# All bomb types
bombs:
  tiny:
    radius: 3
    drop_sound: ENTITY_TNT_PRIMED
    explode_sound: ENTITY_GENERIC_EXPLODE
    explosion_delay: 3
    item:
      material: TNT
      name: "<gradient:#00ff00:#7fff00><bold>TINY </gradient><gradient:#ff0000:#800000>Bomb</gradient>"
      lore:
        - " "
        - "<gray><italic>Drop it and run away!</italic>"
        - " "
        - "<gray>Creates explosion in 3x3 radius."
        - " "
      custom_model_data: 0
  small:
    radius: 5
    drop_sound: ENTITY_TNT_PRIMED
    explode_sound: ENTITY_GENERIC_EXPLODE
    explosion_delay: 3
    item:
      material: TNT
      name: "<gradient:#ffff00:#ffa500><bold>SMALL </gradient><gradient:#ff0000:#800000>Bomb</gradient>"
      lore:
        - " "
        - "<gray>A slightly stronger blast."
        - "<gray>Creates explosion in 5x5 radius."
        - " "
      custom_model_data: 0
  normal:
    radius: 7
    drop_sound: ENTITY_TNT_PRIMED
    explode_sound: ENTITY_GENERIC_EXPLODE
    explosion_delay: 3
    item:
      material: TNT
      name: "<gradient:#ffff00:#ffd700><bold>NORMAL </gradient><gradient:#ff0000:#800000>Bomb</gradient>"
      lore:
        - " "
        - "<gray>Moderate explosive power."
        - "<gray>Creates explosion in 7x7 radius."
        - " "
      custom_model_data: 0
  large:
    radius: 10
    drop_sound: ENTITY_TNT_PRIMED
    explode_sound: ENTITY_GENERIC_EXPLODE
    explosion_delay: 3
    item:
      material: TNT
      name: "<gradient:#ff0000:#8b0000><bold>LARGE </gradient><gradient:#ff0000:#8b0000>Bomb</gradient>"
      lore:
        - " "
        - "<gray>Big boom, big range."
        - "<gray>Creates explosion in 10x10 radius."
        - " "
      custom_model_data: 0
  mega:
    radius: 15
    drop_sound: ENTITY_TNT_PRIMED
    explode_sound: ENTITY_GENERIC_EXPLODE
    explosion_delay: 3
    item:
      material: NETHER_STAR
      name: "<gradient:#8b0000:#ff0000><bold>MEGA </gradient><gradient:#ff0000:#8b0000>Bomb</gradient>"
      lore:
        - " "
        - "<red>Catastrophic power — run far!"
        - "<gray>Creates explosion in 15x15 radius."
        - " "
      custom_model_data: 0
# Messages
messages:
  player_offline: "<red>✘ <white>Người chơi <yellow>%player% <white>không online."
  bomb_given: "<green>✔ <white>Đã trao <yellow>x%amount% <reset>%item% <white>cho <yellow>%player%<white>."
  bomb_received: "<green>✔ <white>Bạn đã nhận <yellow>x%amount% <reset>%item%<white>."
  bomb_invalid_type: "<red>✘ <yellow>%type% <white>không phải loại bom hợp lệ."
  no-permission: "<red>✘ <white>Bạn không có quyền sử dụng lệnh này."
  items_sold: "<green>✔ <white>Đã tự động bán <yellow>%amount% <white>vật phẩm với giá <yellow>%price%<white>."
  cooldown: "<yellow>⚠ <white>Bạn có thể dùng bom tiếp theo sau <yellow>%time% giây<white>."
