messages:
  no-permission: "<red>✘ <white>Bạn không có quyền sử dụng lệnh này."
  player-only: "<red>✘ <white>Chỉ người chơi mới sử dụng được lệnh này."
  current-rebirth: "<gold>◆ <white>Rebirth hiện tại: <gold>%rebirth%<white>."
  rebirth-set: "<green>✔ <white>Đã đặt Rebirth của <yellow>%player% <white>thành <gold>%rebirth%<white>."
  player-not-found: "<red>✘ <white>Không tìm thấy người chơi."
  invalid-number: "<red>✘ <white>Vui lòng nhập một số nguyên hợp lệ."
  success: "<green>✔ <white>Bạn đã đạt <gold><bold>Rebirth %rebirth%</bold><white>!"
  fail: "<red>✘ <white>Bạn chưa đáp ứng đủ điều kiện Rebirth."
  max-rebirth: "<yellow>⚠ <white>Bạn đã đạt Rebirth tối đa."
  requirement-rank: "<red>✘ <white>Bạn cần đạt ít nhất Rank %rank% <white>để Rebirth."
  requirement-prestige: "<red>✘ <white>Bạn cần đạt ít nhất Prestige <yellow>%prestige% <white>để Rebirth."
  requirement-currency: "<red>✘ <white>Bạn cần <yellow>%amount% %currency% <white>để Rebirth."
  invalid-rebirth: "<red>✘ <white>Rebirth ID không hợp lệ."
  no-rebirth: "<yellow>⚠ <white>Bạn chưa Rebirth lần nào."
# Title shown to player on rebirth. Supports MiniMessage. Placeholders: %rebirth% (new rebirth ID), %rebirth_prefix% (new rebirth prefix)
rebirth-title:
  enabled: true
  title: '&c&lREBIRTH'
  subtitle: '&fBạn đã đạt &eRebirth %rebirth%'
  fade-in: 1
  stay: 3
  fade-out: 1
# Sound played to player on rebirth. sound must be a valid Bukkit Sound enum name.
rebirth-sound:
  enabled: true
  sound: UI_TOAST_CHALLENGE_COMPLETE
  volume: 1.0
  pitch: 1.0
rebirths:
  '0': # Default Rebirth
    prefix: <gradient:#FFFF00:#FFD700:#FFA500><bold>R0</bold></gradient>
    requirements:
      - type: rank
        enabled: false
        value: 1 #Required Rank ID
      - type: prestige
        enabled: false
        value: 0 #Required Prestige ID
      - type: currency
        enabled: false
        currency: money
        value: 10000000.0 #Required amount of money currency
      - type: currency
        enabled: false
        currency: tokens
        value: 10000000.0 #Required amount of tokens currency
    rewards:
      commands:
        - lp user %player% permission set xprison.rebirth0 true #Commands to be executed when player rebirths
  '1':
    prefix: <gradient:#ff0000:#8b0000><bold>R1</bold></gradient>
    requirements:
      - type: rank
        enabled: true
        value: 9 #Required Rank ID (Vượt Ngục, last rank)
      - type: prestige
        enabled: true
        value: 10 #Required Prestige ID
      - type: currency
        enabled: true
        currency: money
        value: 5000000000.0 #Required amount of money currency
      - type: currency
        enabled: false
        currency: tokens
        value: 0
    rewards:
      commands:
        - lp user %player% permission set xprison.rebirth1 true
        - gems give %player% 500
  '2':
    prefix: <gradient:#ff4500:#8b0000><bold>R2</bold></gradient>
    requirements:
      - type: rank
        enabled: true
        value: 9
      - type: prestige
        enabled: true
        value: 30
      - type: currency
        enabled: true
        currency: money
        value: 15000000000.0
      - type: currency
        enabled: false
        currency: tokens
        value: 0
    rewards:
      commands:
        - lp user %player% permission set xprison.rebirth2 true
        - gems give %player% 1500
  '3':
    prefix: <gradient:#ff8c00:#b22222><bold>R3</bold></gradient>
    requirements:
      - type: rank
        enabled: true
        value: 9
      - type: prestige
        enabled: true
        value: 60
      - type: currency
        enabled: true
        currency: money
        value: 50000000000.0
      - type: currency
        enabled: false
        currency: tokens
        value: 0
    rewards:
      commands:
        - lp user %player% permission set xprison.rebirth3 true
        - gems give %player% 5000

# ---------------------------------------------------------------------------
# Rebirths GUI (opened with /rebirths). Fully configurable.
# Each rebirth is drawn using one of the four state templates under gui.rebirth
# (owned/current/next/locked). The next/locked templates may include a
# '%requirements%' lore line which expands into one line per enabled
# requirement, coloured met/unmet.
# Item placeholders: %id%, %prefix% / %rebirth%
# ---------------------------------------------------------------------------
gui:
  title: '<gradient:#FFD700:#FFA500><bold>REBIRTHS</bold></gradient>'
  rows: 6
  filler: BLACK_STAINED_GLASS_PANE
  rebirth-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  # Wrappers applied to each requirement line in the %requirements% expansion.
  requirement-met: '<green>✔ <gray>%requirement%'
  requirement-unmet: '<red>✖ <gray>%requirement%'
  # How each requirement type is described. %value% is the rank/prestige prefix
  # or required amount; %currency% is the currency name (currency type only).
  requirement-format:
    rank: 'Rank %value%'
    prestige: 'Prestige %value%'
    currency: '%value% %currency%'
  rebirth:
    owned:
      material: LIME_STAINED_GLASS_PANE
      name: '%prefix% <dark_gray>(<green>Reached</green>)'
      lore:
        - '<gray>Rebirth <white>#%id%'
        - '<green>✔ Already reborn.'
    current:
      material: NETHER_STAR
      glow: true
      name: '%prefix% <dark_gray>(<yellow>Current</yellow>)'
      lore:
        - '<gray>Rebirth <white>#%id%'
        - '<yellow>➤ Your current rebirth.'
    next:
      material: BEACON
      name: '%prefix% <dark_gray>(<gold>Next</gold>)'
      lore:
        - '<gray>Rebirth <white>#%id%'
        - ' '
        - '<gray>Requirements:'
        - '%requirements%'
        - ' '
        - '<yellow>Click to rebirth!'
    locked:
      material: RED_STAINED_GLASS_PANE
      name: '%prefix% <dark_gray>(<red>Locked</red>)'
      lore:
        - '<gray>Rebirth <white>#%id%'
        - ' '
        - '<gray>Requirements:'
        - '%requirements%'
        - '<red>🔒 Rebirth to unlock.'
  items:
    info:
      slot: 4
      material: BOOK
      name: '<gold><bold>Rebirths'
      lore:
        - '<gray>Rebirth resets your rank and prestige'
        - '<gray>in exchange for permanent rewards.'
        - ' '
        - '<gray>Use <yellow>/rebirth <gray>or click the'
        - '<gray>next rebirth below.'
    close:
      slot: 49
      material: BARRIER
      name: '<red><bold>Close'
      lore: []
    prev-page:
      slot: 48
      material: ARROW
      name: '<yellow>« Previous Page'
      lore: []
    next-page:
      slot: 50
      material: ARROW
      name: '<yellow>Next Page »'
      lore: []
