messages:
  no_permission: "<red>✘ <white>Bạn không có quyền thực hiện thao tác này."
  rank_up: ""
  not_enough_currency: "<red>✘ <white>Bạn cần <yellow>%cost% %currency% <white>để RankUp."
  prestige_needed: "<yellow>⚠ <white>Hãy sử dụng <yellow>/prestige <white>để tiếp tục thăng tiến."
  rank_set: "<green>✔ <white>Đã đặt Rank của <yellow>%player% <white>thành %rank%<white>."
# Delimiter on progress bar
progress-bar-delimiter: ":"
# Length of progress bar
progress-bar-length: 20
# Currency this module works with (eg. money, tokens, gems)
currency: "money"
#Should players auto rankup if they have enough currency to rank up ?
auto-rank-up: false
#Interval in seconds to check for possible auto rank up
auto-rank-up-interval: 2
# Title shown to player on rank-up. Supports MiniMessage. Placeholders: %rank% (new rank prefix), %old_rank% (old rank prefix)
rankup-title:
  # Tắt vì level_gate.sk đã tự gửi title/message riêng (tiếng Việt) khi rankup,
  # để 2 title X-Prison + Skript không hiện chồng nhau.
  enabled: false
  title: "&5&lRANKUP"
  subtitle: "&aYou reached &e%rank%"
  fade-in: 1
  stay: 3
  fade-out: 1
# Sound played to player on rank-up. sound must be a valid Bukkit Sound enum name.
rankup-sound:
  enabled: false
  sound: UI_TOAST_CHALLENGE_COMPLETE
  volume: 1.0
  pitch: 1.0
# Ranks settings
Ranks:
  "1":
    Prefix: <white><bold>[Tân Binh]</bold></white>
    Cost: 0
    CMD:
      - lp user %player% parent set xprison_rank_1
  "2":
    Prefix: <gray><bold>[Tù Nhân]</bold></gray>
    Cost: 850000
    CMD:
      - lp user %player% parent set xprison_rank_2
      - mmocore admin attribute-points give %player% 1
  "3":
    Prefix: <green><bold>[Lao Công]</bold></green>
    Cost: 2900000
    CMD:
      - lp user %player% parent set xprison_rank_3
      - mmocore admin attribute-points give %player% 1
  "4":
    Prefix: <dark_green><bold>[Thợ Đào]</bold></dark_green>
    Cost: 10750000
    CMD:
      - lp user %player% parent set xprison_rank_4
      - mmocore admin attribute-points give %player% 1
  "5":
    Prefix: <aqua><bold>[Đội Trưởng]</bold></aqua>
    Cost: 54000000
    CMD:
      - lp user %player% parent set xprison_rank_5
      - mmocore admin attribute-points give %player% 1
  "6":
    Prefix: <blue><bold>[Phó Quản Ngục]</bold></blue>
    Cost: 217000000
    CMD:
      - lp user %player% parent set xprison_rank_6
      - mmocore admin attribute-points give %player% 1
  # Economy scale 2026-08-07: money rank costs ×10 cùng Gang Sell.
  "7":
    Prefix: <light_purple><bold>[Quản Ngục]</bold></light_purple>
    Cost: 550000000
    CMD:
      - lp user %player% parent set xprison_rank_7
      - mmocore admin attribute-points give %player% 1
  "8":
    Prefix: <gold><bold>[Bá Chủ Ngục Tù]</bold></gold>
    Cost: 1250000000
    CMD:
      - lp user %player% parent set xprison_rank_8
      - mmocore admin attribute-points give %player% 1
  "9":
    Prefix: <red><bold>[Vượt Ngục]</bold></red>
    Cost: 3000000000
    CMD:
      - lp user %player% parent set xprison_rank_9
      - mmocore admin attribute-points give %player% 1

# ---------------------------------------------------------------------------
# Ranks GUI (opened with /ranks). Fully configurable.
# Each rank is drawn in one of the four state templates below depending on the
# viewing player's progress: owned (already passed), current (their rank),
# next (the rank they can buy - clicking it ranks up), locked (further away).
# Placeholders for rank items: %id%, %prefix% / %rank%, %cost%, %currency%
# (these are the only placeholders X-Prison's ranks GUI supports - the perk
# lines below are intentionally generic/static since per-rank custom lore
# isn't supported by the plugin, only the shared templates below)
# ---------------------------------------------------------------------------
gui:
  title: <gradient:#FFD700:#FFA500><bold>RANKS</bold></gradient>
  rows: 6
  filler: BLACK_STAINED_GLASS_PANE
  rank-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34
  rank:
    owned:
      material: LIME_STAINED_GLASS_PANE
      glow: false
      name: '%prefix% <dark_gray>(<green>Unlocked</green>)'
      lore:
      - <gray>Rank <white>#%id%
      - <green>✔ You already own this rank.
    current:
      material: NETHER_STAR
      glow: true
      name: '%prefix% <dark_gray>(<yellow>Your Rank</yellow>)'
      lore:
      - <gray>Rank <white>#%id%
      - <yellow>➤ This is your current rank.
    next:
      material: GOLD_INGOT
      glow: false
      name: '%prefix% <dark_gray>(<gold>Next</gold>)'
      lore:
      - <gray>Rank <white>#%id%
      - '<gray>Cost: <gold>%cost% <gray>%currency%'
      - ' '
      - <yellow>Click to rank up!
    locked:
      material: RED_STAINED_GLASS_PANE
      glow: false
      name: '%prefix% <dark_gray>(<red>Locked</red>)'
      lore:
      - <gray>Rank <white>#%id%
      - '<gray>Cost: <gold>%cost% <gray>%currency%'
      - <red>🔒 Rank up to unlock.
  items:
    info:
      slot: 4
      material: BOOK
      name: <yellow><bold>Ranks
      lore:
      - <gray>Rank up to access better mines
      - <gray>and unlock rewards along the way.
      - ' '
      - <gray>Use <yellow>/rankup <gray>or click the
      - <gray>next rank below to advance.
    close:
      slot: 49
      material: BARRIER
      name: <red><bold>Close
      lore: []
    prev-page:
      slot: 48
      material: ARROW
      name: <yellow>« Previous Page
      lore: []
    next-page:
      slot: 50
      material: ARROW
      name: <yellow>Next Page »
      lore: []
