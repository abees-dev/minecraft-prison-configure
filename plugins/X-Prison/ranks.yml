      - lp user %player% parent set xprison_rank_9

# ---------------------------------------------------------------------------
# Ranks GUI (opened with /ranks). Fully configurable.
# Each rank is drawn in one of the four state templates below depending on the
# viewing player's progress: owned (already passed), current (their rank),
# next (the rank they can buy - clicking it ranks up), locked (further away).
# Placeholders for rank items: %id%, %prefix% / %rank%, %cost%, %currency%
# (these are the only placeholders X-Prison's ranks GUI supports - the perk
# lines below are intentionally generic/static since per-rank custom lore
# isn't supported by the plugin, only the shared templates below)
# ---------------------------------------------------------------------------
gui:
  title: '<gradient:#FFD700:#FFA500><bold>⛏ RANKS ⛏</bold></gradient>'
  rows: 6
  filler: GRAY_STAINED_GLASS_PANE
  # Centered 3x3 ladder layout - one slot per existing rank (1-9).
  # Add more slots here if you add more ranks; the GUI paginates automatically.
  rank-slots: [12, 13, 14, 21, 22, 23, 30, 31, 32]
  rank:
    owned:
      material: LIME_STAINED_GLASS_PANE
      glow: false
      name: '%prefix% <dark_gray>(<green>Đã sở hữu</green>)'
      lore:
        - '<gray>Rank <white>#%id%'
        - '<green>✔ Bạn đã vượt qua rank này.'
        - ' '
        - '<gray>Quyền lợi:'
        - '<dark_gray>• <gray>Mở khóa khu mine của rank'
        - '<dark_gray>• <gray>Hệ số nhân %currency%/tokens cao hơn'
        - '<dark_gray>• <gray>Nhóm LuckPerms: <white>xprison_rank_%id%'
    current:
      material: NETHER_STAR
      glow: true
      name: '%prefix% <dark_gray>(<yellow>Rank hiện tại</yellow>)'
      lore:
        - '<gray>Rank <white>#%id%'
        - '<yellow>➤ Đây là rank hiện tại của bạn.'
        - ' '
        - '<gray>Quyền lợi:'
        - '<dark_gray>• <gray>Mở khóa khu mine của rank'
        - '<dark_gray>• <gray>Hệ số nhân %currency%/tokens cao hơn'
        - '<dark_gray>• <gray>Nhóm LuckPerms: <white>xprison_rank_%id%'
    next:
      material: GOLD_INGOT
      glow: true
      name: '%prefix% <dark_gray>(<gold>Rank tiếp theo</gold>)'
      lore:
        - '<gray>Rank <white>#%id%'
        - '<gray>Giá: <gold>%cost% <gray>%currency%'
        - ' '
        - '<gray>Quyền lợi khi lên rank:'
        - '<dark_gray>• <gray>Mở khóa khu mine mới'
        - '<dark_gray>• <gray>Tăng hệ số nhân %currency%/tokens'
        - '<dark_gray>• <gray>Nhóm LuckPerms: <white>xprison_rank_%id%'
        - ' '
        - '<yellow><bold>➤ Click để rankup!'
    locked:
      material: RED_STAINED_GLASS_PANE
      glow: false
      name: '%prefix% <dark_gray>(<red>Chưa mở khóa</red>)'
      lore:
        - '<gray>Rank <white>#%id%'
        - '<gray>Giá: <gold>%cost% <gray>%currency%'
        - ' '
        - '<red>🔒 Hãy rankup tuần tự để đến rank này.'
  items:
    info:
      slot: 4
      material: BOOK
      name: '<yellow><bold>Thông tin Rank'
      lore:
        - '<gray>Rank up để mở khóa mine mới,'
        - '<gray>hệ số nhân cao hơn và các quyền lợi.'
        - ' '
        - '<gray>Dùng <yellow>/rankup <gray>hoặc click vào'
        - '<gray>rank tiếp theo bên dưới để lên rank.'
        - ' '
        - '<green>■ <gray>Xanh lá - Đã sở hữu   <yellow>■ <gray>Vàng - Hiện tại'
        - '<gold>■ <gray>Cam - Tiếp theo   <red>■ <gray>Đỏ - Chưa mở khóa'
        - ' '
        - '<gray>Muốn nhiều quyền lợi hơn nữa?'
        - '<gray>Xem thêm rank VIP với <yellow>/viprank'
    close:
      slot: 49
      material: BARRIER
      name: '<red><bold>Đóng'
      lore: []
    prev-page:
      slot: 48
      material: ARROW
      name: '<yellow>« Trang trước'
      lore: []
    next-page:
      slot: 50
      material: ARROW
      name: '<yellow>Trang sau »'
      lore: []