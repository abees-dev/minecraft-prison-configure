# Maximum number of enchants on a pickaxe, -1 = UNLIMITED
max-enchants: -1
# Should we keep Enchanted pickaxes in players inventory when they die?
keep-pickaxes-on-death: true
# Pickaxe Soulbinding - bind a pickaxe to its owner so it can't be stolen or lost.
# Add a line such as '<gray>Soulbound to: <yellow>%Owner%' to 'Pickaxe.lore' to display the owner.
soulbinding:
  # Master switch for the soulbinding feature.
  enabled: true
  # Automatically bind a pickaxe to the first player who holds/picks it up.
  bind-on-first-hold: true
  # Stop other players from picking a soulbound pickaxe off the ground.
  block-pickup-by-others: true
  # Stop other players from mining / using a soulbound pickaxe.
  block-use-by-others: true
  # Return a lost/dropped soulbound pickaxe to its owner instead of letting it be taken or despawn.
  auto-return-to-owner: true
# Inventory protection for enchanted pickaxes.
inventory-protection:
  # Prevent players from dropping their enchanted pickaxe.
  prevent-dropping: true
  # Prevent storing enchanted pickaxes in chests, shulkers, ender chests, hoppers, item frames, etc.
  block-storing-in-containers: true
  # Prevent enchanted pickaxes from despawning while on the ground (Paper/Folia only).
  prevent-ground-despawn: true
# Should use unbreakable permission to handle unbreakable pickaxes?
use-unbreakable-permission: false
# Require players to hold 'xprison.enchants.use.<enchant>' for an enchant to trigger while mining.
#  false (default): every enchant works unless that permission is explicitly set to false (negative gate).
#  true: an enchant only works if the player explicitly has its use permission (positive grant).
require-enchant-use-permission: false
# Fly enchant settings.
fly:
  # When a pickaxe is put away, the Fly enchant normally revokes flight.
  # To avoid stripping flight that was granted elsewhere:
  #  - Players in Creative/Spectator never have their flight touched.
  #  - Players holding any permission listed below keep their flight.
  # Example: essentials.fly, xprison.fly.keep
  keep-permissions:
    - xprison.fly.keep
# Action to open Enchanting menu while holding pickaxe. For multiple, separate them with ',' (LEFT_CLICK_BLOCK,RIGHT_CLICK_BLOCK,LEFT_CLICK_AIR,RIGHT_CLICK_AIR,PHYSICAL)
open-enchant-menu-action: "RIGHT_CLICK_AIR,RIGHT_CLICK_BLOCK"
