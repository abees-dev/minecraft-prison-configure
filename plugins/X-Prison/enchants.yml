    slot: 40
    enabled_state:
      material: LIME_STAINED_GLASS_PANE
      custom_model_data: 0
      name: '<white>Enchant: <green><bold>ENABLED</bold></green>'
      lore:
        - '<gray><italic>(( Click to disable this enchant ))</italic></gray>'
        - ''
        - '<italic:false><gray>While disabled, this enchant will</gray>'
        - '<italic:false><gray>not trigger while you mine.</gray>'
    disabled_state:
      material: RED_STAINED_GLASS_PANE
      custom_model_data: 0
      name: '<white>Enchant: <red><bold>DISABLED</bold></red>'
      lore:
        - '<gray><italic>(( Click to enable this enchant ))</italic></gray>'
        - ''
        - '<italic:false><gray>This enchant is currently turned off</gray>'
        - '<italic:false><gray>and will not trigger while you mine.</gray>'
  # Prestige button. Only shown for prestigeable enchants. Reuses the prestige placeholders.
  prestige_item:
    enabled: true
    slot: 38
    material: NETHER_STAR
    custom_model_data: 0
    name: '<light_purple><bold>PRESTIGE</bold></light_purple>'
    lore:
      - '%prestige_info%'
      - ''
      - '<italic:false><gray><italic>(( Click to prestige this enchant ))</italic></gray>'
  # Returns to the enchant menu.
  back_item:
    enabled: true
    slot: 42
    material: COMPASS
    custom_model_data: 0
    name: '<red><bold>BACK</bold></red>'
    lore:
      - '<gray><italic>(( Return to the enchant menu ))</italic></gray>'
  # Optional decorative border/filler items (see other menus). Empty by default.
  decorations: {}

# "Choose Pickaxe Slot" menu. Players pick which hotbar slot (1-9) their pickaxe stays in.
# The choice is remembered and the pickaxe is auto-moved back to it on join, respawn & pickup.
pickaxe_slot_menu:
  title: '<gradient:#55FF55:#00AA00>Choose Pickaxe Slot</gradient>'
  lines: 3
  empty_slots: GRAY_STAINED_GLASS_PANE
  # GUI positions representing hotbar slots 1..9 (order matters, exactly 9 entries).
  hotbar_slots: [9, 10, 11, 12, 13, 14, 15, 16, 17]
  # Non-clickable preview of the player's pickaxe.
  pickaxe_display:
    enabled: true
    slot: 4
  # Shown on the slot the pickaxe is currently in. %slot% = hotbar number (1-9).
  selected_item:
    material: EMERALD_BLOCK
    custom_model_data: 0
    name: '<green>Slot %slot% <bold>(SELECTED)</bold></green>'
    lore:
      - '<green><italic>(( Your pickaxe is here ))</italic></green>'
  # Shown on every other hotbar slot. Click to move the pickaxe there. %slot% = hotbar number.
  available_item:
    material: LIME_STAINED_GLASS_PANE
    custom_model_data: 0
    name: '<green>Slot %slot%</green>'
    lore:
      - '<gray><italic>(( Click to move your pickaxe here ))</italic></gray>'
  # Returns to the enchant menu.
  back_item:
    enabled: true
    material: COMPASS
    custom_model_data: 0
    slot: 22
    name: '<red><bold>BACK</bold></red>'
    lore:
      - '<gray><italic>(( Return to the enchant menu ))</italic></gray>'

disenchant_menu:
  title: '<gradient:#FFD700:#FFA500>Disenchant Menu</gradient>'
  empty_slots: GRAY_STAINED_GLASS_PANE
  lines: 6
  pickaxe_slot: 4
  pickaxe_enabled: true
  # How many levels each click refunds in the disenchant menu.
  # Keys are click types (LEFT, RIGHT, MIDDLE, SHIFT_RIGHT, DROP); values are a number of levels
  # or the literal "max" to refund every level at once.
  click-amounts:
    LEFT: 1
    RIGHT: 10
    MIDDLE: 100
    SHIFT_RIGHT: 100
    DROP: max
  item:
    lore:
      - '<italic:false><white>%status%</white>'
      - ' '
      - '<italic:false><yellow>Description</yellow>'
      - '<italic:false><gray>%description%</gray>'
      - ' '
      - '<italic:false><yellow>Information</yellow>'
      - ' <italic:false><yellow>▎</yellow> <white>Level: </white><yellow>%current_level%</yellow> <white>/</white> <yellow>%max_level%</yellow>'
      - ' <italic:false><yellow>▎</yellow> <white>Base Activation Chance: </white><yellow>%base_chance%</yellow>'
      - ' <italic:false><yellow>▎</yellow> <white>Your Activation Chance: </white><yellow>%chance%</yellow>'
      - ' '
      - '<italic:false><yellow>Disenchant 1 Level</yellow>'
      - ' <italic:false><yellow>▎</yellow> <white>You will receive: </white><yellow>%refund%</yellow> <white>%currency%</white>'
      - ' <italic:false><yellow>▎</yellow> <white>Press </white><yellow><bold>Q</bold></yellow> <white>to refund as many levels</white>'
      - ' <italic:false><yellow>▎</yellow> <white>of this enchantment as you can.</white>'
      - ' '
      - '<gray><italic>Click to disenchant</italic></gray>'
  help_item:
    enabled: true
    material: NAME_TAG
    slot: 2
    name: '<yellow><bold>HOW IT WORKS?</bold></yellow>'
    custom_model_data: 0
    lore:
      - '<gray><italic>(( Here you can find how to</italic></gray>'
      - '<gray><italic>(( Here you can find how to</italic></gray>'
      - '<gray><italic>disenchant enchantments ))</italic></gray>'
      - ''
      - '<italic:false><yellow><bold>* </bold></yellow><yellow>Left-Click </yellow><dark_gray>» </dark_gray><white>Disenchant 1 Level</white>'
      - '<italic:false><yellow><bold>* </bold></yellow><yellow>Right-Click </yellow><dark_gray>» </dark_gray><white>Disenchant 10 Levels</white>'
      - '<italic:false><yellow><bold>* </bold></yellow><yellow>Middle-Click </yellow><dark_gray>» </dark_gray><white>Disenchant 100 Levels</white>'
      - '<italic:false><yellow><bold>* </bold></yellow><yellow>Press Q </yellow><dark_gray>» </dark_gray><white>Disenchant MAX</white>'
      - ' '
      - '<gray><italic>(( Click on the enchant to disenchant ))</italic></gray>'
  currency-enchants-items:
    tokens:
      enabled: true
      material: SUNFLOWER
      slot: 48
      custom_model_data: 0
      name: '<yellow><bold>Token Enchants</bold></yellow>'
      lore:
        - '<italic:false><gray>Click to view this category</gray>'
    gems:
      enabled: true
      material: EMERALD
      slot: 49
      custom_model_data: 0
      name: '<green><bold>Gem Enchants</bold></green>'
      lore:
        - '<italic:false><gray>Click to view this category</gray>'
    money:
      enabled: true
      material: PAPER
      slot: 50
      custom_model_data: 100
      name: '<gold><bold>Money Enchants</bold></gold>'
      lore:
        - '<italic:false><gray>Click to view this category</gray>'
