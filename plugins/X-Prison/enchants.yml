# Per-enchant upgrade menu. Opened when a player clicks an enchant in the enchant_menu above.
# Lets players buy a fixed number of levels (or MAX) and personally toggle the enchant on/off.
# %enchant% in the title is the enchant's display name. Enchant-info placeholders
# (%status%, %description%, %current_level%, %max_level%, %chance%, %prestige_info% ...) work in
# enchant_display and prestige_item lore exactly like the main menu.
enchant_upgrade_menu:
  title: '%enchant%'
  lines: 5
  empty_slots: GRAY_STAINED_GLASS_PANE
  # Non-clickable info icon. Uses the enchant's own icon and the main-menu placeholders.
  enchant_display:
    enabled: true
    slot: 4
    lore:
      - '<italic:false><white>%status%</white>'
      - ' '
      - '<italic:false><yellow>Description</yellow>'
      - '<italic:false><gray>%description%</gray>'
      - ' '
      - '<italic:false><yellow>✦ Information</yellow>'
      - ' <italic:false><yellow>▎</yellow> <white>Level: </white><yellow>%current_level%</yellow> <white>/</white> <yellow>%max_level%</yellow>'
      - ' <italic:false><yellow>▎</yellow> <white>Base Activation Chance: </white><yellow>%base_chance%</yellow>'
      - ' <italic:false><yellow>▎</yellow> <white>Your Activation Chance: </white><yellow>%chance%</yellow>'
      - ' <italic:false><yellow>▎</yellow> <white>Next Activation Chance: </white><yellow>%next_chance%</yellow>'
      - ''
      - '%prestige_info%'
      - ''
      - '<italic:false><gray>Unlocks at Pickaxe Level </gray><white><italic>%pickaxe_level%</italic></white>'
  # Upgrade buttons. Each entry buys `amount` levels (an integer) or `max` (as many as you can
  # afford). Add / remove / reorder entries freely - the key name is cosmetic; only `amount`,
  # `slot` & `enabled` are read by the plugin. The rest is a standard config item.
  # Placeholders: %amount% (levels this click buys), %from_level%, %to_level%, %cost%, %currency%, %max_level%.
  upgrade_buttons:
    one:
      enabled: true
      amount: 1
      slot: 20
      material: LIME_STAINED_GLASS_PANE
      custom_model_data: 0
      name: '<green><bold>+%amount% Level</bold></green>'
      lore:
        - ' <italic:false><green>▎</green> <white>Levels: </white><green>%from_level% → %to_level%</green>'
        - ' <italic:false><green>▎</green> <white>Price: </white><green>%cost%</green> <white>%currency%</white>'
        - ''
        - '<italic:false><gray><italic>(( Click to purchase ))</italic></gray>'
    five:
      enabled: true
      amount: 5
      slot: 21
      material: LIME_STAINED_GLASS_PANE
      custom_model_data: 0
      name: '<green><bold>+%amount% Levels</bold></green>'
      lore:
        - ' <italic:false><green>▎</green> <white>Levels: </white><green>%from_level% → %to_level%</green>'
        - ' <italic:false><green>▎</green> <white>Price: </white><green>%cost%</green> <white>%currency%</white>'
        - ''
        - '<italic:false><gray><italic>(( Click to purchase ))</italic></gray>'
    twentyfive:
      enabled: true
      amount: 25
      slot: 22
      material: LIME_STAINED_GLASS_PANE
      custom_model_data: 0
      name: '<green><bold>+%amount% Levels</bold></green>'
      lore:
        - ' <italic:false><green>▎</green> <white>Levels: </white><green>%from_level% → %to_level%</green>'
        - ' <italic:false><green>▎</green> <white>Price: </white><green>%cost%</green> <white>%currency%</white>'
        - ''
        - '<italic:false><gray><italic>(( Click to purchase ))</italic></gray>'
    fifty:
      enabled: true
      amount: 50
      slot: 23
      material: LIME_STAINED_GLASS_PANE
      custom_model_data: 0
      name: '<green><bold>+%amount% Levels</bold></green>'
