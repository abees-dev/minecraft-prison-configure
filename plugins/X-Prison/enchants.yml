# First Join Pickaxe Settings
first-join-pickaxe:
  # Should we give this pickaxe to players when they first join?
  enabled: true
  # Name of pickaxe
  name: '<gray>[<gradient:#FFD700:#FFA500><bold>STARTER PICKAXE</bold></gradient><gray>]'
  # Material of pickaxe
  material: DIAMOND_PICKAXE
  # Raw names + levels of specific enchants for first join pickaxe
  enchants:
    - efficiency 10
    - unbreaking 10
    - fortune 10
    - fly 1
    - tokenfinder 1
    - gemfinder 1
