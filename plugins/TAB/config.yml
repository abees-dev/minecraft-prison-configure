header-footer:
  enabled: true
  designs:
    default:
      display-condition: "%world%!=disabledworld"
      header:
        - <gradient:#FFD54F:#FF8A3D><strikethrough>                                                    </strikethrough></gradient>
        - <gradient:#FFD54F:#FF8A3D><bold>⛏ AETHER MINE ⛏</bold></gradient>
        - <#FFF3D6>PRISON <#FFD54F>✦ <#B9F6CA>RPG <#FFD54F>✦ <#FFB3CD>BANG HỘI
        - "<#FFFFFF>Chào mừng <#FFD54F><bold>%player%</bold> <#FFFFFF>đến với máy chủ!"
        - "<#BDE8FF>◉ Online <#FFFFFF>%online% <#FFD54F>│ <#FFB3CD>★ Staff <#FFFFFF>%staffonline% <#FFD54F>│ <#B9F6CA>⌁ TPS <#FFFFFF>%tps%"
        - " "
      footer:
        - " "
        - "<#BDE8FF>⌁ Ping <#FFFFFF>%ping%ms <#FFD54F>│ <#FFF3D6>%date% <#FFD54F>• <#FFFFFF>%time%"
        - "<#FFFFFF>IP máy chủ: <#FFD54F><bold>%animation:web%</bold>"
        - <#FFF3D6>Tham gia cộng đồng và chinh phục mọi khu mỏ!
        - <gradient:#FF8A3D:#FFD54F><strikethrough>                                                    </strikethrough></gradient>
tablist-name-formatting:
  enabled: true
  disable-condition: "%world%=disabledworld"
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
    - GROUPS:owner,admin,mod,helper,builder,legend,elite,mvpplus,mvp,vipplus,vip,xprison_rank_9,xprison_rank_8,xprison_rank_7,xprison_rank_6,xprison_rank_5,xprison_rank_4,xprison_rank_3,xprison_rank_2,xprison_rank_1,default
    - PLACEHOLDER_A_TO_Z:%player%
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: "%world%=disabledworld"
playerlist-objective:
  enabled: true
  value: "%ping%"
  fancy-value: "<#BDE8FF>⌁ <#FFFFFF>%ping%ms"
  disable-condition: "%world%=disabledworld"
  title: Ping
  render-type: INTEGER
belowname-objective:
  enabled: true
  value: "%mmocore_level%"
  title: "&eCấp độ"
  fancy-value: "&eLv. &f%mmocore_level%"
  fancy-value-default: NPC
  disable-condition: "%world%=disabledworld"
prevent-spectator-effect:
  enabled: false
bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      style: PROGRESS
      color: "%animation:barcolors%"
      progress: "100"
      text: "&fWebsite: &bwww.domain.com"
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  delay-on-join-milliseconds: 0
  scoreboards:
    scoreboard-1.20.3+:
      title: <gradient:#FFD54F:#FF8A3D><bold>⛏ AETHER MINE ⛏</bold></gradient>
      display-condition: '%player-version-id%>=765;%bedrock%=false'
      lines:
      - ' <#FFD54F>✦ <#FFFFFF><bold>%player%</bold> %luckperms-suffix%'
      - ' <#FFF3D6>┃ <#FFD180>Cấp tù <#FFFFFF>› %group%'
      - ' <#FFF3D6>┃ <#80D8FF>Cấp độ <#FFFFFF>› <bold>%mmocore_level%</bold> <#DDEEFF>· %mmocore_class%'
      - ' <#FFF3D6>┃ <#B9F6CA>Kinh nghiệm <#FFFFFF>› <#B9F6CA>%mmocore_level_percent%%'
      - ' '
      - ' <#FF80AB>◆ <#FFFFFF><bold>BANG HỘI</bold>'
      - ' <#FFE4EE>┃ <#FFB3CD>Tên bang <#FFFFFF>› %condition:gang_name_val%'
      - '%condition:gang_detail_line%'
      - '%condition:gang_rep_line%'
      - ' '
      - ' <#69F0AE>◆ <#FFFFFF><bold>TÀI SẢN</bold>'
      - ' <#E4FFF0>┃ <#8EFFBE>Money <#FFFFFF>› <#C8FFD9><bold>%vault_eco_balance_formatted%</bold>'
      - ' <#E4F5FF>┃ <#82D4FF>Point <#FFFFFF>› <#BDE8FF><bold>%playerpoints_points_formatted%</bold>'
      - <#FFB74D><strikethrough>                     </strikethrough>
      - ' <#FFFFFF>%date% <#FFD54F>• <#FFFFFF>%time% <#FFD54F>• <#BDE8FF>%ping%ms'
    scoreboard:
      title: <gradient:#FFD54F:#FF8A3D><bold>⛏ AETHER MINE ⛏</bold></gradient>
      lines:
      - ' <#FFD54F>✦ <#FFFFFF><bold>%player%</bold> %luckperms-suffix%'
      - ' <#FFF3D6>┃ <#FFD180>Cấp tù <#FFFFFF>› %group%'
      - ' <#FFF3D6>┃ <#80D8FF>Cấp độ <#FFFFFF>› <bold>%mmocore_level%</bold> <#DDEEFF>· %mmocore_class%'
      - ' <#FFF3D6>┃ <#B9F6CA>Kinh nghiệm <#FFFFFF>› <#B9F6CA>%mmocore_level_percent%%'
      - ' '
      - ' <#FF80AB>◆ <#FFFFFF><bold>BANG HỘI</bold>'
      - ' <#FFE4EE>┃ <#FFB3CD>Tên bang <#FFFFFF>› %condition:gang_name_val%'
      - '%condition:gang_detail_line%'
      - '%condition:gang_rep_line%'
      - ' '
      - ' <#69F0AE>◆ <#FFFFFF><bold>TÀI SẢN</bold>'
      - ' <#E4FFF0>┃ <#8EFFBE>Money <#FFFFFF>› <#C8FFD9><bold>%vault_eco_balance_formatted%</bold>'
      - ' <#E4F5FF>┃ <#82D4FF>Point <#FFFFFF>› <#BDE8FF><bold>%playerpoints_points_formatted%</bold>'
      - <#FFB74D><strikethrough>                     </strikethrough>
      - ' <#FFFFFF>%date% <#FFD54F>• <#FFFFFF>%time% <#FFD54F>• <#BDE8FF>%ping%ms'
layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:383747683
  enable-remaining-players-text: true
  remaining-players-text: "... and %s more"
  empty-slot-ping-value: 1000
  layouts:
    default:
      fixed-slots:
        - "1|&3Website&f:"
        - 2|&bmyserver.net
        - "3|&8&m                       "
        - "4|&3Name&f:"
        - 5|&b%player%
        - "7|&3Rank&f:"
        - "8|Rank: %group%"
        - "10|&3World&f:"
        - 11|&b%world%
        - "13|&3Time&f:"
        - 14|&b%time%
        - "21|&3Teamspeak&f:"
        - 22|&bts.myserver.net
        - "23|&8&m                       "
        - "41|&3Store&f:"
        - 42|&bshop.myserver.net
        - "43|&8&m                       "
      groups:
        staff:
          slots:
            - 24-40
          display-condition: permission:tab.staff
        players:
          slots:
            - 44-80
ping-spoof:
  enabled: false
  value: 0
placeholders:
  date-format: dd.MM.yyyy
  time-format: HH:mm
  time-offset: 0
  register-tab-expansion: false
  locale: en-US
placeholder-output-replacements:
  "%essentials_vanished%":
    "yes": "&7| Vanished"
    "no": ""
  "%group%":
    xprison_rank_1: "<#F5F5F5><bold>[Tân Binh]</bold>"
    xprison_rank_2: "<#B0B0B0><bold>[Tù Nhân]</bold>"
    xprison_rank_3: "<#7DCEA0><bold>[Lao Công]</bold>"
    xprison_rank_4: "<#52BE80><bold>[Thợ Đào]</bold>"
    xprison_rank_5: "<#5DADE2><bold>[Đội Trưởng]</bold>"
    xprison_rank_6: "<#5499C7><bold>[Phó Quản Ngục]</bold>"
    xprison_rank_7: "<#AF7AC5><bold>[Quản Ngục]</bold>"
    xprison_rank_8: "<#F4D03F><bold>[Bá Chủ Ngục Tù]</bold>"
    xprison_rank_9: "<#E74C3C><bold>[Vượt Ngục]</bold>"
    vip: "<#58D68D><bold>[VIP]</bold>"
    vipplus: "<#48C9B0><bold>[VIP+]</bold>"
    mvp: "<#5DADE2><bold>[MVP]</bold>"
    mvpplus: "<#AF7AC5><bold>[MVP+]</bold>"
    elite: "<#F5B041><bold>[ELITE]</bold>"
    legend: "<gradient:#FF6B6B:#FFD93D><bold>[LEGEND]</bold></gradient>"
    default: "<#F2F2F2>-"
  "%core_gang_role%":
    LEADER: "<#FFD966>Chủ Bang"
    CO_LEADER: "<#AED6F1>Phó Bang"
    MEMBER: "<#D5D5D5>Thành viên"
conditions:
  nick:
    conditions:
      - "%player%=%essentials_nickname%"
    true: "%player%"
    false: ~%essentials_nickname%
  gang_name_val:
    conditions:
      - "%core_gang_name%!="
    true: "<#FFFFFF>%core_gang_name% <#F2F2F2>[%core_gang_prefix%]"
    false: "<#E0E0E0>Chưa có bang"
  gang_detail_line:
    conditions:
      - "%core_gang_name%!="
    true: ' <#FFE4EE>┃ <#FFB3CD>Vai trò <#FFFFFF>› %core_gang_role% <#FFFFFF>· <#FFB3CD>Lv.%core_gang_level%'
    false: ''
  gang_rep_line:
    conditions:
    - '%core_gang_name%!='
    true: ' <#FFE4EE>┃ <#FFB3CD>Danh vọng <#FFFFFF>› <#FFD6E4>%core_gang_reputation%'
    false: ''
assign-groups-by-permissions: false
primary-group-finding-list:
  - Owner
  - Admin
  - Mod
  - Helper
  - default
permission-refresh-interval: 1000
debug: false
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
  useSSL: true
per-world-playerlist:
  enabled: false
  allow-bypass-permission: false
  ignore-effect-in-worlds:
    - ignoredworld
    - build
  shared-playerlist-world-groups:
    lobby:
      - lobby1
      - lobby2
    minigames:
      - paintball
      - bedwars
compensate-for-packetevents-bug: false
global-playerlist:
  enabled: false
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  update-latency: false
  spy-servers:
    - spyserver1
    - spyserver2
  server-groups:
    lobbies:
      - lobby1
      - lobby2
    group2:
      - server1
      - server2
use-bukkit-permissions-manager: false
use-online-uuid-in-tablist: true
proxy-support:
  enabled: true
  type: PLUGIN
  plugin:
    name: RedisBungee
  redis:
    url: redis://:password@localhost:6379/0
  rabbitmq:
    exchange: plugin
    url: amqp://guest:guest@localhost:5672/%2F
  channel-name-suffix: TAB
placeholder-refresh-intervals:
  default-refresh-interval: 500
  "%server_uptime%": 1000
  "%server_tps_1_colored%": 1000
  "%server_unique_joins%": 5000
  "%player_health%": 200
  "%player_ping%": 1000
  "%vault_prefix%": 1000
  "%rel_factionsuuid_relation_color%": 1000
  "%core_gang_name%": 2000
  "%core_gang_prefix%": 2000
  "%core_gang_level%": 2000
  "%core_gang_role%": 2000
  "%core_gang_reputation%": 2000
  "%vault_eco_balance_formatted%": 1000
  "%playerpoints_points_formatted%": 1000
  "%mmocore_level%": 1000
  "%mmocore_level_percent%": 1000
  "%mmocore_class%": 2000
config-version: 6
components:
  minimessage-support: true
  disable-shadow-for-heads: true
