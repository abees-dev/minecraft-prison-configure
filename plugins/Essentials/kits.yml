      - /eco give {USERNAME} 1000000
      - /mmoitems give MATERIAL DA_CUONG_HOA_VU_KHI_SIEU_CAP {USERNAME} 10
      - /mmoitems give MATERIAL DA_CUONG_HOA_GIAP_SIEU_CAP {USERNAME} 10
      - /mmoitems give MATERIAL DA_DUC_LO_4 {USERNAME} 4
      - /mmoitems give MATERIAL HUY_HIEU_TRIEU_HOI {USERNAME} 2
      - /mmoitems give MATERIAL NEN_DOI_BA_CHU_NGUC_TU {USERNAME} 25

  elite:
    delay: 86400
    items:
      - /eco give {USERNAME} 2500000
      - /mmoitems give MATERIAL DA_CUONG_HOA_VU_KHI_THAN_CAP {USERNAME} 12
      - /mmoitems give MATERIAL DA_CUONG_HOA_GIAP_THAN_CAP {USERNAME} 12
