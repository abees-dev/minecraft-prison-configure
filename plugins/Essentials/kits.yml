# EssentialsX kit configuration.
# Tất cả Kit VIP & Rank 9 đã được chuyển hoàn toàn sang sử dụng MMOItems cao cấp:
# - Đá Cường Hóa Vũ Khí & Giáp (Sơ cấp -> Thần cấp)
# - Đá Đục Lỗ (DA_DUC_LO_1 -> DA_DUC_LO_THIEN_MENH)
# - Item Triệu Hồi Boss Ngục Tù (Mảnh Huy Hiệu, Huy Hiệu Triệu Hồi Boss, Tinh Thể Hủy Diệt)
# - Quặng Tinh Luyện & Đại Tinh Luyện Trade Đồ Prison (NEN_DOI_X, NEN_BA_VUOT_NGUC)
# - Tiền Money thưởng trực tiếp qua Vault (/eco give)

kits:
  tools:
    delay: 10
    items:
      - stonesword 1
      - stoneshovel 1
      - stonepickaxe 1
      - stoneaxe 1

  # =============================================================================
  # KIT TÂN BINH (first join + /kit tanbinh mỗi 24h)
  # =============================================================================
  tanbinh:
    delay: 86400
    items:
      - /mmoitems give ARMOR HELMET_TAN_BINH_1 {USERNAME} 1
      - /mmoitems give ARMOR CHESTPLATE_TAN_BINH_1 {USERNAME} 1
      - /mmoitems give ARMOR LEGGINGS_TAN_BINH_1 {USERNAME} 1
      - /mmoitems give ARMOR BOOTS_TAN_BINH_1 {USERNAME} 1
      - /mmoitems give SWORD SWORD_TAN_BINH_1 {USERNAME} 1
      - bread 16
      - goldenapple 2

  dtools:
    delay: 600
    items:
      - dpickaxe 1 efficiency:1 durability:1 fortune:1 name:&4Gigadrill lore:The_drill_that_&npierces|the_heavens
      - dshovel 1 digspeed:3 name:Dwarf lore:Diggy|Diggy|Hole
      - lhelm 1 color:255,255,255 name:Top_Hat lore:Good_day,_Good_day
      - daxe:780 1
      - /broadcast {USERNAME} just got some fancy tools!
  notch:
    delay: 6000
    items:
      - playerhead 1 player:Notch
  color:
    delay: 6000
    items:
      - writtenbook 1 title:&4Book_&9o_&6Colors author:KHobbits lore:Ingame_color_codes book:Colors
  firework:
    delay: 6000
    items:
      - fireworkrocket 1 name:Angry_Creeper color:red fade:green type:creeper power:1
      - fireworkrocket 1 name:Starry_Night color:yellow,orange fade:blue type:star effect:trail,twinkle power:1
      - fireworkrocket 2 name:Solar_Wind color:yellow,orange fade:red shape:large effect:twinkle color:yellow,orange fade:red shape:ball effect:trail color:red,purple fade:pink shape:star effect:trail power:1

  # =============================================================================
  # VIP DONOR RANK KITS (MMOITEMS ONLY - KHÔNG ĐỒ VANILLA)
  # =============================================================================
  vip:
    delay: 86400
    items:
      - /eco give {USERNAME} 100000
      - /mmoitems give MATERIAL DA_CUONG_HOA_VU_KHI_SO_CAP {USERNAME} 5
      - /mmoitems give MATERIAL DA_CUONG_HOA_GIAP_SO_CAP {USERNAME} 5
      - /mmoitems give MATERIAL DA_DUC_LO_1 {USERNAME} 2
      - /mmoitems give MATERIAL NEN_DOI_DOI_TRUONG {USERNAME} 10

  vipplus:
