      - /mmoitems give MATERIAL DA_CUONG_HOA_VU_KHI_TRUNG_CAP {USERNAME} 5
      - /mmoitems give MATERIAL DA_CUONG_HOA_GIAP_TRUNG_CAP {USERNAME} 5
      - /mmoitems give MATERIAL DA_DUC_LO_2 {USERNAME} 2
      - /mmoitems give MATERIAL MANH_HUY_HIEU_TRIEU_HOI {USERNAME} 3
      - /mmoitems give MATERIAL NEN_DOI_PHO_QUAN_NGUC {USERNAME} 15

