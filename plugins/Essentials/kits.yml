      - /mmoitems give MATERIAL DA_DUC_LO_3 {USERNAME} 3
      - /mmoitems give MATERIAL HUY_HIEU_TRIEU_HOI {USERNAME} 1
      - /mmoitems give MATERIAL NEN_DOI_QUAN_NGUC {USERNAME} 20

  mvpplus:
