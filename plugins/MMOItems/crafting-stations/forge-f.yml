
# Name which will be displayed
# when opening the station
name: 'Lò Rèn Phó Quản Ngục (#page#/#max#)'

# The maximum amount of items in the crafting queue ie. the
# max number of items players are able to craft simultaneously.
# Must be between 1 and 64.
max-queue-size: 10

# The sound that plays whenever an action is
# completed in the crafting station.
sound: ENTITY_EXPERIENCE_ORB_PICKUP

# This is how the gui looks. You can define your own
# in crafting-stations/layouts by creating a new
# file with the name of the file as the id.
layout: default

# Configure GUI items here
items:
    fill:
        material: AIR
    no-recipe:
        material: GRAY_STAINED_GLASS_PANE
        name: '&aNo Recipe'
    no-queue-item:
        material: GRAY_STAINED_GLASS_PANE
        name: '&aNo Item in Queue'

# Tram craft rieng cho mo F (rank Phó Quản Ngục) - chi chua recipe cua rank nay,
# khong cho craft/nang cap do cua rank khac. Xem docs/prison-rpg-plan.md.
recipes:
    che-da-pho-quan-nguc:
        output:
            type: MATERIAL
            id: DA_NANG_CAP_PHO_QUAN_NGUC
            amount: 1
        crafting-time: 3
        ingredients:
        - vanilla{type=REDSTONE,amount=16,display="Redstone"}
    nangcap-pho-quan-nguc-1-2:
        output:
            type: TOOL
            id: PICKAXE_PHO_QUAN_NGUC_2
            amount: 1
        crafting-time: 5
        ingredients:
        - mmoitem{type=TOOL,id=PICKAXE_PHO_QUAN_NGUC_1,amount=1,display="Cuốc Phó Quản Ngục I"}
        - mmoitem{type=MATERIAL,id=DA_NANG_CAP_PHO_QUAN_NGUC,amount=2,display="Đá Nâng Cấp Phó Quản Ngục"}
    nangcap-pho-quan-nguc-2-3:
        output:
            type: TOOL
            id: PICKAXE_PHO_QUAN_NGUC_3
            amount: 1
        crafting-time: 5
        ingredients:
        - mmoitem{type=TOOL,id=PICKAXE_PHO_QUAN_NGUC_2,amount=1,display="Cuốc Phó Quản Ngục II"}
        - mmoitem{type=MATERIAL,id=DA_NANG_CAP_PHO_QUAN_NGUC,amount=3,display="Đá Nâng Cấp Phó Quản Ngục"}
    nangcap-pho-quan-nguc-3-4:
        output:
            type: TOOL
            id: PICKAXE_PHO_QUAN_NGUC_4
            amount: 1
        crafting-time: 5
