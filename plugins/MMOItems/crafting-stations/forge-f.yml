        - mmoitem{type=MATERIAL,id=DA_NANG_CAP_PHO_QUAN_NGUC,amount=4,display="Đá Nâng Cấp Phó Quản Ngục"}
    nangcap-pho-quan-nguc-4-5:
        output:
            type: TOOL
            id: PICKAXE_PHO_QUAN_NGUC_5
