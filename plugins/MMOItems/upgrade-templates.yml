# Template ID, only used as reference. This is the
# text you need to enter in the edition GUI in order
# to setup item upgrading for a specific item.
weapon-upgrade-template:
  attack-damage: 1.0
  physical-damage: 0.4

armor-upgrade-template:
  # Applied to every equipped piece: a full +100 set grants +2000 health,
  # +140 toughness and +700 defense. Base armor remains capped at 30 and is
  # intentionally not upgraded because every point past that cap is wasted.
  max-health: 5.0
  armor-toughness: 0.35
  defense: 1.75

weapon-default:
  attack-damage: 1.0
  physical-damage: 0.4

armor-template-example:
  armor: 3%
  armor-toughness: 2%
  block-rating: 5%
  dodge-rating: 5%
  parry-rating: 5%

test-enchant-template:
  enchants:
    - 'EFFICIENCY +1'

# Template nâng cấp Vanilla Enchantment mẫu
vanilla-enchant-upgrade:
  enchants:
    - 'EFFICIENCY +1'     # Tăng cấp Eficiency (Hiệu Suất) +1 mỗi cấp
    - 'FORTUNE +1'        # Tăng cấp Fortune (Gia Tăng) +1 mỗi cấp
    - 'UNBREAKING +1'     # Tăng cấp Unbreaking (Bền Bỉ) +1 mỗi cấp
    - 'SHARPNESS +1'      # Tăng cấp Sharpness (Sắc Bén) +1 mỗi cấp
    - 'PROTECTION +1'     # Tăng cấp Protection (Bảo Vệ) +1 mỗi cấp

