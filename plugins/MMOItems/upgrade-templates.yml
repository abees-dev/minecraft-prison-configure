# Template ID, only used as reference. This is the
# text you need to enter in the edition GUI in order
# to setup item upgrading for a specific item.
weapon-default:
  # Every time the item is upgraded, its attack damage
  # is increased by 3% (relative to the current value)
  attack-damage: 3%

  # Every time it is upgraded, it gets +2% aboslute
  # critical strike chance (independant of current val.)
  critical-strike-chance: 2

  pve-damage: 1%

armor-template-example:
  armor: 3%
  armor-toughness: 2%
  block-rating: 5%
  dodge-rating: 5%
  parry-rating: 5%

test-enchant-template:
  enchants:
    - 'EFFICIENCY +1'

# Template nâng cấp Vanilla Enchantment mẫu
vanilla-enchant-upgrade:
  enchants:
    - 'EFFICIENCY +1'     # Tăng cấp Eficiency (Hiệu Suất) +1 mỗi cấp
    - 'FORTUNE +1'        # Tăng cấp Fortune (Gia Tăng) +1 mỗi cấp
    - 'UNBREAKING +1'     # Tăng cấp Unbreaking (Bền Bỉ) +1 mỗi cấp
    - 'SHARPNESS +1'      # Tăng cấp Sharpness (Sắc Bén) +1 mỗi cấp
    - 'PROTECTION +1'     # Tăng cấp Protection (Bảo Vệ) +1 mỗi cấp

# Template nâng cấp chỉ số & enchant cho Cúp Tân Binh
pickaxe-tan-binh-template:
  pickaxe-power: 1
  custom-miningefficiency: 0.5
  custom-miningfortune: 0.25
  custom-miningunbreaking: 0.25
  enchants:
    - 'EFFICIENCY +0.5'
    - 'FORTUNE +0.25'
    - 'UNBREAKING +0.25'

