# Lore format riêng cho vũ khí (Kiếm, Rìu Chiến, Trượng Phép).
# Gán vào item bằng: lore-format: weapon-lore
lore-format:
  - '{bar}&8&m----------------------------'
  - '&c&l⚔ Chỉ Số Tấn Công'
  - '#attack-damage#'
  - '#attack-speed#'
  - '#critical-strike-chance#'
  - '#critical-strike-power#'
  - '#magic-damage#'
  - '#lifesteal#'
  - '#spell-vampirism#'
  - '#knockback#'
  - '#two-handed#'
  - '#mana-cost#'
  - '#stamina-cost#'
  - '#additional-strength#'
  - '#additional-intelligence#'
  - '{bar}'
  - '#lore#'
  - '{sbar}&8&m----------------------------'
  - '#tier#'
  - '#durability#'
  - '#item-type#'
