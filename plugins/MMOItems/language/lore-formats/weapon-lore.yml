# Lore format — Vũ khí (Kiếm, Rìu, Trượng, Dao Găm, ...)
# Quy tắc {bar}: KHÔNG đặt 2 dòng {bar} liền nhau.
# Gán: lore-format: weapon-lore
lore-format:
  # ==================== Yêu Cầu ====================
  - "{bar}&r \n&8&m┄┄┄┄┄┄┄&r &7&l❖ YÊU CẦU &8&m┄┄┄┄┄┄┄"
  - "#required-class#"
  - "#required-level#"
  - "#required-dexterity#"
  - "#required-strength#"
  - "#required-intelligence#"
  - "#soulbound#"

  # ==================== Chỉ Số Tấn Công ====================
  - "{bar}&r \n&8&m┄┄┄┄┄&r &c&l⚔ CHỈ SỐ TẤN CÔNG &8&m┄┄┄┄┄"
  - "#attack-damage#"
  - "#attack-speed#"
  - "#critical-strike-chance#"
  - "#critical-strike-power#"
  - "#skill-critical-strike-chance#"
  - "#skill-critical-strike-power#"
  - "#range#"
  - "#arrow-velocity#"
  - "#blunt-power#"
  - "#blunt-rating#"
  - "#knockback#"
  - "#recoil#"
  - "#note-weight#"
  - "#lifesteal#"
  - "#spell-vampirism#"
  - "#two-handed#"
  - "#handworn#"
  - "#mana-cost#"
  - "#stamina-cost#"

  # ==================== Sát Thương Bổ Sung ====================
  - "{bar}&r \n&8&m┄┄┄┄┄&r &6&l💥 SÁT THƯƠNG BỔ SUNG &8&m┄┄┄┄┄"
  - "#weapon-damage#"
  - "#magic-damage#"
  - "#skill-damage#"
  - "#physical-damage#"
  - "#projectile-damage#"
  - "#pve-damage#"
  - "#pvp-damage#"
  - "#undead-damage#"
  - "#faction-damage-undead#"

  # ==================== Thuộc Tính ====================
  - "{bar}&r \n&8&m┄┄┄┄┄┄&r &e&l✨ THUỘC TÍNH &8&m┄┄┄┄┄┄"
  - "#max-health#"
  - "#max-mana#"
  - "#max-stamina#"
  - "#health-regeneration#"
  - "#mana-regeneration#"
  - "#stamina-regeneration#"
  - "#movement-speed#"
  - "#cooldown-reduction#"
  - "#additional-dexterity#"
  - "#additional-strength#"
  - "#additional-intelligence#"

  # ==================== Nguyên Tố & Hiệu Ứng ====================
  - "{bar}&r \n&8&m┄┄┄┄┄&r &2&l☄ NGUYÊN TỐ & HIỆU ỨNG &8&m┄┄┄┄┄"
  - "#elements#"
  - "#effects#"

  # ==================== Kỹ Năng ====================
  - "{bar}&r \n&8&m┄┄┄┄┄&r &a&l⚡ KỸ NĂNG VŨ KHÍ &8&m┄┄┄┄┄"
  - "#abilities#"

  # ==================== Đá Quý ====================
  - "{bar}&r \n&8&m┄┄┄┄┄&r &d&l🔮 Ô KHẢM ĐÁ QUÝ &8&m┄┄┄┄┄"
  - "#custom-maxsockets#"
  - "#gem-stones#"
  - "#gem-stone-lore#"

  # ==================== Mô Tả ====================
  - "{bar}&r \n&8&m┄┄┄┄┄┄┄&r &f&l✦ MÔ TẢ &8&m┄┄┄┄┄┄┄"
  - "#lore#"
  - "#set#"

  # ==================== Footer ====================
  - "{sbar}&8&m┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄"
  - "#tier#"
  - "#durability#"
  - "#item-type#"
