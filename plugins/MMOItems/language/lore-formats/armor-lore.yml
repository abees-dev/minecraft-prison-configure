# Lore format — Giáp
# Quy tắc {bar}: KHÔNG đặt 2 dòng {bar} liền nhau (dòng trên sẽ bị xóa).
# Blank + tiêu đề gộp trong 1 {bar} bằng \n để giữ khoảng cách động giữa các section.
# Gán: lore-format: armor-lore
lore-format:
  # ==================== Yêu Cầu ====================
  - "{bar}&r \n&8&m┄┄┄┄┄┄┄&r &7&l❖ YÊU CẦU &8&m┄┄┄┄┄┄┄"
  - "#required-class#"
  - "#required-level#"
  - "#required-dexterity#"
  - "#required-strength#"
  - "#required-intelligence#"
  - "#soulbound#"

  # ==================== Chỉ Số Giáp ====================
  - "{bar}&r \n&8&m┄┄┄┄┄┄&r &b&l🛡 CHỈ SỐ GIÁP &8&m┄┄┄┄┄┄"
  - "#armor#"
  - "#armor-toughness#"
  - "#max-health#"
  - "#defense#"
  - "#damage-reduction#"
  - "#fall-damage-reduction#"
  - "#fire-damage-reduction#"
  - "#magic-damage-reduction#"
  - "#projectile-damage-reduction#"
  - "#physical-damage-reduction#"
  - "#pve-damage-reduction#"
  - "#pvp-damage-reduction#"
  - "#knockback-resistance#"
  - "#block-power#"
  - "#block-rating#"
  - "#dodge-rating#"
  - "#parry-rating#"
  - "#block-cooldown-reduction#"
  - "#dodge-cooldown-reduction#"
  - "#parry-cooldown-reduction#"

  # ==================== Thuộc Tính & Hồi Phục ====================
  - "{bar}&r \n&8&m┄┄┄┄&r &e&l✨ THUỘC TÍNH & HỒI PHỤC &8&m┄┄┄┄"
  - "#health-regeneration#"
  - "#max-mana#"
  - "#mana-regeneration#"
  - "#max-stamina#"
  - "#stamina-regeneration#"
  - "#movement-speed#"
  - "#cooldown-reduction#"
  - "#additional-dexterity#"
  - "#additional-strength#"
  - "#additional-intelligence#"

  # ==================== Nguyên Tố & Hiệu Ứng ====================
  - "{bar}&r \n&8&m┄┄┄┄┄&r &2&l☄ NGUYÊN TỐ & HIỆU ỨNG &8&m┄┄┄┄┄"
  - "#elements#"
  - "#effects#"

  # ==================== Kỹ Năng ====================
  - "{bar}&r \n&8&m┄┄┄┄┄&r &a&l⚡ KỸ NĂNG ĐẶC BIỆT &8&m┄┄┄┄┄"
  - "#abilities#"

  # ==================== Đá Quý ====================
  - "{bar}&r \n&8&m┄┄┄┄┄&r &d&l🔮 Ô KHẢM ĐÁ QUÝ &8&m┄┄┄┄┄"
  - "#custom-maxsockets#"
  - "#gem-stones#"
  - "#gem-stone-lore#"

  # ==================== Mô Tả ====================
  - "{bar}&r \n&8&m┄┄┄┄┄┄┄&r &f&l✦ MÔ TẢ &8&m┄┄┄┄┄┄┄"
  - "#lore#"
  - "#set#"

  # ==================== Footer ====================
  - "{sbar}&8&m┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄"
  - "#tier#"
  - "#durability#"
  - "#item-type#"
