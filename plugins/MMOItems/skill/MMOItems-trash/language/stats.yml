faction-damage-undead: '&8[&7☠&8] &7FACTION (UNDEAD): &6+{value}%' # Yellow for Faction Damage (Undead)

# Abilities
ability-format: '&a>&8| &7{trigger} &8|&e|&8| &7&l{ability}'
