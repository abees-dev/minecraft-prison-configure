# Extra Options
perm-effect: '&7Permanent Effect: {effect}'
command: '&7Command: {format} &7(&7{cooldown}&7s)'
item-cooldown: '&7Item Cooldown: &6{value}s' # Yellow for Item Cooldown
arrow-potion-effects: '&7Arrow Potion Effects: {effect}'

# Consumables
restore-health: '&7Restore &c{value} Health' # Red for Health Restore
restore-food: '&7Restore {value} Food'
