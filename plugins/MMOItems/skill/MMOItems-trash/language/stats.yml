filled-gem-socket: '&a◆ {name}'
when-applied: '&aWhen Applied:'
gem-stone-lore: '&8&l[&2&l*&8&l] &aDrag into item &7to apply!'

# Soulbound
soulbinding-chance: '&7Soulbind Chance: &a{value}%' # Green for Soulbind
soulbound-break-chance: '&7Soulbind Break Chance: &a{value}%' # Green for Soulbind Break
soulbound-level: '&7Soulbound Level &e{value}' # Yellow for Soulbound

# Tools
autosmelt: '&7Auto Smelt'
bouncing-crack: '&7Bouncing Crack'
pickaxe-power: '&7Pickaxe Power: &a{value}'
