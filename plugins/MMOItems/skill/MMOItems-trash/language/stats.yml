# Weapon Stats
attack-damage: '&8[&c🗡&8] &7ATK: &c{value}' # Red for Attack Damage
attack-speed: '&8[&c⚔&8] &7ATS: &c{value}' # Red for Attack Speed
critical-strike-chance: '&8[&6⚡&8] &7CRIT: &6+{value}%' # Yellow for Critical Chance
critical-strike-power: '&8[&6⚡&8] &7CRIT DMG: &6+{value}%' # Yellow for Critical Damage
skill-critical-strike-chance: '&8[&6⚡&8] &7SKILL CRIT: &6+{value}%' # Yellow for Skill Critical Chance
skill-critical-strike-power: '&8[&6⚡&8] &7SKILL CRIT DMG: &6+{value}%' # Yellow for Skill Critical Damage
range: '&8[&6📏&8] &7RANGE: &6{value}' # Yellow for Range
mana-cost: '&8[&9💧&8] &7MP COST: &9{value}' # Blue for Mana
stamina-cost: '&8[&9💪&8] &7STAMINA: &9{value}' # Blue for Stamina
arrow-velocity: '&8[&6🏹&8] &7ARROW SPD: &6{value}' # Yellow for Arrow Speed
blunt-power: '&8[&6💥&8] &7BLUNT PWR: &6{value}' # Yellow for Blunt Power
blunt-rating: '&8[&6💥&8] &7BLUNT RATE: &6{value}%' # Yellow for Blunt Rating
two-handed: '&8[&c✖&8] &7TWO-HANDED' # Red for Two-Handed
handworn: '&8[&7✋&8] &7HANDWORN' # Gray for Handworn
knockback: '&8[&6🌀&8] &7KB: &6{value}' # Yellow for Knockback
recoil: '&8[&6🔄&8] &7RECOIL: &6{value}%' # Yellow for Recoil
note-weight: '&8[&6🎵&8] &7NOTE WGT: &6{value}' # Yellow for Note Weight
lifesteal: '&8[&c❤&8] &7LIFESTEAL: &c+{value}%' # Red for Lifesteal
spell-vampirism: '&8[&c🧙&8] &7SPELL VAMP: &c+{value}%' # Red for Spell Vamp

# Extra Damage
pve-damage: '&8[&7⚔&8] &7PvE: &6+{value}%' # Yellow for PvE Damage
pvp-damage: '&8[&7⚔&8] &7PvP: &6+{value}%' # Yellow for PvP Damage
magic-damage: '&8[&7✨&8] &7MAGIC: &6+{value}%' # Yellow for Magic Damage
weapon-damage: '&8[&7🗡&8] &7WEAPON: &6+{value}%' # Yellow for Weapon Damage
undead-damage: '&8[&7☠&8] &7UNDEAD: &6+{value}%' # Yellow for Undead Damage
