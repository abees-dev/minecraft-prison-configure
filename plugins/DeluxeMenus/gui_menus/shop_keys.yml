  # --- Trang Sức Free: Money ---
  'buy_trang_suc':
    material: TRIPWIRE_HOOK
    slot: 10
    glow: true
    hide_attributes: true
    display_name: '&a&l❖ Chìa Trang Sức Miễn Phí'
    lore:
      - '&7Giá: &a5,000,000 Money'
      - '&7Nhận: &f1x Chìa Trang Sức Miễn Phí'
      - '&7Mở: &aHòm Trang Sức Miễn Phí'
      - ''
      - '&7Số dư: &a%vault_eco_balance_formatted% &7money'
      - ''
      - '&e» Click để mua'
    left_click_requirement:
      requirements:
        balance_check:
          type: has money
          amount: 5000000
          deny_commands:
            - '[message] &c&lSHOP &7» Không đủ Money! Cần &a5,000,000&7, hiện có &a%vault_eco_balance_formatted%&7.'
    left_click_commands:
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[console] eco take %player_name% 5000000'
      - '[console] crates key give %player_name% chia_khoa_trang_suc_free 1'
      - '[message] &a&lSHOP &7» Đã mua &a1x Chìa Trang Sức Miễn Phí &7(-&a5,000,000&7 Money).'
      - '[refresh]'

