  'info':
    material: NETHER_STAR
    slot: 4
    glow: true
    hide_attributes: true
    display_name: '&6&l✦ CHÌA KHÓA'
    lore:
      - '&7Mua chìa bằng &bPoint &7hoặc &aMoney&7.'
      - '&7Hoặc đổi &eẤn Tín Long Tộc &7→ chìa Long Tộc.'
