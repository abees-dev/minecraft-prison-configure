# =============================================================================
# MASTER RANK GUI - DeluxeMenus Unified Menu
# Command: /rank, /rankmenu, /viprank, /vipranks, /vip
# (KHÔNG dùng /ranks vì trùng lệnh gốc của X-Prison)
# Combined Prison Ranks (1-9) & VIP Donor Ranks (1-6)
# =============================================================================
menu_title: '&8❖ &6&lHỆ THỐNG RANKS & VIP &8❖'
open_command:
  # KHÔNG dùng "ranks" ở đây: X-Prison tự đăng ký sẵn lệnh /ranks (GUI mặc định
  # của plugin) nên nếu trùng tên, DeluxeMenus sẽ bị đẩy lệnh xuống dạng
  # /deluxemenus:ranks và menu tự thiết kế này sẽ không mở được bằng /ranks.
  - rank
  - rankmenu
  - viprank
  - vipranks
  - vip
open_commands:
  - '[sound] BLOCK_NOTE_BLOCK_CHIME'
size: 54

