  # ---------------------------------------------------------------------------
  # HEADER & PLAYER PROFILE (Row 1: Slots 0..8)
  # ---------------------------------------------------------------------------
  'profile_info':
    material: PLAYER_HEAD
    slot: 4
    priority: 1
    glow: true
    hide_attributes: true
    display_name: '&6&l⭐ HỒ SƠ NGƯỜI CHƠI &6&l⭐'
    lore:
      - '&7• Tên người chơi: &e%player_name%'
      - '&7• Số dư Tiền: &a%vault_eco_balance_formatted% &7money'
      - '&7• Số dư Point: &b%playerpoints_points% &7point'
      - '&7• Level nhân vật: &bLevel %mmocore_level%'
      - ''
      - '&7• Cấp Rank Prison: &e%xprison_rank%'
      - '&7• Cấp Rank VIP: &b%luckperms_highest_group_by_weight%'

  'info_guide':
    material: BOOK
    slot: 1
    priority: 1
    hide_attributes: true
    display_name: '&e&l✦ HƯỚNG DẪN THĂNG HẠNG ✦'
    lore:
      - '&7• Rank Prison &7(từ Rank 1 ➔ 9) - 2 cách trả:'
      - '  &e➤ Click trái: &fMoney &7(vẫn cần đủ Level)'
      - '  &e➤ Click phải: &bPoint &7(vẫn cần đủ Level)'
      - ''
      - '&7• Mua &bRank VIP &7giúp mở khóa đặc quyền'
      - '  sethome, kit MMOItems; &a/fly &7ở &cLEGEND&7.'
      - '  &7Trả bằng &bPoint&7, mua VIP cấp dưới trước'
      - '  và phải đạt &eRank Prison tối đa (Rank 9).'

  'info_gate':
    material: COMPASS
    slot: 7
    priority: 1
    hide_attributes: true
    display_name: '&b&l❖ GIỚI HẠN LEVEL MMOCORE ❖'
    lore:
      - '&7Mỗi Rank Prison yêu cầu Level tương ứng:'
