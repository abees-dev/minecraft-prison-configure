# =============================================================================
# MASTER RANK GUI - DeluxeMenus Unified Menu
# Command: /rank, /rankmenu, /viprank, /vipranks, /vip
# (KHÔNG dùng /ranks vì trùng lệnh gốc của X-Prison)
# Combined Prison Ranks (1-9) & VIP Donor Ranks (1-6)
# =============================================================================
menu_title: '&8❖ &6&lHỆ THỐNG RANKS & VIP &8❖'
open_command:
  # KHÔNG dùng "ranks" ở đây: X-Prison tự đăng ký sẵn lệnh /ranks (GUI mặc định
  # của plugin) nên nếu trùng tên, DeluxeMenus sẽ bị đẩy lệnh xuống dạng
  # /deluxemenus:ranks và menu tự thiết kế này sẽ không mở được bằng /ranks.
  - rank
  - rankmenu
  - viprank
  - vipranks
  - vip
open_commands:
  - '[sound] BLOCK_NOTE_BLOCK_CHIME'
size: 36

items:
  # ---------------------------------------------------------------------------
  # HEADER & PLAYER PROFILE (Row 1)
  # ---------------------------------------------------------------------------
  'profile_info':
    material: PLAYER_HEAD
    slot: 4
    priority: 1
    glow: true
    hide_attributes: true
    display_name: '&6&l⭐ HỒ SƠ NGƯỜI CHƠI &6&l⭐'
    lore:
      - '&7• Tên người chơi: &e%player_name%'
      - '&7• Số dư Tiền: &a%vault_eco_balance_formatted% &7money'
      - '&7• Số dư Point: &b%playerpoints_points% &7point'
      - '&7• Level nhân vật: &bLevel %mmocore_level%'
      - ''
      - '&7• Cấp Rank Prison: &e%xprison_rank%'
      - '&7• Cấp Rank VIP: &b%luckperms_highest_group_by_weight%'

  'prison_header':
    material: DIAMOND_PICKAXE
    slot: 2
    priority: 1
    glow: true
    hide_attributes: true
    display_name: '&e&l⛏ TIẾN TRÌNH RANK PRISON &7(1 ➔ 9)'
    lore:
      - '&7Thăng rank bằng lệnh &e/rankup &7để mở'
      - '&7khu mỏ mới và tăng hệ số thưởng money/token!'
      - ''
      - '&a■ &7Đã sở hữu    &e■ &7Rank hiện tại'
      - '&6■ &7Rank tiếp theo   &c■ &7Chưa mở khóa'

  'vip_header':
