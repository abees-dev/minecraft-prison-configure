#  VIP Donor Ranks - purchase menu
#  Opens with /viprank (or /vipranks, /vip)
#  Sells the 6 LuckPerms donor groups created by
#  plugins/LuckPerms/setup-vip-ranks.txt (vip, vipplus, mvp, mvpplus, elite, legend).
#  Each purchase takes money via Vault ("eco take", requires any Vault-hooked
#  economy plugin, e.g. EssentialsX) then grants the group with
#  "lp user <player> parent add <group>" - tiers stack, a player can own several.
#
#  Deliberately Vault-based (not X-Prison's own internal money/tokens/gems
#  currency) so this menu is portable to any server that has Vault + an
#  economy plugin, without depending on X-Prison being installed at all.
#  Note: this means the VIP price is paid from the player's Vault/Essentials
#  balance, which is separate from whatever X-Prison currency they mine/earn.
#=========================================================
menu_title: '&8> &6&l⭐ &eVIP DONOR RANKS &6&l⭐'
open_command:
  - viprank_old
open_commands:
  - '[sound] BLOCK_NOTE_BLOCK_CHIME'
size: 27
items:
  'info':
    material: BOOK
    slot: 4
    priority: 1
    hide_attributes: true
    display_name: '&e&lVIP Donor Ranks'
    lore:
      - '&7Mua rank donor để nhận thêm quyền lợi:'
      - '&7home, kit riêng, vault; &a/fly &7mở ở LEGEND.'
      - ''
      - '&7Các rank có thể mua độc lập, không'
      - '&7cần mua theo thứ tự từ thấp đến cao.'
      - ''
      - '&7Lưu ý: mua 1 hạng cao sẽ tự động bao'
      - '&7gồm toàn bộ quyền lợi của các hạng thấp'
      - '&7hơn - nên các hạng dưới cũng hiện'
      - '&7"Đã sở hữu" là bình thường.'

  # ---------------- VIP ----------------
  'vip_owned':
    material: EMERALD
    slot: 10
    priority: 1
    hide_attributes: true
    display_name: '&a&lVIP &7(&aĐã sở hữu&7)'
    lore:
      - '&7Quyền lợi của hạng này:'
      - '&8- &75 /home, kit &avip'
      - '&8- &7Workbench di động, /hat'
      - ''
      - '&a✔ Bạn đã có đủ quyền lợi hạng này.'
    view_requirement:
      requirements:
        owns_vip:
          type: has permission
          permission: group.vip
  'vip_buy':
    material: EMERALD
    slot: 10
    priority: 2
    hide_attributes: true
    display_name: '&a&lVIP'
    lore:
      - '&7Quyền lợi:'
      - '&8- &75 /home, kit &avip'
      - '&8- &7Workbench di động, /hat'
      - ''
      - '&7Giá: &f15,000,000 &7money'
      - '&eClick để mua!'
    left_click_requirement:
      requirements:
        balance_check:
          type: has money
          amount: 15000000
          deny_commands:
            - "[message] &c&lVIP &7» Bạn không đủ tiền! Cần &f15,000,000 &7money."
    left_click_commands:
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[console] eco take %player_name% 15000000'
      - '[console] lp user %player_name% parent add vip'
      - '[message] &a&lVIP &7» Chúc mừng, bạn đã mua rank &a&lVIP&7!'
      - '[close]'

