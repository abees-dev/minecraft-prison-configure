alocTheDemonicMech:
  Type: silverfish
  Health: 500
  Options:
    Collidable: false
    FollowRange: 80
    MovementSpeed: 0.001
    PreventBlockInfection: true
    PreventOtherDrops: true
    KnockbackResistance: 1
    Silent: true 
  BossBar:
    Enabled: true
    Range: 80
    Color: RED
    Style: SEGMENTED_20
    Title: "Áloc, the Demonic Mech"
  AIGoalSelectors:
  - clear 
  - meleeattack
  AITargetSelectors:
  - clear
  - players  
  KillMessages:
  - '<target.name> was slay by &cÁloc The Demonic Mech'  
  Skills:
  - skill:alocDemonicMechBGSpawn @Self ~onSpawn 
  - skill{s=[ 
      - cancelEvent
      - skill:alocDemonicMechBGMeleeAttackI 
    ];sync=true} @Self ~onAttack
  - skill:alocTheDemonicMechDamaged @Self ~onDamaged 
  - skill:alocDemonicMechBGSpawn_Start @PIR{r=40;ignore=creative,spectators} ~onTimer:30
  - randomskill{
      s=
        alocDemonicMechBGFireBallShoot,alocDemonicMechBGFireBallShootRote,alocDemonicMechBGFireBallShootShort,alocDemonicMechBGMeleeAttackI
      } @Self ~onTimer:80
  - skill:alocDemonicMechBGCast ~onDamaged 0.55 <90%
  - skill:alocDemonicMechBGDespawn ~onDespawn
  - skill:alocDemonicMechBGDeath @Self ~onDeath
