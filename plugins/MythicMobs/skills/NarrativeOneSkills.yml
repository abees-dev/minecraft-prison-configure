SummonZombies:
  Skills:
    - spawn{mob=ZombieMinion;amount=4;radius=7} @self
    - effect:particles{p=smoke_normal;amount=50;hS=1;vS=1;yOff=1} @self
    - sound{s=entity.zombie.ambient;v=1;p=1} @self
CorruptedStrike:
  Skills:
    - damage{a=25} @target
    - effect:particles{p=angry_villager;amount=30;hS=1;vS=1;yOff=1} @target
    - sound{s=entity.zombie_villager.hurt;v=1;p=1} @target
    - potion{type=POISON;duration=200;level=1} @target
PlagueAura:
  Skills:
    - potion{type=POISON;duration=100;level=1;r=8} @PlayersInRadius{r=8}
    - effect:particles{p=cloud;amount=50;hS=2;vS=2;yOff=1} @self
    - sound{s=entity.witch.ambient;v=1;p=1} @self
