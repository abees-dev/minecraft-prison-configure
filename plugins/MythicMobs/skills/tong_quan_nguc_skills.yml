  - effect:particles{p=cloud;amount=40;hSpread=2;vSpread=1;speed=0.02;yOffset=0.5} @self
  - summon{mob=TONG_QUAN_NGUC_LINH;amount=2;noise=4} @self

Tong_Quan_Nguc_Pull_Slam:
  Cooldown: 14
  Conditions:
  - health{h=<5850} true
  Skills:
  - message{m="&c&l[!] &fTổng Quản Ngục &cKéo &fvà &cĐập&f — đứng xa hoặc né!"} @PlayersInRadius{r=16}
  - effect:sound{s=entity.ender_dragon.flap;volume=1.2;pitch=0.6} @self
  - effect:particles{p=portal;amount=60;hSpread=3;vSpread=1;speed=0.2;yOffset=1} @self
  - delay 15
  - pull{velocity=12} @PlayersInRadius{r=14}
