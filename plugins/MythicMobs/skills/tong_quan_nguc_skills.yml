# ============================================================================
# SKILL — TỔNG QUẢN NGỤC (Bang Chiến)
# Boss raid 3 phase: telegraph trước, rồi damage. Không drop kinh tế.
# ============================================================================

# ---------------- PHASE 1 — luôn active ----------------
Tong_Quan_Nguc_Mark:
  Cooldown: 12
  Skills:
  - message{m="&4&l[Tổng Quản Ngục]&r &7&oNgươi đã bị đánh dấu!"} @target
  - effect:particles{p=soul_fire_flame;amount=25;hSpread=0.4;ySpread=1;speed=0.02;yOffset=1} @target
  - potion{type=GLOWING;lvl=1;duration=80} @target
  - effect:sound{s=entity.wither_skeleton.hurt;volume=1.2;pitch=0.7} @target

Tong_Quan_Nguc_Slam_Telegraph:
  Cooldown: 8
  Skills:
  - message{m="&c&l[!] &fTổng Quản Ngục chuẩn bị &cĐập Nền&f — tránh vòng đỏ!"} @PlayersInRadius{r=12}
  - effect:sound{s=block.anvil.land;volume=1.0;pitch=0.5} @self
  - effect:particles{p=smoke;amount=50;hSpread=4;vSpread=0.3;speed=0.01;yOffset=0.1} @self
  - delay 20
  - skill{s=Tong_Quan_Nguc_Slam_Hit}

Tong_Quan_Nguc_Slam_Hit:
  Skills:
  - effect:sound{s=entity.generic.explode;volume=1.2;pitch=0.7} @self
  - effect:particles{p=explosion;amount=3;hSpread=2;vSpread=0.5;speed=0} @self
  - damage{amount=95;ignorearmor=true;ignoreiframes=true} @PlayersInRadius{r=5}
  - throw{velocity=1.2;velocityY=0.45} @PlayersInRadius{r=5}

# ---------------- PHASE 2 — HP < 65% (5850) ----------------
Tong_Quan_Nguc_Phase2_Announce:
  Cooldown: 9999
  Conditions:
  - health{h=<5850} true
  Skills:
  - message{m="&4&l⚔ BANG CHIẾN &8» &cTổng Quản Ngục &fđã vào &eGiai đoạn 2&f!"} @server
  - effect:sound{s=entity.wither.spawn;volume=1.5;pitch=0.6} @self
  - effect:particles{p=soul_fire_flame;amount=80;hSpread=1.5;ySpread=2;speed=0.05;yOffset=1} @self
  - potion{type=INCREASE_DAMAGE;lvl=1;duration=200} @self

Tong_Quan_Nguc_Summon:
  Cooldown: 18
  Conditions:
  - health{h=<5850} true
  Skills:
