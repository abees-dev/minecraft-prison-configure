  - skill{s=Tong_Quan_Nguc_Slam_Hit}

Tong_Quan_Nguc_Phase2_Enrage:
  Cooldown: 22
  Conditions:
  - health{h=<5850} true
  Skills:
  - effect:sound{s=entity.wither_skeleton.ambient;volume=1.5;pitch=0.4} @self
  - effect:particles{p=soul_fire_flame;amount=50;hSpread=0.8;ySpread=1.2;speed=0.04;yOffset=1} @self
  - potion{type=INCREASE_DAMAGE;lvl=2;duration=120} @self
