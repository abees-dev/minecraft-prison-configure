# Hurricane Shot #

Hurricane_Shot:
  Skills:
  - effect:sound{s=entity.phantom.ambient;volume=1.2;pitch=1} @self
  - effect:sound{s=item.crossbow.loading_start;volume=0.8;pitch=0.8} @self
  - summon{type=VFX_Hurricane_Shot_Charge;amount=1;radius=0;yRadius=0;onSurface=false;repeat=2;repeati=5} @forward{f=1;y=0.4}
  - potion{type=SLOW;duration=40;level=50;hasParticles=false} @self
  
  - delay 40
  
  - effect:sound{s=entity.blaze.shoot;volume=0.7;pitch=1.6} @self
  - effect:sound{s=entity.wither.shoot;volume=0.5;pitch=1.7} @self
  - effect:sound{s=item.trident.riptide_2;volume=0.7;pitch=0.6} @self
  - summon{type=VFX_Hurricane_Shot_Impact;amount=1;radius=0;yRadius=0;onSurface=true;repeat=1;repeati=3} @forward{f=1;y=-0.5}
  - projectile{bulletType=MOB;mob=VFX_Hurricane_Shot_Arrow;oT=Hurricane_Shot_T;onHit=Hurricane_Shot_DAMAGE_D;v=35;i=1;hR=1;vR=1;mr=38;hnp=true;hO=0;sE=false;sB=true;hs=false;hfs=0;sfo=0.5;syo=1.9;tyo=1.5;sso=0;hitConditions=[- entitytype{t=ARMOR_STAND} false]} @Forward{f=25;y=0}
  

Hurricane_Shot_T:
  Skills:
  - summon{type=VFX_Hurricane_Shot_T;amount=1;radius=0;yRadius=0;onSurface=false} @origin{y=-2}
Hurricane_Shot_DAMAGE_D:
  Skills:
  - skill{s=Hurricane_Shot_DAMAGE} @EntitiesNearOrigin{r=5}
Hurricane_Shot_DAMAGE:
  TargetConditions:
  - entitytype{t=ARMOR_STAND} false
  - mmoCanTarget{interaction=OFFENSE_ACTION} true
  - hasaura{n=Hurricane_Shot_AURA} false
  Skills:
  - aura{auraName=Hurricane_Shot_AURA;duration=10}
  - effect:sound{s=entity.breeze.hurt;volume=0.7;pitch=1.5}
  - damage{a="<modifier.damage>";pkb=true;hnp=true;hp=true}
  - throw{velocity=15;velocityY=0;delay=1}