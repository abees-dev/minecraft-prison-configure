Changetarget:
  Cooldown: 0
  Skills:
    - runaitargetselector{target=clear}
    - runaitargetselector{target=players}

Cancelattack:
  Skills:
    - CancelEvent

Entity_Step:
  Skills:
    - effect:sound{s=entity.polar_bear.step;volume=0.6;pitch=1} @self

Boss_Step:
  Skills:
    - effect:sound{s=entity.polar_bear.step;volume=1.7;pitch=0.6} @self

# Aurorafowl #

Aurorafowl_Hit:
  Cooldown: 1
  Skills:
    - effect:sound{s=entity.parrot.hurt;volume=0.5;pitch=0.4} @self

Aurorafowl_Attack:
  Skills:
    - randomskill{skills=Aurorafowl_Attack_1 25,Aurorafowl_Attack_2 75}

Aurorafowl_Attack_1:
  Conditions:
    - offgcd
    - targetwithin{d=3.5} true
  Skills:
    - gcd{ticks=41}
    - setAI{ai=false} @self
    - setAI{ai=true;delay=41} @self
    - state{s=attack} @self
    - effect:sound{s=entity.parrot.ambient;volume=0.75;pitch=0.4} @self 0.5
    - delay 18

    - effect:sound{s=entity.player.attack.crit;volume=0.7;pitch=1.5} @self
    - totem{md=2;c=1;oH=Aurorafowl_Attack_DAMAGE1;hnp=false;hp=true;hR=2;vR=2;i=1} @forward{f=1}

Aurorafowl_Attack_DAMAGE1:
  TargetConditions:
    - isblocking false
  Skills:
    - basedamage{m=1;pkb=true}

Aurorafowl_Attack_2:
  Conditions:
    - offgcd
    - targetwithin{d=3.5} true
  Skills:
    - gcd{ticks=30}
    - setAI{ai=false} @self
    - setAI{ai=true;delay=30} @self
    - state{s=attack;speed=1.7} @self
    - effect:sound{s=entity.parrot.ambient;volume=0.75;pitch=0.4} @self 0.5
    - delay 11

    - effect:sound{s=entity.player.attack.crit;volume=0.7;pitch=1.5} @self
    - totem{md=2;c=1;oH=Aurorafowl_Attack_DAMAGE2;hnp=false;hp=true;hR=2;vR=2;i=1} @forward{f=1}

Aurorafowl_Attack_DAMAGE2:
  TargetConditions:
    - isblocking false
  Skills:
    - basedamage{m=1.5;pkb=true}

Aurorafowl_Dash:
  Skills:
    - randomskill{skills=Aurorafowl_Walk 75,Aurorafowl_Run 25}

Aurorafowl_Walk:
  Cooldown: 99999
  Skills:
    - setSkillCooldown{skill=Aurorafowl_Run;seconds=0} @self
    - defaultstate{t=walk;s=walk} @self
    - setspeed{speed=1.3;type=walking} @self

Aurorafowl_Run:
  Cooldown: 99999
  Skills:
    - setSkillCooldown{skill=Aurorafowl_Walk;seconds=0} @self
    - defaultstate{t=walk;s=run} @self
    - setspeed{speed=2;type=walking} @self

