# -----------------------------------------------------------------------------
# Awakened Shaman
# -----------------------------------------------------------------------------
Rebirth_Chain_Lightning:
  Skills:
  - effect:sound{s=entity.lightning_bolt.thunder;volume=0.55;pitch=1.7} @self
  - skill{s=Rebirth_Chain_Lightning_Hit;damage=<modifier.damage>} @EIR{r=14;limit=1;sort=NEAREST}
  - skill{s=Rebirth_Chain_Lightning_Bounce;damage="<modifier.damage> * 0.72";delay=3} @EIR{r=14;limit=3;sort=NEAREST}
  - skill{s=Rebirth_Chain_Lightning_Bounce;damage="<modifier.damage> * 0.35"} @EIR{r=14;limit=1;sort=NEAREST} ?hasaura{aura=REBIRTH_THUNDER_EMPOWERED}
  - aura{auraName=REBIRTH_EARTH_EMPOWERED;duration=300} @self ?hasaura{aura=REBIRTH_SPIRIT_FLOW_ACTIVE}
  - auraremove{aura=REBIRTH_THUNDER_EMPOWERED} @self

Rebirth_Chain_Lightning_Hit:
  TargetConditions:
  - mmoCanTarget{interaction=OFFENSE_ACTION} true
  - entitytype{t=ARMOR_STAND} false
  Skills:
  - damage{a=<skill.damage>;pkb=true;hnp=true;hp=true}
  - particles{p=ELECTRIC_SPARK;amount=18;hS=0.5;vS=0.8;y=0.8;speed=0.08}

Rebirth_Chain_Lightning_Bounce:
