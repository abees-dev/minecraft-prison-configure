  - skill{s=Rebirth_Earthen_Ward_Target;heal=<modifier.heal>;shield=<modifier.shield>;duration=<modifier.duration>} @PIR{r=7;limit=5;sort=NEAREST}
  - skill{s=Rebirth_Earthen_Ward_Empowered;bonus=<modifier.heal>} @self ?hasaura{aura=REBIRTH_EARTH_EMPOWERED}
