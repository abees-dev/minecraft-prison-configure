# Skill "Enrage" rieng cho tung Boss rank tu (nha tu), tu dong kich hoat khi
# Boss tut xuong duoi 50% mau (Conditions: health{h=<nguong}), cho buff
# STRENGTH + SPEED tam thoi kem am thanh/hieu ung canh bao nguoi choi.
# Nguong h=<X duoc tinh = 50% Health cua tung Boss trong prison_rank_mobs.yml.

# Soft-despawn Normal/Elite khi khong con player trong 40 block (~10s check).
# Dung remove (khong onDeath) de khong drop / khong spam message.
# Boss KHONG dung skill nay: onDeath bat hologram timer DecentHolograms.
Prison_Despawn_No_Players:
  Conditions:
    - playersInRadius{r=40} false
  Skills:
    - remove @self

Prison_Tan_Binh_Enrage:
  Cooldown: 20
  Conditions:
    - health{h=<72} true
  Skills:
    - effect:sound{s=entity.zombie.ambient;volume=1.5;pitch=0.6} @self
    - effect:particles{p=flame;amount=25;hSpread=0.5;ySpread=1;speed=0.02;yOffset=1} @self
    - potion{type=INCREASE_DAMAGE;lvl=1;duration=100} @self
    - potion{type=SPEED;lvl=1;duration=100} @self
    - message{m="&e&l[Đầu Sỏ Tân Binh]&r &7Chưa xong đâu!"} @PlayersInRadius{r=30}

