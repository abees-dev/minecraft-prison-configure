# Skill khống chế (không port combo Vampire Lord) — dame mở màn vẫn giữ mốc
# tham chiếu ~30% một đòn nặng của VAMPIRE_LORD_BOSS (Vẫn Thạch Huyết Nguyệt
# 319+106 -> 30% ~ 128 dame phép), phần còn lại là debuff khống chế thuần.
Prison_Ma_Vuong_Nguyen_Rua:
  Skills:
    - message{m="&5&l[Ma Vương Ngục Tù]&r &7Ta nguyền rủa linh hồn các ngươi chìm trong bóng tối!"} @PlayersInRadius{r=40}
    - effect:sound{s=entity.evoker.cast_spell;volume=1.2;pitch=0.6} @self
    - effect:sound{s=entity.ender_dragon.growl;volume=1.3;pitch=0.4} @self
    - effect:particles{p=witch;amount=60;hSpread=2;vSpread=1.5;speed=0.05;yOffset=1} @PlayersInRadius{r=10}
    - damage{amount=128;ignorearmor=true;damagecause=MAGIC} @PlayersInRadius{r=10}
    - potion{type=BLINDNESS;lvl=1;duration=60} @PlayersInRadius{r=10}
    - potion{type=SLOW;lvl=250;duration=50} @PlayersInRadius{r=10}
    - potion{type=WEAKNESS;lvl=2;duration=100} @PlayersInRadius{r=10}

# Skill phép mới: đánh phép riêng lẻ lên nhiều mục tiêu gần nhất (khác Hell
# Nova - nova lửa quanh self, và Nguyen Rua - debuff khống chế thuần).
Prison_Ma_Vuong_Am_Anh:
  Skills:
    - message{m="&5&l[Ma Vương Ngục Tù]&r &7Bóng tối sẽ nuốt lấy linh hồn các ngươi!"} @PlayersInRadius{r=40}
    - effect:sound{s=entity.illusioner.cast_spell;volume=1.3;pitch=0.7} @self
    - effect:particles{p=portal;amount=100;hSpread=2;vSpread=2;speed=0.3;yOffset=1} @self
    - effect:particles{p=portal;amount=30;hSpread=0.5;vSpread=1;speed=0.2;yOffset=1} @PlayersInRadius{r=12;limit=3;sort=NEAREST}
    - damage{amount=100;ignorearmor=true;damagecause=MAGIC} @PlayersInRadius{r=12;limit=3;sort=NEAREST}
    - potion{type=LEVITATION;lvl=1;duration=30} @PlayersInRadius{r=12;limit=3;sort=NEAREST}

Give_Crate_Key_On_Death:
  Skills:
    - skill{s=Give_Crate_Key_Success} 0.50

Give_Crate_Key_Success:
  Skills:
    - command{c="crates key give <trigger.name> chia_khoa_ruong_ngoc 1"} @trigger
    - message{m="&e&l❖ &d&lCRATES &8» &r&fChúc mừng bạn nhận được &e1x Chìa Khóa Rương Ngọc&f!"} @trigger
    - effect:sound{s=entity.experience_orb.pickup;volume=1.0;pitch=1.2} @trigger

Boss_Anti_Kite_Pull:
  Conditions:
    - distance{d=>8} true
  Skills:
