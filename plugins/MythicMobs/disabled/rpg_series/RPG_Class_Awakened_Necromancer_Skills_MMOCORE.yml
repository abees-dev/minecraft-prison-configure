# Disabled: replaced by lightweight prison rebirth skills.
Necromancers_Command:
  Conditions:
  - hasAura{aura=CASTING} false
  Skills:
  - skill{s=Necromancers_Command_CAST}

Necromancers_Command_CAST:
  Conditions:
  - variableeq{var=caster.summonstance;value="focus"} castinstead Necromancers_Command_CAST_FREE
  - variableeq{var=caster.summonstance;value="free"} castinstead Necromancers_Command_CAST_IDLE
  Skills:
  - skill{s=Necromancers_Command_CAST_FOCUS}

Necromancers_Command_CAST_FOCUS:
  Skills:
  - auraremove{aura=Necromancers_Command_STACK} @self
  - setvariable{var=caster.summonstance;value="focus";type=STRING} @self
  - particles{p=dust_color_transition;color1=#ff6d40;color2=#c90000;amount=70;hS=0.35;vS=0.6;size=0.8;y=0.7;speed=0} @self
  - effect:sound{s=block.trial_spawner.spawn_item;volume=0.7;pitch=1} @self

  - signal{signal=FOCUS} @Children

  - auraremove{aura=<caster.name>TARGET} @EIR{r=100}
Necromancers_Command_CAST_FREE:
  Skills:
  - auraremove{aura=Necromancers_Command_STACK} @self
  - setvariable{var=caster.summonstance;value="free";type=STRING} @self
  - particles{p=dust_color_transition;color1=#e3ff96;color2=#aeff2b;amount=70;hS=0.35;vS=0.6;size=0.8;y=0.7;speed=0} @self
  - effect:sound{s=block.trial_spawner.spawn_item;volume=0.7;pitch=1.25} @self

  - signal{signal=FREE} @Children
  
  - auraremove{aura=<caster.name>FOCUSTARGET} @EIR{r=100}
Necromancers_Command_CAST_IDLE:
  Skills:
  - auraremove{aura=Necromancers_Command_STACK} @self
  - setvariable{var=caster.summonstance;value="idle";type=STRING} @self
  - particles{p=dust_color_transition;color1=#ffffff;color2=#a8ffff;amount=70;hS=0.35;vS=0.6;size=0.8;y=0.7;speed=0} @self
  - effect:sound{s=block.trial_spawner.spawn_item;volume=0.7;pitch=1.5} @self

  - signal{signal=IDLE} @Children

  - auraremove{aura=<caster.name>FOCUSTARGET} @EIR{r=100}
  

Minion_FOCUS_NC:
  Cooldown: 0
  Skills:
  - setstance{stance=FOCUS} @self
  - clearThreat{repeat=2;repeati=1} @self
  - settarget{repeat=2;repeati=1} @self
  
  - delay 3
  
  - runaigoalselector{goal=clear} @self
  - runaigoalselector{goal=meleeattack;delay=1} @self ?varEquals{var=caster.Type;value='Melee'} #?targetnotwithin{d=3}
  - runaigoalselector{goal=MoveWithinDistanceOfTarget{s=1.1;minr=10;maxrange=50};delay=1} @self ?varEquals{var=caster.Type;value='Ranged'}
  - runaigoalselector{goal=MoveWithinDistanceOfTarget{s=1.1;minr=10;maxrange=50};delay=1} @self ?varEquals{var=caster.Type;value='RangedSlow'}
  
  - runaitargetselector{target=clear} @self
Minion_FREE_NC:
  Cooldown: 0
  Skills:
  - setstance{stance=FREE} @self
  - clearThreat{repeat=2;repeati=1} @self
  - settarget{repeat=2;repeati=1} @self
  
  - delay 3
  
  - runaigoalselector{goal=clear} @self
  - runaigoalselector{goal=meleeattack;delay=1} @self ?varEquals{var=caster.Type;value='Melee'} #?targetnotwithin{d=3}
  - runaigoalselector{goal=MoveWithinDistanceOfTarget{s=1.3;minr=10;maxrange=50};delay=1} @self ?varEquals{var=caster.Type;value='Ranged'}
  - runaigoalselector{goal=MoveWithinDistanceOfTarget{s=1.1;minr=10;maxrange=50};delay=1} @self ?varEquals{var=caster.Type;value='RangedSlow'}

  - runaitargetselector{target=clear} @self
  - setTarget @EIR{r=70;conditions=[- hasaura{aura=<caster.name>TARGET}];sort=RANDOM;limit=1}



Minion_IDLE:
  Cooldown: 0
  Skills:
  - setstance{stance=IDLE} @self
  - clearThreat{repeat=2;repeati=1} @self
  - settarget{repeat=2;repeati=1} @self
  
  - delay 3

  - runaigoalselector{goal=clear} @self
  - runaigoalselector{goal=gotoowner;delay=1} @self
  
  - runaitargetselector{target=clear} @self

Minion_REMOVE_NC:
  Skills:
  - delay <random.0to60> ?!hasaura{n=DYINGAURA}
  - variablesubtract{var=target.minionsize;amount=1} @owner
  - message{message="&9Total Minions<&co> &a<target.var.minionsize>&f/&c10    &9Necroknights<&co> &a<target.var.necroknights>&f/&c2"} @owner
  - delay 1
  - remove @self
Minion_REMOVE_NC_NECROKNIGHT:
  Skills:
  - delay <random.0to60> ?!hasaura{n=DYINGAURA}
  - variablesubtract{var=target.minionsize;amount=1} @owner
  - variablesubtract{var=target.necroknights;amount=1} @owner
  - message{message="&9Total Minions<&co> &a<target.var.minionsize>&f/&c10    &9Necroknights<&co> &a<target.var.necroknights>&f/&c2"} @owner
  - delay 1
  - remove @self


Minion_TOOFAR_NC:
  Cooldown: 0
  TargetConditions:
  - distance{d=>45} true
  Skills:
  - teleport{spreadh=4;spreadv=0} @ownerlocation

Minion_OWNEROFFLINE:
  Cooldown: 0
  Conditions:
  - ownerIsOnline false
  Skills:
  - remove @self

ADMIN_RESET_NECROMANCER:
  Cooldown: 0
  Skills:
  - setvariable{var=caster.minionsize;val=0} @self
  - setvariable{var=caster.necroknights;val=0} @self
  
NECROMANCER_RESET_MINIONS:
  Cooldown: 0
  Conditions:
  - hasaura{n=ALREADY_RESET} false
  Skills:
  - setvariable{var=caster.minionsize;val=0} @self
  - setvariable{var=caster.necroknights;val=0} @self



