Necroknight:
  Conditions:
  - hasAura{aura=CASTING} false
  Skills:
  - skill{s=Necroknight_CAST;damage=<modifier.damage>}
Necroknight_CAST:
  Conditions:
  - variableInRange{var=caster.minionsize;value=>9} false
  - variableInRange{var=caster.necroknights;value=>1} false
  Skills:
  - aura{auraName=CASTING;duration=20} @self
  
  - skill{s=Necroknight_PRO;origin=@SelfEyeLocation{fo=-0.5;yo=-0.2}} @forward{f=12;uel=true}

  - setvariable{var=caster.necroknights;val=0;type=INTEGER} @self ?!variableIsSet{name=caster.necroknights}
  - setvariable{var=caster.minionsize;val=0;type=INTEGER} @self ?!variableIsSet{name=caster.minionsize}
Necroknight_PRO:
  Cooldown: 0.6
  Skills:
  - projectile{ohb=Necroknight_PRO_ACTUAL;v=45;i=1;hR=1;vR=1;mr=30;hnp=false;hO=0;sE=false;sB=true;hs=false;hfs=0;sfo=0;syo=0;tyo=0;sso=0;fo=true;hitConditions=[- isLiving false ];byo=0;drawhitbox=false;ham=true} #?!hasAura{aura=AXEMINION1}
  
  - auraremove{aura=Necroknight-ATTACKAURA;delay=39} @self
Necroknight_PRO_ACTUAL:
  Skills:
  - summon{type=VFX_NECROMANCER_DUMMY;amount=1;radius=0;yRadius=0;onSurface=true} @origin{y=0}
  - delay 1
  
  - projectile{oT=Necroknight_TICK;oE=Necroknight_SUMMON;v=11;i=1;hR=1;vR=1;mr=100;hnp=true;hO=0;sE=true;sB=false;hs=true;hfs=0.05;sfo=0;syo=0;tyo=0;sso=0;fo=false;byo=0;drawhitbox=false;ham=true;hitConditions=[ - mythicmobtype{t=VFX_NECROMANCER_DUMMY} true ]} @origin
Necroknight_SUMMON:
  Skills:
  - summon{type=MINION_NECROKNIGHT;amount=1;radius=0;yRadius=0;onSurface=true;onsummon=MINION_Deathbound_Souls-SUMMONSKILL} @origin{y=0.01}
  - summon{type=VFX_SOUL_EMISSION;amount=1;radius=0;yRadius=0;onSurface=true} @origin{y=0.01}
  - particles{p=dust_color_transition;color1=#57ffca;color2=#004234;amount=40;hS=1.4;vS=0.06;y=0;size=0.6;speed=0;repeat=20;repeati=2} @origin{y=0.02}
  - particles{p=dust_color_transition;color1=#00342d;color2=#000a11;amount=40;hS=1.4;vS=0.06;y=0;size=0.6;speed=0;repeat=20;repeati=2} @origin{y=0.02}

  - skill{s=Necroknight-DD;repeat=199;repeati=3} @EIR{r=100;conditions=[ - isLiving true - hasaura{aura=immunedelay} false - faction{faction=SUMMON} false - hasaura{aura=NECROKNIGHTTHRUST<caster.name>} true ]}
  - skill{s=NecroknightCHARGE-DD;repeat=199;repeati=3} @EIR{r=100;conditions=[ - isLiving true - hasaura{aura=immunedelay} false - faction{faction=SUMMON} false - hasaura{aura=NECROKNIGHTCHARGE<caster.name>} true ]}
  - effect:sound{s=awakened_necromancer_sounds:samus.awakened_necromancer.summon;volume=0.7;pitch=<random.float.0.9to1.1>} @self
  - effect:sound{s=entity.wither.spawn;volume=0.8;pitch=<random.float.0.5to0.6>} @self
Necroknight_TICK:
  Skills:
  - particles{p=dust_color_transition;color1=#57ffca;color2=#004234;amount=10;hS=0.06;vS=0.06;y=0;size=1.2;speed=0} @origin





Necroknight-THRUST:
