  - targetwithin{d=6} true
  - hasaura{n=NOAI} false
  Skills:
  - look{headOnly=false;immediately=true;force=true;repeat=2;repeati=1} @target

  - delay 2

  - gcd{ticks=22}
  - setAI{ai=false} @self
  - setAI{ai=true;delay=22} @self
  - state{s=thrust;speed=1} @self
  - delay 6
  - skill{s=Necroknight-DAMAGE_AURA} @target
  - effect:sound{s=awakened_necromancer_sounds:samus.awakened_necromancer.lance_thrust;volume=0.7;pitch=<random.float.0.9to1.1>} @self

