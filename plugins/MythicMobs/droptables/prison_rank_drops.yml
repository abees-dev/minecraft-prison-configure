# ---------------- TRÙM CUỐI: MA VƯƠNG NGỤC TÙ ----------------
# Base luôn roll. Bonus mốc ≥10/20/30/40/50 trên mob Drops.
# Không dùng TINHTHE_CUONGHOA_* — chỉ đá Thiên Mệnh + đá cường hóa + Huy Diệt.
prison_ma_vuong_boss_drops:
  Drops:
  - mmoitem{type=MATERIAL;id=MANH_LINH_HON_HUYEN_THOAI} 2 1.0
  - mmoitem{type=MATERIAL;id=TINHTHE_HUY_DIET} 1 0.25
  - mmoitem{type=MATERIAL;id=DA_CUONG_HOA_THIEN_MENH} 1 0.15
