# ============================================================================
# Bo quai vat theo 9 rank X-Prison (khong theo he thong class/rank cua MMOCore).
# Can bang dua tren trang bi MMOItems ban/trade tai mines (sword.yml + armor.yml):
#   - HP quai Thuong = 9x sat thuong kiem cung rank; HP quai Elite = 18x.
#   - HP quai Boss   = 75x sat thuong kiem cung rank (buff "trau" hon truoc,
#     tung la 45x) + Boss co Enrage (heal/buff STRENGTH+SPEED khi <50% mau,
#     xem file skills/prison_rank_skills.yml) + tu trieu hoi 2 quai Thuong
#     cung rank moi vai chuc giay (~onTimer) -> tran boss keo dai va dong hon.
#   - Damage da buff nhieu lan de bu lai lifesteal tren vu khi MMOItems (Doi
#     Truong tro len co san lifesteal 1.5-12%, attack-speed 1.6-1.8 khien
#     nguoi choi hoi mau rat nhanh neu dame quai qua nhe).
#   - 2026-07-30: Rank 1-4 (chua co lifesteal) nerf ~50% Health + Damage +
#     slam/AOE/heal elite — early game bi 1-2 hit chet khi gate level/rank.
#     Rank 5+ giu nguyen (can dame cao de thang lifesteal).
#   - Boss co don "slam" dinh ky (~onTimer), danh dau ignorearmor=true +
#     ignoreiframes=true nen KHONG bi giap/defense-stat cua MMOItems giam bot.
#   - Moi rank co bo skill rieng khi tan cong (thay vi dung chung 1 hieu ung):
#     Thuong = throw (hat van), WEAKNESS/SLOW/WITHER tuy rank (chance 15%);
#     Elite  = knockback + 1 hieu ung/AOE cleave rieng (chance 15-25%), cong
#     heal{} dinh ky de "tru bai" hon, danh chay bot nham chan. Xem tung mob
#     de biet skill cu the (khac nhau theo tung rank, khong lap lai).
#     Boss them message + sound + effect:explosion khi ~onDeath.
#   - KHONG dung disguise nua, mob hien thi dung texture vanilla theo Type
#     (ZOMBIE/HUSK/VINDICATOR/PILLAGER/WITHER_SKELETON/PIGLIN_BRUTE/RAVAGER/
#     DROWNED cua tung rank), Elite/Boss phan biet qua Scale + ten Display.
#     NGOAI LE: PRISON_MA_VUONG_BOSS duoc gan Disguise custom (skin rieng)
#     theo yeu cau rieng — xem ghi chu ngay tren field Disguise: cua mob do.
# => Rank 5+: quai kho hon giap cung rank, dame du manh thang lifesteal.
#    Rank 1-4: nhe hon de newbie song duoc; chinh Damage/Health neu can.
# ============================================================================

