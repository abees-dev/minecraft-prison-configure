  Equipment:
    - STONE_SWORD HAND
  Options:
    PreventOtherDrops: true
    FollowRange: 40
    MovementSpeed: 0.26
    Scale: 1.4
    AlwaysShowName: true
    Despawn: true
    PreventSunburn: true
  BossBar:
    Enabled: true
    Title: "&e&lĐầu Sỏ Tân Binh"
    Range: 40
  Drops:
