    - message{m="&4&l[BOSS] &fĐầu Sỏ Tân Binh &fđã xuất hiện tại Nhà Tù!"} @server ~onSpawn
    - message{m="&7[&e&lĐầu Sỏ Tân Binh&r&7] &fMày... mày sẽ phải trả giá!"} @PlayersInRadius{r=40} ~onDeath
    - message{m="&4&l[BOSS] &fĐầu Sỏ Tân Binh &fđã bị tiêu diệt bởi &e<trigger.name>&f!"} @server ~onDeath
    - effect:sound{s=entity.zombie.death;volume=1;pitch=0.7} @self ~onDeath
    - effect:explosion @self ~onDeath
    - command{c="dh holograms enable TanBinhTimer"} ~onDeath
    - skill{s=Give_Crate_Key_On_Death} @trigger ~onDeath

