# Aurorafowl #

Aurorafowl:
  Type: ZOMBIE
  Display: '&fAurorafowl'
  Health: 35
  Damage: 4
  Faction: Icebound
  Options:
    MovementSpeed: 0.3
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: false
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 20
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Modules:
    ThreatTable: true
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 players
  Skills:
  - model{mid=aurorafowl;n=false;step=1} @self ~onSpawn
  - effect:sound{s=entity.parrot.ambient;volume=0.75;pitch=0.4} @self ~onTimer:140 0.35
  - effect:sound{s=entity.parrot.hurt;volume=0.75;pitch=0.6} @self ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Aurorafowl_Attack} ~onTimer:20 0.7
  - skill{s=Aurorafowl_Dash} ~onTimer:40 0.7
  - skill{s=Aurorafowl_Hit} ~onDamaged
  
