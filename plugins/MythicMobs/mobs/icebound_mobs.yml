# Arctic Colossus #

Arctic_Colossus:
  Type: ZOMBIE
  Display: '&4Arctic Colossus'
  Health: 400
  Damage: 8
  BossBar:
    Enabled: true
    Title: '&4Arctic Colossus'
    Range: 25
    Color: RED
    Style: SEGMENTED_12
    DarkenSky: false
  Options:
    MovementSpeed: 0.16
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: false
    Collidable: false
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 80
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  #Modules:
  #  ThreatTable: true
  DamageModifiers:
  - FALL 0
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 players
  Skills:
  - model{mid=arctic_colossus;n=false;step=4;lockpitch=true;lockyaw=true} @self ~onSpawn
  - hitboxconfig{m=arctic_colossus;p=ob_head;pass=2} @self ~onSpawn
  - bindhitbox{m=arctic_colossus;p=ob_left_leg;t=Leg_Hitbox;delay=1} @self ~onSpawn
  - bindhitbox{m=arctic_colossus;p=ob_right_leg;t=Leg_Hitbox2;delay=1} @self ~onSpawn

  - effect:sound{s=entity.warden.ambient;volume=1;pitch=0.4} @self ~onTimer:140 0.35
  - effect:sound{s=entity.wither.death;volume=1.5;pitch=0.4} @self ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Arctic_Colossus_Hit} @self ~onDamaged
  - bodyclamp{m=arctic_colossus;c=60} @self ~onSpawn
  
  - skill{s=Wild_Stomp_Left_AURA} ~onSignal:LEFT_HIT
  - skill{s=Wild_Stomp_Right_AURA} ~onSignal:RIGHT_HIT
  
  - skill{s=Arctic_Colossus_Skill} ~onTimer:40 >50%
  - skill{s=Wild_Stomp_Left} ~onTimer:20 >50%
  - skill{s=Wild_Stomp_Right} ~onTimer:20 >50%
  
  - skill{s=Arctic_Colossus_Skill_2} ~onTimer:20 <50%
  - skill{s=Wild_Stomp_Left_2} ~onTimer:20 <50%
  - skill{s=Wild_Stomp_Right_2} ~onTimer:20 <50%
  
  - skill{s=Ice_Boss_Stun} ~onTimer:100 0.3
  
  - skill{s=Ice_Boss_Death} ~onDeath

Leg_Hitbox:
  Type: VEX
  Health: 100
  Skills:
  - remove @parent ~onDeath
  - signal{s=LEFT_HIT} @Parent ~onDamaged
  
Leg_Hitbox2:
  Type: VEX
  Health: 100
  Skills:
  - remove @parent ~onDeath
  - signal{s=RIGHT_HIT} @Parent ~onDamaged
  
