ZOMBIE_NORMAL:
  Type: ZOMBIE
  Display: '&c&lQuái vật hỗn loạn &r&8[ &fLV &f<caster.level> &8] &7(<caster.hp{round=2}>/<caster.mhp>)'
  Health: 20
  Damage: 3
  Level: 1
  Options:
    PreventSunburn: true # Chống cháy nắng
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventRandomEquipment: true
    ShowHealth: true
  Skills:
  - potion{type=SLOW;duration=200;level=0} @Self ~onSpawn
  - setname{name=<caster.name>;delay=2} @self ~onDamaged
  Drops:
  - ZombieNormalItemDrops
  AITargetSelectors:
  - 0 attacker
