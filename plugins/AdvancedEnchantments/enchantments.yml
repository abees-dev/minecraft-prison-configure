# AdvancedEnchantments — curated for AetherMine class/item fit
# Pool slimmed: Warrior sword/axe, Mage/Cleric staff (STICK), Archer bow ready,
# pickaxe smelting+experience only, armor by piece. VN lore polished.
# Level caps: SIMPLE/UNIQUE V, ELITE VI, ULTIMATE VII, LEGENDARY VIII, FABLED X.
# Binary passive enchants remain level I; regenerate with scripts/extend_enchant_levels.js.
# Do not restore full default pack without review.

