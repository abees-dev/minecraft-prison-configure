name: Dấu Ấn Sức Mạnh
lore:
  - Tấn công kẻ địch sẽ áp dụng một dấu ấn ma thuật chết người
  - lan rộng trên mặt đất. Dấu ấn này tích lũy &6{ratio}%
  - sát thương gây ra cho mục tiêu ban đầu
  - trong &6{duration} &7giây.
  - ''
  - Sau khoảng thời gian này, dấu ấn phát nổ, gây
  - sát thương tích lũy cho kẻ địch gần đó và
  - làm choáng chúng trong &6{stun} &7giây.
  - ''
  - Càng nhiều sát thương, thời gian choáng càng lâu.
  - ''
  - '&e{cooldown} giây hồi chiêu'
