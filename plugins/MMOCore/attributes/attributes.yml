# Attribute ID
strength:

    name: Sức Mạnh
    
    # Maximum amount of points players 
    # may spend in this attribute.
    max-points: 40
    
    # Buffs given every 1 attribute point spent
    # in this specific attribute.
    buff:
        weapon_damage: 2
        # Flat HP: 2 HP = 1 tim. Percentage scaling was too small on low-level
        # classes and did not match the flat value shown in the attribute GUI.
        max_health: 2

dexterity:
    name: Khéo Léo
    max-points: 40
    buff:
        physical_damage: 1.5
        projectile_damage: 1
        attack_speed: 0.5%

intelligence:
    name: Trí Tuệ
    max-points: 40
    buff:
        magic_damage: 2
        cooldown_reduction: 1
