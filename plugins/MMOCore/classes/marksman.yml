display:
  name: 'Xạ Thủ'
  lore:
    - 'Xạ thủ là một chiến binh tầm xa nhanh nhẹn và chính xác,'
    - 'không bao giờ bỏ lỡ bất kỳ mũi tên nào.'
  attribute-lore:
    - '&a+ &7Kháng Đẩy Lùi'
    - '&a+ &7Giảm Hiệu Ứng Chậm Tốc Độ'
    - '&c- &7Máu Tối Đa'
    - '&c- &7Tốc Độ Di Chuyển'
    - ''
    - '&8&lSức Mạnh'
    - '&7  Sát Thương Tấn Công: &c1 &7(+&c0&7)'
    - '&7  Tốc Độ Tấn Công: &c4 &7(+&c0&7)'
    - '&7  Máu Tối Đa: &c18 &7(+&c0&7)'
    - ''
    - '&8&lNhanh Nhẹn'
    - '&7  Kháng Đẩy Lùi: &a15% &7(+&a1%&7)'
    - '&7  Tốc Độ Di Chuyển: &a21 &7(+&a0&7)'
    - '&7  Giảm Hiệu Ứng Chậm Tốc Độ: &a10% &7(+&a2%&7)'
    - ''
    - '&8&lTrí Tuệ'
    - '&7  Mana Tối Đa: &920 &7(+&90&7)'
    - '&7  Hồi Máu: &90.1 &7(+&90&7)'
    - '&7  Hồi Mana: &90.166 &7(+&90&7)'
  item: BOW

# Must match an existing exp curve filename from the 'expcurves' folder
exp-curve: levels

# The maximum level players can reach
max-level: 100

exp-table: class_exp_table

skill-slots:
  1:
    name: '&aSkill Slot I'
    unlocked-by-default: true
  2:
    name: '&aSkill Slot II'
    unlocked-by-default: true
  3:
    name: '&aSkill Slot III'
    unlocked-by-default: true
  4:
    name: '&aSkill Slot IV'
    unlocked-by-default: true

skill-trees:
  - 'general'
  - 'rogue-marksman'

# Particles displayed around the player
# when he enters the casting mode.
cast-particle:
  particle: CRIT

# Special resource regeneration: (when out of combat),
# players can regen a set % of their stamina mana/missing stamina.
# This % can scale with the player level.
# It also works with other player resources: health, stellium and mana!
resource:
  stamina:
    # Regen scales with missing stamina.
    type: MISSING

    # Regen from 3 to 10% of missing stamina every second
    value:
      base: 5
      per-level: .2
      max: 13

    # Only regen when out of combat.
    off-combat: true

skills:
  WEAKEN:
    level: 3
    max-level: 30
  COMBO_ATTACK:
    level: 7
    max-level: 30
  EVADE:
    level: 9
    max-level: 30
  MINOR_HEALINGS:
    level: 10
    max-level: 30

attributes:
  knockback-resistance:
    base: .15
    per-level: .01
  speed-malus-reduction:
    base: 10
    per-level: 2
  max-health:
    base: 18
    per-level: 0
  movement-speed:
    base: .105
    per-level: 0
  attack-damage:
    base: 2
    per-level: 0.1

# Experience sources for main class experience.
main-exp-sources:
  - 'killmob{type=ZOMBIE;amount=50-70}'
  - 'killmob{type=ENDERMAN;amount=6-9}'
