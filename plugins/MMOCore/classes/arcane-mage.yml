# Display options
display:
  name: 'Arcane Mage'
  lore:
    - 'Pháp Sư đã làm chủ sức mạnh của'
    - 'Phép Thuật, tiêu diệt mọi kẻ thù trên đường đi'
    - 'bằng phép thuật mạnh mẽ & khả năng tầm xa.'
  attribute-lore:
    - '&a+ &7Hồi Phục Mana'
    - '&a+ &7Hồi Phục Sức Khỏe'
    - '&a+ &7Tối Đa Mana'
    - '&c- &7Tối Đa Sức Khỏe'
    - ''
    - '&8&lSức Mạnh'
    - '&7  Sát Thương Tấn Công: &c1 &7(+&c0&7)'
    - '&7  Tốc Độ Tấn Công: &c4 &7(+&c0&7)'
    - '&7  Tối Đa Sức Khỏe: &c18 &7(+&c0&7)'
    - ''
    - '&8&lNhanh Nhẹn'
    - '&7  Kháng Cự Đẩy Lùi: &a0% &7(+&a0%&7)'
    - '&7  Tốc Độ Di Chuyển: &a20 &7(+&a0&7)'
    - '&7  Giảm Tốc Độ: &a0% &7(+&a0%&7)'
    - ''
    - '&8&lTrí Tuệ'
    - '&7  Tối Đa Mana: &930 &7(+&91.3&7)'
    - '&7  Hồi Phục Sức Khỏe: &90.13 &7(+&90&7)'
    - '&7  Hồi Phục Mana: &90.2 &7(+&90.04&7)'
  item: BLAZE_POWDER:1 # Supports custom model data/texture by durability

# Must match an existing exp curve filename from the 'expcurves' folder
exp-curve: levels

skill-slots:
  1:
    name: '&aSkill Slot I'
    unlocked-by-default: true
  2:
    name: '&aSkill Slot II'
    unlocked-by-default: true
  3:
    name: '&aSkill Slot III'
    unlocked-by-default: true
  4:
    name: '&aSkill Slot IV'
    unlocked-by-default: true

# The maximum level players can reach
max-level: 100

skill-trees:
  - 'general'
  - 'mage-arcane-mage'

# This class must not display in /class
# because it is a subclass of mage
options:
  display: false
  needs-permission: false

exp-table: class_exp_table

attributes:
  max-health:
    base: 18
    per-level: 0
  max-mana:
    base: 30
    per-level: 1.3
  mana-regeneration:
    base: .2
    per-level: .04
  health-regeneration:
    base: 0.13
    per-level: 0

skills:
  FIRE_STORM:
    level: 1
    max-level: 30
    damage:
      base: 8.0
      per-level: 4.0
    ignite:
      base: 2.0
      per-level: 0.1
    mana:
      base: 15.0
      per-level: 2.0
    cooldown:
      base: 5.0
      per-level: -0.1
      max: 5.0
      min: 1.0

  POWER_MARK:
    level: 3
    max-level: 30
  FIREBALL:
    level: 5
    max-level: 30
  MINOR_HEALINGS:
    level: 6
    max-level: 30
  ICE_SPIKES:
    level: 8
    max-level: 30
  AMBERS:
    level: 9
    max-level: 30
  WEAKEN:
    level: 10
    max-level: 30
  WARP:
    level: 13
    max-level: 30
  GREATER_HEALINGS:
    level: 15
    max-level: 30

# Experience sources for main class experience.
main-exp-sources:
  - 'killmob{type=ZOMBIE;amount=50-70}'
  - 'killmob{type=ENDERMAN;amount=6-9}'
