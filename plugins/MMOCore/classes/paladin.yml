    - 'các thành viên trong đội của mình.'
  attribute-lore:
    - '&a+ &7Máu Tối Đa'
    - '&a+ &7Kháng Đẩy Lùi'
    - '&a+ &7Giảm Hiệu Ứng Chậm Tốc Độ'
    - '&c- &7Tốc Độ Di Chuyển'
    - '&c- &7Tốc Độ Tấn Công'
    - ''
    - '&8&lSức Mạnh'
    - '&7  Sát Thương Tấn Công: &c1 &7(+&c0&7)'
    - '&7  Tốc Độ Tấn Công: &c3.7 &7(+&c0&7)'
    - '&7  Máu Tối Đa: &c22 &7(+&c3&7)'
    - ''
    - '&8&lNhanh Nhẹn'
    - '&7  Kháng Đẩy Lùi: &a30% &7(+&a1%&7)'
    - '&7  Tốc Độ Di Chuyển: &a19 &7(+&a0&7)'
    - '&7  Giảm Hiệu Ứng Chậm Tốc Độ: &a30% &7(+&a2%&7)'
    - ''
    - '&8&lTrí Tuệ'
    - '&7  Mana Tối Đa: &920 &7(+&90&7)'
    - '&7  Hồi Máu: &90.1 &7(+&90&7)'
    - '&7  Hồi Mana: &90.166 &7(+&90&7)'
  item: ENCHANTED_GOLDEN_APPLE:0 # Hỗ trợ dữ liệu mô hình tùy chỉnh/kết cấu theo độ bền

# Must match an existing exp curve filename from the 'expcurves' folder
exp-curve: levels

skill-slots:
  1:
    name: '&aSkill Slot I'
    unlocked-by-default: true
  2:
    name: '&aSkill Slot II'
    unlocked-by-default: true
  3:
    name: '&aSkill Slot III'
    unlocked-by-default: true
  4:
    name: '&aSkill Slot IV'
    unlocked-by-default: true

skill-trees:
  - 'general'
  - 'warrior-paladin'
  - 'combat'

# The maximum level players can reach
max-level: 100

exp-table: class_exp_table

cast-particle:
  particle: VILLAGER_HAPPY

skills:
  DEEP_WOUND:
    level: 10
    max-level: 30
  WEAKEN:
    level: 5
    max-level: 30
  AMBERS:
    level: 15
    max-level: 30
  GREATER_HEALINGS:
    level: 7
    max-level: 30
  MINOR_HEALINGS:
    level: 3
    max-level: 30
  HUMAN_SHIELD:
    level: 13
    max-level: 20

attributes:
  knockback-resistance:
    base: .3
    per-level: .01
  speed-malus-reduction:
    base: 30
    per-level: 2
  max-health:
    base: 22
    per-level: 0.3
  attack-speed:
    base: 3.7
    per-level: 0
  movement-speed:
    base: .095
    per-level: 0

# Experience sources for main class experience.
main-exp-sources:
  - 'killmob{type=ZOMBIE;amount=50-70}'
  - 'killmob{type=ENDERMAN;amount=6-9}'
