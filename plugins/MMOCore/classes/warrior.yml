    - ''
    - 'Chiến binh tích lũy cơn thịnh nộ khi thi triển kỹ năng,'
    - 'tạm thời tăng sát thương cơ bản của mình.'
  attribute-lore:
    - '&a+ &7Sát Thương Tấn Công'
    - '&a+ &7Tốc Độ Tấn Công'
    - '&a+ &7Máu Tối Đa'
    - '&a+ &7Giảm Hiệu Ứng Chậm Tốc Độ'
    - '&c- &7Tốc Độ Di Chuyển'
    - ''
    - '&8&lSức Mạnh'
