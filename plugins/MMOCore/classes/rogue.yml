display:
  name: 'Đạo Tặc'
  lore:
    - 'Tiềm năng gây sát thương bùng nổ quan trọng của anh ta và'
    - 'sự thiếu hụt máu buộc anh ta phải'
    - 'tiêu diệt mục tiêu chỉ bằng một đòn trước khi bị hạ gục.'
  attribute-lore:
    - '&a+ &7Tốc Độ Tấn Công'
    - '&c- &7Máu Tối Đa'
    - '&c- &7Tốc Độ Di Chuyển'
    - ''
    - '&8&lSức Mạnh'
    - '&7  Sát Thương Tấn Công: &c1 &7(+&c0&7)'
    - '&7  Tốc Độ Tấn Công: &c4.2 &7(+&c0.05&7)'
    - '&7  Máu Tối Đa: &c18 &7(+&c0&7)'
    - ''
    - '&8&lNhanh Nhẹn'
    - '&7  Kháng Đẩy Lùi: &a0% &7(+&a0%&7)'
    - '&7  Tốc Độ Di Chuyển: &a21 &7(+&a0&7)'
    - '&7  Giảm Hiệu Ứng Chậm Tốc Độ: &a0% &7(+&a0%&7)'
    - ''
    - '&8&lTrí Tuệ'
    - '&7  Mana Tối Đa: &920 &7(+&90&7)'
    - '&7  Hồi Máu: &90.1 &7(+&90&7)'
    - '&7  Hồi Mana: &90.166 &7(+&90&7)'
  item: LEATHER_BOOTS

# Must match an existing exp curve filename from the 'expcurves' folder
exp-curve: levels

# The maximum level players can reach
max-level: 100

exp-table: class_exp_table

skill-slots:
  1:
    name: '&aSkill Slot I'
    unlocked-by-default: true
  2:
    name: '&aSkill Slot II'
    unlocked-by-default: true
  3:
    name: '&aSkill Slot III'
    unlocked-by-default: true
  4:
    name: '&aSkill Slot IV'
    unlocked-by-default: true

skill-trees:
  - 'general'
  - 'rogue-marksman'

options:
  # Mana and health regen only applies when out of combat
  off-combat-mana-regen: true
  off-combat-health-regen: true

  needs-permission: false

cast-particle:
  particle: SPELL_WITCH

skills:
  DEEP_WOUND:
    level: 1
    max-level: 30
  WEAKEN:
    level: 3
    max-level: 30
  EMPOWERED_ATTACK:
    level: 5
    max-level: 30
  COMBO_ATTACK:
    level: 7
    max-level: 30
  EVADE:
    level: 9
    max-level: 30
  FURTIVE_STRIKE:
    level: 4
    max-level: 30
  MINOR_HEALINGS:
    level: 10
    max-level: 30
  SNEAKY_PICKY:
    level: 2
    max-level: 20

attributes:
  attack-speed:
    base: 4.2
    per-level: 0.05
  max-health:
    base: 18
    per-level: 0
  movement-speed:
    base: .105
    per-level: 0

# Experience sources for main class experience.
main-exp-sources:
  - 'killmob{type=ZOMBIE;amount=50-70}'
  - 'killmob{type=ENDERMAN;amount=6-9}'
