# GUI display name
name: Điểm Dịch Chuyển
name-on-waypoint: 'Điểm Dịch Chuyển: {waypoint}'

# Number of slots in your inventory. Must be
# between 9 and 54 and must be a multiple of 9.
slots: 45

items:
  waypoint:
    slots: [ 10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34 ]
    function: waypoint

    # Displayed when there is no waypoint
    no-waypoint:
      item: GRAY_STAINED_GLASS_PANE
      name: '&a'
      lore: { }

    # Displayed when the waypoint has not been unlocked yet.
    locked:
      name: '&c- Chưa Mở Khóa -'
      item: GRAY_DYE
      lore: { }

    # When the two waypoints are not linked together
    not-a-destination:
      name: '&a{name}'
      item: ENDER_PEARL

      # Material displayed when the waypoint is not
      # ready (not dynamic, or not enough stellium)
      not-ready: ENDER_PEARL

      lore:
        - '&7Không thể dịch chuyển do 2 điểm dịch chuyển chưa được liên kết.'


    # When you cannot teleport to a non dynamic waypoint
    not-dynamic:
      name: '&a{name}'
      item: ENDER_PEARL

      lore:
        - '&7Không thể dịch chuyển vì bạn đang không đứng trên một điểm dịch chuyển.'


    current-waypoint:
      name: '&a{name}'
      item: ENDER_PEARL

      lore:
        - '&7Điểm dịch chuyển bạn đang đứng.'

    # When you don't have enough stellium
    not-enough-stellium:
      name: '&a{name}'
      item: ENDER_PEARL

      lore:
        - '&7Không thể dịch chuyển vì không có đủ Stellium.'
        - '&7Chi phí dịch chuyển tốn &b{normal_cost}&7/&b{dynamic_cost} &7Stellium.'

    # Displayed when the waypoint is unlocked and usable
    display:
      name: '&a{name}'
      item: ENDER_EYE

      lore:
        - '&7Bạn có thể dịch chuyển đến điểm này.'
        - '&7Các điểm trung gian: {intermediary_waypoints}'
        - '&7Bấm để dịch chuyển tốn &b{current_cost} &7Stellium.'

