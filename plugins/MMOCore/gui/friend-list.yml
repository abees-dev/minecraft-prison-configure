# GUI display name
name: Danh Sách Bạn Bè

# Number of slots in your inventory. Must be
# between 9 and 54 and must be a multiple of 9.
slots: 54

items:
    friend:
        slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
        function: friend
        
        # No friend
        item: GRAY_STAINED_GLASS_PANE
        name: '&cTrống'
        lore: {}
        
        # Online friend
        online:
            item: PLAYER_HEAD
            name: '&a[Trực Tuyến] &f{name}'
            lore:
            - '&7Cấp {level} {class}'
            - '&7Trực tuyến từ: {online_since}'
            - ''
            - '&cBấm chuột phải để xóa bạn.'
            
        # Offline friend
        offline:
            item: PLAYER_HEAD
            name: '&c[Ngoại Tuyến] &f{name}'
            lore:
            - '&7Lần cuối trực tuyến: {last_seen} trước'
            - ''
            - '&cBấm chuột phải để xóa bạn.'
    request:
        slots: [49]
        function: request
        item: WRITABLE_BOOK
        name: '&aGửi Lời Mời Kết Bạn'
        lore: {}
