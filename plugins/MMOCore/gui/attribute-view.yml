# GUI display name
name: Thuộc Tính Nhân Vật


# Number of slots in your inventory. Must be
# between 9 and 54 and must be a multiple of 9.
slots: 27

items:
    reallocate:
        slots: [26]
        function: reallocation
        item: CAULDRON
        name: '&aTẩy Điểm Thuộc Tính'
        lore:
            - ''
            - '&7Bạn đã sử dụng tổng cộng &6{total}&7 điểm thuộc tính.'
            - '&7Nhấp chuột phải để tẩy và cộng lại.'
            - ''
            - '&eTốn 1 điểm tẩy thuộc tính.'
            - '&e◆ Điểm Tẩy Thuộc Tính Có Sẵn: &6{points}'
    str:
        slots: [11]
        function: attribute_strength
        name: '&a{name}'
        item: GOLDEN_APPLE
        lore: # {buffs} returns amount of buffs
            - ''
            - '&7Điểm Đã Cộng: &6{spent}&7/&6{max}'
            - '&7{name} Hiện Tại: &6&l{current}'
            - ''
            - '&8Khi Nâng Cấp:'
            - '&7  +{buff_weapon_damage}% Sát Thương Vũ Khí (&a+{total_weapon_damage}%&7)'
            - '&7  +{buff_max_health} Máu Tối Đa (&a+{total_max_health}&7)'
            - ''
            - '&eBấm để nâng cấp với 1 điểm thuộc tính.'
            - '&e◆ Điểm Thuộc Tính Hiện Có: {attribute_points}'
    dex:
        slots: [13]
        function: attribute_dexterity
        name: '&a{name}'
        item: LEATHER_BOOTS
        hide-flags: true
        lore:
            - ''
            - '&7Điểm Đã Cộng: &6{spent}&7/&6{max}'
            - '&7{name} Hiện Tại: &6&l{current}'
            - ''
            - '&8Khi Nâng Cấp:'
            - '&7  +{buff_physical_damage}% Sát Thương Vật Lý (&a+{total_physical_damage}%&7)'
            - '&7  +{buff_projectile_damage}% Sát Thương Tầm Xa (&a+{total_projectile_damage}%&7)'
            - '&7  +{buff_attack_speed} Tốc Độ Tấn Công (&a+{total_attack_speed}&7)'
            - ''
            - '&eBấm để nâng cấp với 1 điểm thuộc tính.'
            - '&e◆ Điểm Thuộc Tính Hiện Có: {attribute_points}'
    int:
        slots: [15]
        function: attribute_intelligence
        name: '&a{name}'
        item: BOOK
        lore:
            - ''
            - '&7Điểm Đã Cộng: &6{spent}&7/&6{max}'
            - '&7{name} Hiện Tại: &6&l{current}'
            - ''
            - '&8Khi Nâng Cấp:'
            - '&7  +{buff_magic_damage}% Sát Thương Phép (&a+{total_magic_damage}%&7)'
            - '&7  +{buff_cooldown_reduction}% Giảm Cooldown Kỹ Năng (&a+{total_cooldown_reduction}%&7)'
            - ''
            - '&eBấm để nâng cấp với 1 điểm thuộc tính.'
            - '&e◆ Điểm Thuộc Tính Hiện Có: {attribute_points}'
