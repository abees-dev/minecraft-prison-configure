# Tên hiển thị GUI
name: Nhiệm Vụ

# Số khe trong kho của bạn. Phải nằm trong khoảng
# từ 9 đến 54 và phải là bội số của 9.
slots: 45

items:
  skill:
    slots:
      [
        10,
        11,
        12,
        13,
        14,
        15,
        16,
        19,
        20,
        21,
        22,
        23,
        24,
        25,
        28,
        29,
        30,
        31,
        32,
        33,
        34,
      ]
    function: quest

    # Khi nhiệm vụ bị khóa
    locked:
      item: PAPER
      name: '&c- Không khả dụng -'

    # Khi không có nhiệm vụ để hiển thị
    no-quest:
      item: GRAY_STAINED_GLASS_PANE
      name: '&a'

    level-requirement:
      main:
        hit: '&a  ✔ Yêu cầu cấp độ {level}'
        not-hit: '&c  ✖ Yêu cầu cấp độ {level}'
      profession:
        hit: '&a  ✔ Yêu cầu {profession} cấp độ {level}'
        not-hit: '&c  ✖ Yêu cầu {profession} cấp độ {level}'

    # Định dạng ngày được sử dụng trong placeholder {date}
    date-format: 'MMM d yyyy'

    item: BOOK
    name: '&a{name}'
    lore:
      - '{lore}'
      - ''
      - '{started}&8Nhiệm vụ đã bắt đầu!'
      - '{started}&7► Tiến độ: &e{progress}%'
      - '{started}&7► &o{objective}'
      - '{started}'
      - '{level_req}&7Yêu cầu cấp độ ({current_level_req}/{total_level_req}):'
      - '{level_req}{level_requirements}'
      - '{level_req}'
      - '{completed}&8Bạn đã hoàn thành nhiệm vụ này vào {date}.'
      - '{completed_cannot_redo}&8Bạn không thể làm lại nhiệm vụ này.'
      - '{completed_delay}&8Bạn có thể bắt đầu nhiệm vụ trong {delay}.'
      - '{completed_can_redo}&8Bạn có thể bắt đầu lại nhiệm vụ này.'
      - '{completed}'
      - '{started}&c► Nhấp chuột phải để hủy.'
      - '{!started}&e► Nhấp chuột trái để bắt đầu.'
