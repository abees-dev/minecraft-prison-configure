# GUI display name
name: Danh Sách Nhiệm Vụ

# Number of slots in your inventory. Must be
# between 9 and 54 and must be a multiple of 9.
slots: 45

items:
    skill:
        slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
        function: quest
        
        # When quest is locked
        locked:
            item: PAPER
            name: '&c- Chưa Mở Khóa -'
            
        # When there is no quest to display
        no-quest:
            item: GRAY_STAINED_GLASS_PANE
            name: '&a'
        
        level-requirement:
            main:
                hit: '&a  ✔ Yêu cầu cấp độ {level}'
                not-hit: '&c  ✖ Yêu cầu cấp độ {level}'
            profession:
                hit: '&a  ✔ Yêu cầu nghề {profession} cấp {level}'
                not-hit: '&c  ✖ Yêu cầu nghề {profession} cấp {level}'
        
        # Date format used in the {date} placeholder
        date-format: 'dd/MM/yyyy'
        
        item: BOOK
        name: '&a{name}'
        lore:
        - '{lore}'
        - ''
        - '{started}&8Đang Làm Nhiệm Vụ!'
        - '{started}&7► Tiến Trình: &e{progress}%'
        - '{started}&7► &o{objective}'
        - '{started}'
        - '{level_req}&7Yêu Cầu Cấp Độ ({current_level_req}/{total_level_req}):'
        - '{level_req}{level_requirements}'
        - '{level_req}'
        - '{completed}&8Bạn đã hoàn thành nhiệm vụ này vào {date}.'
        - '{completed_cannot_redo}&8Không thể làm lại nhiệm vụ này.'
        - '{completed_delay}&8Có thể làm lại sau {delay}.'
        - '{completed_can_redo}&8Có thể bắt đầu nhiệm vụ này.'
        - '{completed}'
        - '{started}&c► Chuột phải để hủy.'
        - '{!started}&e► Chuột trái để nhận.'
