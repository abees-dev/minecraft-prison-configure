Command:
  Editor:
    Desc: Mở giao diện chỉnh sửa Rương & Chìa khóa.
  Drop:
    Usage: <crate> <x> <y> <z> [world]
    Desc: Thả Rương tại vị trí chỉ định trong thế giới.
    Done: <lgray>Đã thả <lyellow>%crate_name%</lyellow> tại <lyellow>%location_x%, %location_y%, %location_z%</lyellow> thuộc thế giới <lyellow>%location_world%</lyellow>.</lgray>
  DropKey:
    Usage: <key> <x> <y> <z> [world]
    Desc: Thả chìa khóa tại vị trí chỉ định.
    Done: <lgray>Đã thả <lyellow>%key_name%</lyellow> tại <lyellow>%location_x%, %location_y%, %location_z%</lyellow> thuộc thế giới <lyellow>%location_world%</lyellow>.</lgray>
  Open:
    Desc: Mở một Rương.
    Usage: <crate>
  OpenFor:
    Desc: Mở Rương cho người chơi.
    Usage: <player> <crate> [-f] [-s]
    Done: <lgray>Đã mở <lyellow>%crate_name%</lyellow> cho <lyellow>%player_name%</lyellow>.</lgray>
    Notify: <lgray>Bạn đã bị ép mở <lyellow>%crate_name%</lyellow>.</lgray>
  Give:
    Usage: <player> <crate> [amount] [-s]
    Desc: Phát Rương cho người chơi.
    Done: <lgray>Đã trao <lyellow>x%amount%</lyellow> Rương <lyellow>%crate_name%</lyellow> cho <lyellow>%player_name%</lyellow>.</lgray>
    Notify: <lgray>Bạn đã nhận được <lyellow>x%amount%</lyellow> <lyellow>%crate_name%</lyellow>.</lgray>
  Key:
    Desc: Quản lý chìa khóa của người chơi.
    Usage: "[help]"
    Give:
      Usage: <player> <key> <amount> [-s] [-nosave]
      Desc: Cấp chìa khóa cho người chơi.
      Done: <lgray>Đã cấp <lyellow>x%amount%</lyellow> Chìa khóa <lyellow>%key_name%</lyellow> cho <lyellow>%player_name%</lyellow>.</lgray>
      Notify: <lgray>Bạn đã nhận được <lyellow>x%amount%</lyellow> <lyellow>%key_name%</lyellow>!</lgray>
    GiveAll:
      Usage: <player> <key> <amount> [-s]
      Desc: Cấp chìa khóa cho tất cả người chơi đang online.
      Done: <lgray>Đã cấp <lyellow>x%amount%</lyellow> Chìa khóa <lyellow>%key_name%</lyellow> cho <lyellow>Tất cả người chơi</lyellow>.</lgray>
    Take:
      Usage: <player> <key> <amount> [-s] [-nosave]
      Desc: Tịch thu chìa khóa từ người chơi.
      Done: <lgray>Đã thu <lyellow>x%amount%</lyellow> Chìa khóa <lyellow>%key_name%</lyellow> từ <lyellow>%player_name%</lyellow>.</lgray>
      Notify: <lgray>Bạn đã bị mất <lred>x%amount%</lred> <lred>%key_name%</lred>.</lgray>
    Set:
      Usage: <player> <key> <amount> [-s] [-nosave]
      Desc: Đặt số lượng chìa khóa cho người chơi.
      Done: <lgray>Đã đặt số lượng <lyellow>x%amount%</lyellow> Chìa khóa <lyellow>%key_name%</lyellow> cho <lyellow>%player_name%</lyellow>.</lgray>
      Notify: <lgray>Số lượng <lyellow>%key_name%</lyellow> của bạn đã được thay đổi thành <lyellow>x%amount%</lyellow>.</lgray>
    Show:
      Desc: Kiểm tra chìa khóa ảo [của người chơi].
      Usage: "[player]"
      Format:
        List:
          - <noprefix>
          - " "
          - "<lyellow><b>Chìa khóa ảo của %player_name%: </b></lyellow>"
          - "%entry%"
          - " "
        Entry: "<lyellow>▪ <lgray>%key_name%: </lgray>x%amount%</lyellow>"
  Preview:
    Desc: Xem trước phần thưởng Rương.
    Usage: <crate> [player]
    Done:
      Others: <lgray>Đã mở giao diện xem trước <lyellow>%crate_name%</lyellow> cho <lyellow>%player_display_name%</lyellow>.</lgray>
  ResetLimit:
    Desc: Đặt lại giới hạn nhận phần thưởng cho Rương và phần thưởng chỉ định.
    Usage: <player> <crate> [reward]
    Done:
      Crate: <lgray>Đã đặt lại giới hạn thắng cho tất cả phần thưởng trong <lyellow>%crate_name%</lyellow> của <lyellow>%player_name%</lyellow>.</lgray>
      Reward: <lgray>Đã đặt lại giới hạn thắng phần thưởng <lyellow>%reward_name%</lyellow> trong <lyellow>%crate_name%</lyellow> của <lyellow>%player_name%</lyellow>.</lgray>
  ResetCooldown:
    Desc: Đặt lại thời gian chờ mở Rương của người chơi.
    Usage: <player> <crate>
    Done: <lgray>Đã đặt lại thời gian chờ mở <lyellow>%crate_name%</lyellow> của <lyellow>%player_name%</lyellow>.</lgray>
  Menu:
    Usage: "[menu]"
    Desc: Mở menu Rương.
    Done:
      Others: <lgray>Đã mở menu Rương cho <lyellow>%player_display_name%</lyellow>.</lgray>
Crate:
  Open:
    Error:
      InventorySpace:
        - <output:"titles:20:80:20"><sound:"entity_villager_no">
        - <lred><b>Rất tiếc!</b></lred>
        - <lgray>Hãy dọn dẹp ô trống trong túi đồ để mở Rương!</lgray>
      Cooldown:
        Temporary:
          - <output:"titles:20:80:20"><sound:"entity_villager_no">
          - <lred><b>Thời gian chờ Rương!</b></lred>
          - <lgray>Bạn có thể mở lại sau <lred>%time%</lred></lgray>
        OneTimed:
          - <output:"titles:20:80:20"><sound:"entity_villager_no">
          - <lred><b>Rất tiếc!</b></lred>
          - <lgray>Bạn đã mở Rương một lần duy nhất này rồi!</lgray>
      NoKey:
        - <output:"titles:20:80:20"><sound:"entity_villager_no">
        - <lred><b>Rất tiếc!</b></lred>
        - <lgray>Bạn không có chìa khóa cho Rương này!</lgray>
      NoHoldKey:
        - <output:"titles:20:80:20"><sound:"entity_villager_no">
        - <lred><b>Rất tiếc!</b></lred>
        - <lgray>Bạn phải cầm chìa khóa trên tay để mở Rương!</lgray>
      NoRewards:
        - <output:"titles:20:80:20"><sound:"entity_villager_no">
        - <red><b>Rất tiếc!</b></red>
        - <lgray>Không có phần thưởng nào dành cho bạn! Hãy thử lại sau.</lgray>
      CantAfford:
        - <output:"titles:20:80:20"><sound:"entity_villager_no">
        - <lred><b>Rất tiếc!</b></lred>
        - <lgray>Bạn cần có <lred>%amount%</lred> để mở Rương này!</lgray>
      Already:
        - <output:"titles:20:80:20"><sound:"entity_villager_no">
        - <red><b>Rất tiếc!</b></red>
        - <lgray>Bạn đang trong quá trình mở Rương!</lgray>
    Reward:
      Info:
        - <noprefix>
        - <lgray>Bạn đã nhận được <lgreen>%reward_name%</lgreen> từ <lgreen>%crate_name%</lgreen>!</lgray>
      Broadcast:
        - <noprefix><sound:"block_note_block_bell">
        - " "
        - <lgray> Người chơi <lgreen>%player_display_name%</lgreen> vừa trúng <lgreen>%reward_name%</lgreen> từ <lgreen>%crate_name%</lgreen>!</lgray>
        - " "
    Milestone:
      Completed:
        - <noprefix>
        - <sound:"entity_player_levelup">
        - <lgray>Bạn đã hoàn thành cột mốc <lgreen>%milestone_openings% Lần mở </lgreen> và nhận được phần thưởng <lgreen>%reward_name%</lgreen>!</lgray>
  Preview:
    Error:
      Cooldown: <lgray>Bạn có thể xem trước Rương này lại sau <lred>%time%</lred></lgray>
  Error:
    Invalid: <lred>Rương không hợp lệ!</lred>
    Exists: <lred>Rương đã tồn tại!</lred>
  Key:
    Error:
      Invalid: <lred>Chìa khóa không hợp lệ!</lred>
      Exists: <lred>Chìa khóa đã tồn tại!</lred>
Menu:
  Invalid: <lred>Menu không tồn tại!</lred>
Other:
  Midnight: Nửa đêm
  Free: Miễn phí
Editor:
  Error:
    BadName: <lred>Chỉ cho phép chữ cái Latin & chữ số.</lred>
  Reward:
    Error:
      Create:
        Exist: <lgray>Phần thưởng đã tồn tại!</lgray>
    Enter:
      Chance: <lgray>Nhập <lgreen>[Trọng số]</lgreen></lgray>
      Command: <lgray>Nhập <lgreen>[Lệnh]</lgreen></lgray>
      Id: <lgray>Nhập <lgreen>[Mã định danh phần thưởng]</lgreen></lgray>
      Rarity: <lgray>Nhập <lgreen>[Độ hiếm]</lgreen></lgray>
      Permissions: <lgray>Nhập <lgreen>[Node Quyền hạn]</lgreen></lgray>
  Title:
    Main: <black>Trình chỉnh sửa ExcellentCrates</black>
    Crates: <black>Trình chỉnh sửa Rương</black>
    Crate:
      Settings: <black>Cài đặt Rương</black>
      Milestones: <black>Cột mốc Rương</black>
      Effect: <black>Hiệu ứng Rương</black>
      Placement: <black>Vị trí đặt Rương</black>
    Reward:
      List: <black>Danh sách Phần thưởng Rương</black>
      Settings: <black>Cài đặt Phần thưởng</black>
      Sort: <black>Sắp xếp Phần thưởng</black>
    Keys: <black>Trình chỉnh sửa Chìa khóa</black>
    Key:
      Settings: <black>Cài đặt Chìa khóa</black>
  Enter:
    DisplayName: <lgray>Nhập <lgreen>[Tên hiển thị]</lgreen></lgray>
    Amount: <lgray>Nhập <lgreen>[Số lượng]</lgreen></lgray>
    Value: <lgray>Nhập <lgreen>[Giá trị]</lgreen></lgray>
  Crate:
    Enter:
      Seconds: <lgray>Nhập <lgreen>[Số giây]</lgreen></lgray>
      Id: <lgray>Nhập <lgreen>[Mã định danh Rương]</lgreen></lgray>
      Particle:
        Name: <lgray>Nhập <lgreen>[Tên hạt Particle]</lgreen></lgray>
      KeyId: <lgray>Nhập <lgreen>[Mã định danh Chìa khóa]</lgreen></lgray>
      BlockLocation: <lgray>Nhấp vào một <lgreen>[Khối Block]</lgreen> để gán Rương.</lgray>
      HologramTemplate: <lgray>Nhập <lgreen>[Mẫu Hologram]</lgreen></lgray>
      AnimationConfig: <lgray>Nhập <lgreen>[Tên Hiệu ứng mở]</lgreen></lgray>
      PreviewConfig: <lgray>Nhập <lgreen>[Tên Giao diện xem trước]</lgreen></lgray>
      Open_Cost: <lgray>Nhập <lgreen>[Loại tiền] [Số lượng]</lgreen></lgray>
  Item:
    Crates:
      Name: <lyellow><b>Danh sách Rương</b></lyellow>
      Lore:
        - <lyellow>[▶]</lyellow> <lgray>Nhấp để <lyellow>mở</lyellow>.</lgray>
    Keys:
      Name: <lyellow><b>Danh sách Chìa khóa</b></lyellow>
      Lore:
        - <lyellow>[▶]</lyellow> <lgray>Nhấp để <lyellow>mở</lyellow>.</lgray>
    Crate:
      Object:
        Name: "<lyellow><b>%crate_name%<reset><lgray> (ID: <white>%crate_id%</white>)</lgray></reset></b></lyellow>"
        Lore:
          - "%crate_inspect%"
          - ""
          - <lyellow>[▶]</lyellow> <lgray>Chuột trái để <lyellow>chỉnh sửa</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Shift-Phải để <lyellow>xóa <lred>(không thể hoàn tác)</lred></lyellow>.</lgray>
      Create:
        Name: <lyellow><b>Tạo Rương mới</b></lyellow>
        Lore: []
      DisplayName:
        Name: <lyellow><b>Tên hiển thị</b></lyellow>
        Lore:
          - "<lyellow>● <lgray>Hiện tại: </lgray>%crate_name%</lyellow>"
          - ""
          - <lgray>Tên Rương hiển thị trong tin nhắn,</lgray>
          - <lgray>placeholder và hologram.</lgray>
          - ""
          - <lyellow>[▶]</lyellow> <lgray>Nhấp để <lyellow>thay đổi</lyellow>.</lgray>
      Permission:
        Name: <lyellow><b>Yêu cầu quyền hạn</b></lyellow>
        Lore:
          - "<lyellow>● <lgray>Trạng thái: </lgray>%crate_permission_required%</lyellow>"
          - "<lyellow>● <lgray>Quyền hạn: </lgray>%crate_permission%</lyellow>"
          - ""
          - <lgray>Bật/Tắt yêu cầu quyền hạn</lgray>
          - <lgray>để mở Rương này.</lgray>
          - ""
          - ""
          - <lyellow>[▶]</lyellow> <lgray>Nhấp để <lyellow>bật/tắt</lyellow>.</lgray>
      OpenCooldown:
        Name: <lyellow><b>Thời gian chờ mở</b></lyellow>
        Lore:
          - "<lyellow>● <lgray>Thời gian chờ: </lgray>%crate_open_cooldown%</lyellow>"
          - ""
          - <lgray>Thời gian giãn cách giữa các lần</lgray>
          - <lgray>mở Rương của mỗi người chơi.</lgray>
          - ""
          - <lyellow>[▶]</lyellow> <lgray>Chuột trái để <lyellow>đặt thời gian chờ</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Chuột phải để <lyellow>xóa bỏ</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Phím [Q / Vứt] để <lyellow>đặt thành mở 1 lần</lyellow>.</lgray>
      PreviewAndOpening:
        Name: <lyellow><b>Xem trước & Hiệu ứng mở</b></lyellow>
        Lore:
          - "<lyellow>● <lgray>Xem trước: </lgray>%crate_preview_config%</lyellow>"
          - "<lyellow>● <lgray>Hiệu ứng mở: </lgray>%crate_animation_config%</lyellow>"
          - ""
          - <lgray>Cấu hình giao diện dùng cho:</lgray>
          - <lgray><lyellow>● </lyellow>GUI Xem trước Rương (<lorange>/previews/</lorange>)</lgray>
          - <lgray><lyellow>● </lyellow>Hiệu ứng mở Rương (<lorange>/openingsv2/</lorange>)</lgray>
          - ""
          - <lyellow>[▶]</lyellow> <lgray>Chuột trái để <lyellow>đổi giao diện xem trước</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Chuột phải để <lyellow>đổi hiệu ứng mở</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Shift-Trái để <lyellow>tắt xem trước</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Shift-Phải để <lyellow>tắt hiệu ứng mở</lyellow>.</lgray>
      KeyRequirement:
        Name: <lyellow><b>Yêu cầu chìa khóa</b></lyellow>
        Lore:
          - "<lyellow>● <lgray>Trạng thái: </lgray>%crate_key_required%</lyellow>"
          - "<lyellow>● <lgray>Chìa khóa: </lgray></lyellow>"
          - "%crate_key_ids%"
          - ""
          - <lgray>Người chơi phải có chìa khóa chỉ định</lgray>
          - <lgray>để mở Rương này.</lgray>
          - ""
          - <lyellow>[▶]</lyellow> <lgray>Chuột trái để <lyellow>thêm chìa khóa</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Chuột phải để <lyellow>xóa tất cả</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Phím [Q / Vứt] để <lyellow>bật/tắt yêu cầu</lyellow>.</lgray>
      OpenCost:
        Name: <lyellow><b>Chi phí mở Rương</b></lyellow>
        Lore:
          - "<lyellow>● <lgray>Hiện tại: </lgray>%crate_open_cost%</lyellow>"
          - ""
          - <lgray>Người chơi phải trả một khoản chi phí</lgray>
          - <lgray>để mở Rương này.</lgray>
          - ""
          - <lyellow>[▶]</lyellow> <lgray>Chuột trái để <lyellow>thêm chi phí</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Phím [Q / Vứt] để <lyellow>xóa tất cả</lyellow>.</lgray>
      InventoryItem:
        Name: <lyellow><b>Vật phẩm biểu tượng</b></lyellow>
        Lore:
          - <lgray>Vật phẩm đại diện cho Rương trong</lgray>
          - <lgray>menu và túi đồ người chơi.</lgray>
          - ""
          - <lgray>Bạn chỉ nên dùng vật phẩm <lorange>có sẵn</lorange> -</lgray>
          - <lgray>không thể chỉnh sửa tại đây.</lgray>
          - ""
          - <lgray><orange>[❗]</orange> <lgray>Thẻ NBT <orange>không được</orange> hỗ trợ!</lgray></lgray>
          - ""
          - <lyellow>[▶]</lyellow> <lgray>Kéo & Thả để <lyellow>thay thế</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Chuột trái để <lyellow>lấy vật phẩm</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Chuột phải để <lyellow>lấy bản sao thô</lyellow>.</lgray>
      Placement:
        Info:
          Name: <lyellow><b>Đặt khối Rương</b></lyellow>
          Lore:
            - <lgray>Đặt Rương tại bất kỳ đâu trong thế giới</lgray>
            - <lgray>với hiệu ứng hạt particle và hologram!</lgray>
            - ""
            - <lyellow>[▶]</lyellow> <lgray>Nhấp để <lyellow>chuyển hướng</lyellow>.</lgray>
        Locations:
          Name: <lyellow><b>Khối Block đã gán</b></lyellow>
          Lore:
            - <lgray>%crate_locations%</lgray>
            - ""
            - <lgray>Gán Rương vào các khối block cụ thể</lgray>
            - <lgray>trong thế giới và <lorange>mở</lorange> hoặc <lorange>xem trước</lorange></lgray>
            - <lgray>khi người chơi nhấp vào chúng!</lgray>
            - ""
            - <lyellow>[▶]</lyellow> <lgray>Chuột trái để <lyellow>gán khối block</lyellow>.</lgray>
            - <lyellow>[▶]</lyellow> <lgray>Chuột phải để <lyellow>xóa tất cả</lyellow>.</lgray>
        Pushback:
          Name: <lyellow><b>Đẩy lùi người chơi</b></lyellow>
          Lore:
            - "<lyellow>● <lgray>Trạng thái: </lgray>%crate_pushback_enabled%</lyellow>"
            - ""
            - <lgray>Đẩy lùi người chơi ra xa khỏi Rương</lgray>
            - <lgray>nếu họ không đáp ứng đủ yêu cầu.</lgray>
            - ""
            - <lyellow>[▶]</lyellow> <lgray>Nhấp để <lyellow>bật/tắt</lyellow>.</lgray>
        Hologram:
          Name: <lyellow><b>Hologram Chữ nổi</b></lyellow>
          Lore:
            - "<lyellow>● <lgray>Trạng thái: </lgray>%crate_hologram_enabled%</lyellow>"
            - "<lyellow>● <lgray>Mẫu: </lgray>%crate_hologram_template%</lyellow>"
            - "<lyellow>● <lgray>Độ cao Y: </lgray>%crate_hologram_y_offset%</lyellow>"
            - ""
            - <lgray>Tạo chữ nổi (hologram) trên khối Rương</lgray>
            - <lgray>với nội dung từ mẫu được chọn.</lgray>
            - ""
            - <lgray>Chỉnh sửa các mẫu hologram trong <lorange>config.yml</lorange></lgray>
            - ""
            - <lyellow>[▶]</lyellow> <lgray>Chuột trái để <lyellow>bật/tắt</lyellow>.</lgray>
            - <lyellow>[▶]</lyellow> <lgray>Chuột phải để <lyellow>đổi mẫu</lyellow>.</lgray>
            - <lyellow>[▶]</lyellow> <lgray>Shift-Trái để <lyellow>đổi độ cao Y</lyellow>.</lgray>
        Effects:
          Name: <lyellow><b>Hiệu ứng hạt Particle</b></lyellow>
          Lore:
            - "<lyellow>● <lgray>Kiểu hình: </lgray>%crate_effect_model%</lyellow>"
            - "<lyellow>● <lgray>Hạt particle: </lgray>%crate_effect_particle_name%</lyellow>"
