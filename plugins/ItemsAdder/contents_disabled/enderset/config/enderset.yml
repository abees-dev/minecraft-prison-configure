info:
  namespace: enderset

armors_rendering:
  ender_armor:
    color: '#00fd3a'
    layer_1: end_armor_main
    layer_2: end_armor_leggings
    use_color: false

items:
  ender_helmet:
    display_name: "Ender Helmet"
    permission: enderset
    resource:
      generate: true
      textures:
        - ender_helmet
    specific_properties:
      armor:
        slot: HEAD
        custom_armor: ender_armor

  ender_chestplate:
    display_name: "Ender Chestplate"
    permission: enderset
    resource:
      generate: true
      textures:
        - ender_chestplate
    specific_properties:
      armor:
        slot: CHEST
        custom_armor: ender_armor
    
  ender_leggings:
