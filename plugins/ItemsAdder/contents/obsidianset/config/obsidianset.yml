    permission: obsidianset
    resource:
      generate: false
      material: WOODEN_HOE
      model_path: "co_hoe"

  co_axe:
    display_name: "Obsidian Axe"
    permission: obsidianset
    resource:
      generate: false
      material: WOODEN_AXE
      model_path: "co_axe"

  co_bow:
    display_name: "Obsidian Bow"
    permission: obsidianset
    resource:
      generate: false
      material: BOW
      model_path: "co_bow"

