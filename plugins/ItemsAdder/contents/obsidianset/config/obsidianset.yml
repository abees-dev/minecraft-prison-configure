    resource:
      generate: true
      textures:
        - co_leggings
    specific_properties:
      armor:
        slot: LEGS
        custom_armor: co_armor

  co_boots:
    display_name: "Obsidian Boots"
    permission: obsidianset
    resource:
      generate: true
      textures:
        - co_boots
    specific_properties:
      armor:
