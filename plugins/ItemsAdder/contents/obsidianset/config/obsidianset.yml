info:
  namespace: obsidianset

armors_rendering:
  co_armor:
    color: '#09001a'
    layer_1: co_armor_main
    layer_2: co_armor_leggings
    emissive_1: co_armor_main_e
    emissive_2: co_armor_leggings_e
    use_color: false

items:
  co_helmet:
    display_name: "Obsidian Helmet"
    permission: obsidianset
    resource:
      generate: true
      textures:
        - co_helmet
    specific_properties:
      armor:
        slot: HEAD
        custom_armor: co_armor

  co_chestplate:
    display_name: "Obsidian Chestplate"
    permission: obsidianset
    resource:
      generate: true
      textures:
        - co_chestplate
    specific_properties:
      armor:
        slot: CHEST
        custom_armor: co_armor
    
  co_leggings:
