# ============================================================================
# CorePlugin - Upgrade ("Cường Hóa") module configuration
# ============================================================================
# Controls the equipment-upgrade GUI opened by /cuonghoa (aliases: /nangcap,
# /upgrade).
#
# Changes take effect after either:
#   - /cuonghoa reload   (requires permission: coreplugin.upgrade.reload)
#   - a server restart
#
# This file is only copied out ONCE, the first time the module starts. If
# you hand-add a new key later it will be read normally. If a key is simply
# missing, the plugin falls back to a safe built-in default instead of
# breaking - it will NOT overwrite or regenerate this file, so your comments
# and edits are safe.
#
# Player-facing strings live in messages.yml; GUI title/rows/slots live in
# gui.yml (same folder).
# ============================================================================

# Max upgrade level an item can reach.
max-level: 100

# Money sink: Vault fee charged per upgrade ATTEMPT (money is destroyed, not
# moved anywhere). The fee is looked up from the item's level BEFORE the
# attempt: upgrading "+20 -> +21" pays the "0-20" bracket. Order of
# operations is fee-first: money is withdrawn BEFORE the stone is consumed,
# so a failed Vault transaction never eats the player's items.
#
#   enabled                    - master switch; false = no money is ever
#                                charged (instant rollback knob).
#   charge-on-failure          - true: a failed roll still costs the fee
#                                (and the stone). false: the fee is refunded
#                                on failure (stone is still lost).
#   levels                     - "min-max" level brackets -> fee per attempt.
#                                Brackets must not overlap; levels not
#                                covered by any bracket upgrade for FREE and
#                                a warning is logged on load/reload.
#   universal-stone-multiplier - fee multiplier when the universal stone
#                                (Đá Thiên Mệnh, universal-stone.id below)
#                                is used, e.g. 2.0 = double fee.
cost:
  enabled: true
  charge-on-failure: true
  levels:
    "0-20": 100000
    "21-40": 500000
    "41-60": 2000000
    "61-80": 5000000
    "81-99": 10000000
  universal-stone-multiplier: 2.0

# Min milliseconds between two confirm-button clicks. Blocks double-click /
# spam-click from charging the fee (and consuming stones) more than once.
confirm-click-cooldown-ms: 400

# MMOItems item types (MMOITEMS_ITEM_TYPE) counted as weapon / armor / jewelry
# for matching a stone's marker below. Anything not in these lists can't be
# upgraded (UNSUPPORTED_TYPE).
weapon-item-types:
  - SWORD
  - AXE
  - STAFF
  - DAGGER
  - BOW
  - CROSSBOW
  - HAMMER
  - GAUNTLET
  - MUSKET
  - SPEAR
  - TOOL
armor-item-types:
  - ARMOR
  - HELMET
  - CHESTPLATE
  - LEGGINGS
  - BOOTS
  - SHIELD
jewelry-item-types:
  - ACCESSORY
  - RING
  - AMULET
  - BRACELET
  - GLOVES

# A stone's MMOITEMS_ITEM_ID must contain the matching marker below for the
# kind of gear it's used on, unless it's the universal stone.
weapon-stone-marker: "_VU_KHI_"
armor-stone-marker: "_GIAP_"
jewelry-stone-marker: "_TRANG_SUC_"

# One universal stone that works on anything, at any level, at a guaranteed rate.
universal-stone:
  id: DA_CUONG_HOA_THIEN_MENH
  rate: 100

# Tiers: a stone's MMOITEMS_ITEM_ID must contain the tier's name (e.g.
# "SO_CAP") as a substring to match. Unlike the universal stone, every tier
# below works at ANY current level - there's no min/max-level window anymore.
# Instead the success rate decays smoothly as the item's level rises:
#
#   rate = base-rate * (decay-factor ^ current-level), floored at min-rate
#
# Higher tiers start with a higher base-rate (and floor), so a better stone
# always beats a worse one at the same item level. e.g. HUYEN_THOAI at
# base-rate 85, decay-factor 0.97: ~85% at level 0, ~46.7% at level 20,
# ~25.6% at level 40, then flattens at its 5% floor; SO_CAP with base-rate
# 10 is always weaker at every level.
tiers:
  SO_CAP:
    base-rate: 10
    decay-factor: 0.97
    min-rate: 1
  TRUNG_CAP:
    base-rate: 25
    decay-factor: 0.97
    min-rate: 2
  CAO_CAP:
    base-rate: 45
    decay-factor: 0.97
    min-rate: 2
  SIEU_CAP:
    base-rate: 65
    decay-factor: 0.97
    min-rate: 2
  HUYEN_THOAI:
    base-rate: 85
    decay-factor: 0.97
    min-rate: 2
