    need-level: "&c&l❖ [LỖI] &fBạn phải đạt &e&lMMOCore Level {level} &fmới có thể Chuyển Sinh!"
    need-money: "&c&l❖ [LỖI] &fBạn cần &e&l${money} Money &fđể Chuyển Sinh!"
