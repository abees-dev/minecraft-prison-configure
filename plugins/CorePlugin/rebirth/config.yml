# ============================================================================
# CorePlugin - Rebirth ("Chuyển Sinh") module configuration
# ============================================================================
# Kotlin port of Skript/scripts/rebirth/{config,main}.sk: the rebirth + perk
# tree GUI opened by /chuyensinh (alias: /rebirth), admin commands
# /givedachuyensinh, /setcs, /resetcs, /csaura, the combat perk buffs, the
# particle aura loop and the permanent MMOCore EXP bonus.
#
# Player progression (rebirth level, skill points, perk levels, aura toggle)
# is NOT in this file - it lives in rebirth-data.yml next to it, which the
# plugin rewrites automatically. Only edit THIS file.
#
# Changes take effect after either:
#   - /chuyensinh reload   (requires permission: coreplugin.rebirth.admin)
#   - a server restart
#
# This file is only copied out ONCE, the first time the module starts. If a
# key is missing the plugin falls back to a safe built-in default instead of
# breaking - it will NOT overwrite or regenerate this file, so your comments
# and edits are safe.
#
# Player-facing strings live in messages.yml; GUI title/rows/slots live in
# gui.yml (same folder). Exception: `perks.*.display` stays here since it's
# part of each perk's definition, not a generic message template.
# ============================================================================

# Maximum rebirth level (the Skript's get_cs_max_level()).
max-level: 20

# Skill points awarded per rebirth.
points-per-rebirth: 3

# Điểm thuộc tính MMOCore nhận sau mỗi lần Chuyển Sinh.
attribute-points-per-rebirth: 2

# Permanent MMOCore EXP bonus per rebirth level (0.05 = +5%/level).
exp-bonus-per-level: 0.05

# Requirements to rebirth. rank is checked through the permission pattern
# below (the Skript checked "group.xprison_rank_9"), NOT through the X-Prison
# API - keep it in sync with your LuckPerms group names.
requirements:
  rank: 9
  rank-display: "Rank 9 [Vượt Ngục]"
  rank-permission-pattern: "group.xprison_rank_{rank}"
  mmocore-level: 100
  money: 100000000
  stone-id: DA_CHUYEN_SINH

# The 6 perks. display is used in chat messages; the GUI lore is built in
# code with the per-level effect values below. money/drop/speed are data-only
# exactly like the Skript (no listener applies them - other systems may read
# their levels), while damage/defense/lifesteal are applied on combat here.
perks:
  speed:
    display: "&e⚡ Thần Phong"
    max-level: 10
  damage:
    display: "&c🗡️ Sát Thương Thần Thoại"
    max-level: 10
  defense:
    display: "&b🛡️ Bất Hoại"
    max-level: 10
  lifesteal:
    display: "&4🩸 HUYẾT MA"
    max-level: 10
  money:
    display: "&6💰 PHÚ HỘ"
    max-level: 10
  drop:
    display: "&a💎 MAY MẮN THẦN THÁNH"
    max-level: 10

# Combat effect strength per perk level (fractions: 0.04 = 4%).
effects:
  damage-per-level: 0.04
  defense-per-level: 0.03
  lifesteal-per-level: 0.015

# Server-wide particle aura loop (per-player toggle lives in the GUI).
# The server-wide on/off switch itself (/csaura) is stored in rebirth-data.yml.
aura:
  period-seconds: 1
  # Rebirth level thresholds for the fancier particle tiers.
  tier2-at-level: 5
  tier3-at-level: 10

# Chat suffix set through LuckPerms after every rebirth level change. Tiers
# are checked from the highest min-level down; {level} is the rebirth level.
prefix-tiers:
  - min-level: 20
    prefix: "&4&l🔥{level} "
  - min-level: 10
    prefix: "&d&l👑{level} "
  - min-level: 5
    prefix: "&b&l⚡{level} "
  - min-level: 3
    prefix: "&e&l★{level} "
  - min-level: 0
    prefix: "&c&l❖{level} "

# Console command templates. {player} {amount} {id} {prefix} are substituted.
commands:
  take-stone: "mmoitems take MATERIAL {id} {player} {amount}"
  give-stone: "mmoitems give MATERIAL {id} {player} {amount}"
  set-suffix: "lp user {player} meta setsuffix 100 \"{prefix}\""
  unset-suffix: "lp user {player} meta unsetsuffix 100"
  give-attribute-points: "mmocore admin attribute-points give {player} {amount}"
  # Only run when the direct MMOCore API reset fails (the Skript always ran
  # these three syntax variants blindly; the API call is the primary path).
  mmocore-reset-fallbacks:
    - "mmocore admin level set {player} 1"
    - "mmocore admin set level {player} 1"
    - "mmocore admin set-level {player} 1"
  force-class-fallback: "mmocore admin force-class {player} {class}"
  set-skill-level-fallback: "mmocore admin skill level set {player} {skill} {level}"

