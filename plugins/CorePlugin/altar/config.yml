# ============================================================================
# CorePlugin - Altar ("Bàn Thờ Triệu Hồi") module configuration
# ============================================================================
# Generalized port of Skript/scripts/demon_king/: instead of ONE hardcoded
# armor stand, any number of altars can be defined here, and each altar is
# simply a BLOCK in the world - any block, anywhere. An admin binds an altar
# to a position in-game by looking at the block and running
#   /altar set <id>        (permission: coreplugin.altar.admin)
# Positions and cooldown state live in altar-data.yml next to this file
# (rewritten by the plugin - only edit THIS file).
#
# Right-clicking a bound block: checks the per-altar global cooldown, checks
# and consumes the key item (MMOItems id), waits summon-delay-seconds, then
# runs summon-commands from console. {player} {world} {x} {y} {z} {level}
# {max_level} {altar} {min} {sec} are substituted; x/y/z = altar + spawn-offset.
#
# Changes take effect after /altar reload or a restart. This file is only
# copied out ONCE - missing keys fall back to safe defaults, the plugin
# never overwrites it.
#
# Top-level player-facing strings live in messages.yml (same folder). The
# per-altar `messages:` override block below stays HERE instead, since it's
# part of each altar's own definition (tied to its id) rather than a generic
# template — moving it to messages.yml would mean duplicating altar ids there.
# This module has no configurable GUI, so there's no gui.yml.
# ============================================================================

# Seconds between two altar clicks from the SAME player (anti-spam).
click-throttle-seconds: 5

# How often the status-commands below re-run (hologram updates etc.).
status-update-seconds: 5

# Console command used to consume the key item. {id} {player} {amount}.
commands:
  take-key: mmoitems take MATERIAL {id} {player} {amount}

altars:
  # The original demon-king altar, now position-free: run
  #   /altar set ma_vuong
  # while looking at whatever block should be the altar.
  ma_vuong:
    display: "&4&lMa Vương Ngục Tù"
    # MMOItems item id required to summon ("" = free, no item needed).
    key-item: HUY_HIEU_TRIEU_HOI
    key-amount: 1
    # Global cooldown (shared by all players) after a successful summon.
    cooldown-seconds: 360
    # Delay between the start message and the summon commands.
    summon-delay-seconds: 3
    # Added to the altar block position for the {x} {y} {z} placeholders.
    spawn-offset:
      x: 0
      y: 1
      z: 0
    summon-commands:
      - mm mobs spawn PRISON_MA_VUONG_BOSS:{level} 1 {world},{x},{y},{z}
    effects:
      # Bukkit Sound name played at the altar on summon ("" = none).
      sound: ENTITY_WITHER_SPAWN
      # Visual-only lightning strike at the altar on summon.
      lightning: true
    # Per-altar message overrides (fall back to messages.yml).
    messages:
      no-key:
        "&c&l[Bàn Thờ] &fBạn cần &e1 Huy Hiệu Triệu Hồi &f(chế từ Huy Hiệu Vỡ
        rớt ở 9 Boss trong Nhà Tù) để đánh thức Ma Vương!"
      summon-start:
        "&6&l[Bàn Thờ] &fHuy Hiệu Triệu Hồi đã phát sáng... Ma Vương Ngục
        Tù sắp thức tỉnh!"
      summoned: "&4&l[TRÙM CUỐI] &fMa Vương Ngục Tù đã xuất hiện!"
      level-up: "&6&l[Bàn Thờ] &f{altar} &fđã tăng lên cấp &c{level}&f/&c{max_level}&f!"
    # Built-in floating hologram (a vanilla TextDisplay entity, no hologram
    # plugin needed). It hovers y-offset above the altar block, follows the
    # altar when /altar set moves it, and swaps between lines-ready and
    # lines-cooldown every status-update-seconds. {altar} {min} {sec} {level}
    # {max_level} are substituted. The entity is never saved to the world -
    # the plugin respawns it as needed, so no orphan holograms after crashes.
    hologram:
      enabled: true
      y-offset: 1.8
      lines-ready:
        - "&4&l⛧ &c&lBÀN THỜ MA VƯƠNG &4&l⛧"
        - "&eCấp &c{level}&7/&c{max_level} &a| Sẵn sàng"
        - "&7Cần &e1 Huy Hiệu Triệu Hồi &7(click phải)"
        - "&7Giết boss → &c+1 cấp &7· Loot mốc &e10&7/&e20&7/&e30&7/&e40&7/&e50"
        - "&8Không đánh 48h: -1 cấp · Reset ngày 1 hàng tháng"
      lines-cooldown:
        - "&4&l⛧ &c&lBÀN THỜ MA VƯƠNG &4&l⛧"
        - "&eCấp &c{level}&7/&c{max_level} &c| Đang hồi"
        - "&7Triệu hồi lại sau: &c{min} phút {sec} giây"
        - "&7Giết boss → &c+1 cấp &7· Loot mốc &e10&7/&e20&7/&e30&7/&e40&7/&e50"
        - "&8Không đánh 48h: -1 cấp · Reset ngày 1 hàng tháng"
    # Optional console commands re-run every status-update-seconds while the
    # altar has a position - for an EXTERNAL hologram plugin instead of the
    # built-in one above (e.g. DecentHolograms "dh line set ...", what the
    # old Skript did). {altar} {min} {sec} are substituted. Empty = disabled.
    status-commands:
      cooldown: []
      ready: []
    leveling:
      enabled: true
      mob-id: PRISON_MA_VUONG_BOSS
      min-level: 1
      max-level: 50
      decay-hours: 48
      reset:
        day-of-month: 1
        hour: 0
        minute: 0
      announce-on-kill: true
leveling-check-interval-seconds: 60
