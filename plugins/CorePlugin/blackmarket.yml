  expired-title: "&8[&c✦&8] &c&lITEM HẾT HẠN"

# Console command templates. {player} {amount} are substituted.
commands:
  # Used to pay an OFFLINE seller their (post-tax) money share.
  eco-give: "eco give {player} {amount}"
  points-take: "points take {player} {amount}"
  points-give: "points give {player} {amount}"

