# Docs:
#   Purpose: Join/quit messages (vanilla ones are suppressed). Config +
#     messages are kept together here since this feature has no other
#     tunables to separate them from.
#   Reload: /utility reload
#   Placeholders: %player%  %rank% (LuckPerms prefix of the player's
#     xprison_rank_N group — see Skript/scripts/admin/setup_luckperms_ranks.sk
#     for how those prefixes are set; falls back to rank-fallback below if
#     LuckPerms is missing, "?" if X-Prison is also missing).
#   message-delay-ticks: wait this long after join before reading %rank% and
#     broadcasting — gives the prison module's first-join rank grant (and
#     LuckPerms/X-Prison) time to apply before we read it back.
#   first-join: sent ONLY to the joining player (private welcome banner), in
#     addition to the normal public "join" broadcast everyone else sees.
#     Blank to disable. Supports embedded "\n" for multi-line messages.

enabled: true
message-delay-ticks: 10
join: '&a➜ &f%player% &7đã tham gia máy chủ &8[%rank%&8]'
quit: '&c← &f%player% &7đã rời máy chủ'
first-join: |2

  &6&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  &6&l✦ CHÀO MỪNG ĐẾN AETHER MINE ✦
  &fBạn đã nhận Rank %rank% &fvà bộ trang bị khởi đầu.
  &7Nhận lại kit bằng lệnh &e/kit tanbinh &8(24 giờ)
  &6&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# %rank% fallback when LuckPerms isn't installed (X-Prison rank id only). {id} = rank id.
rank-fallback: '&7Rank {id}'
rank-names:
  xprison_rank_1: '&f&lTân Binh'
  xprison_rank_2: '&7&lTù Nhân'
  xprison_rank_3: '&a&lLao Công'
  xprison_rank_4: '&2&lThợ Đào'
  xprison_rank_5: '&b&lĐội Trưởng'
  xprison_rank_6: '&1&lPhó Quản Ngục'
  xprison_rank_7: '&d&lQuản Ngục'
  xprison_rank_8: '&6&lBá Chủ Ngục Tù'
  xprison_rank_9: '&c&lVượt Ngục'
