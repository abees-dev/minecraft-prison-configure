# Docs:
#   Purpose: /bc command prefix + auto-rotating tip announcements.
#   Reload: /utility reload
#   Xóa hết auto.messages (hoặc auto.enabled: false) để tắt announce.

command-prefix: '&6[Server] &f'
auto:
  enabled: true
  interval-seconds: 320
  messages:
    - '&e[Tip] &7Làm &f/dailyquest &7mỗi ngày để nhận thưởng.'
    - '&b[Tip] &7Cường hóa trang bị: &f/cuonghoa'
    - '&a[Tip] &7Đục lỗ trang bị: &f/duclo'
    - '&d[Tip] &7Dùng &f/phanra &7và đặt trang sức vào ô giữa để phân rã.'
    - '&6[Tip] &7Bang Hội: &f/gang &7— nạp kho → &eBán Tất Cả &7để nhân bán (tiền vào bank bang).'
    - '&6[Tip] &7Nạp tiền bank bang có thuế &c30%&7. Ưu tiên nạp &equặng &7rồi Sell All.'
    - '&6[Tip] &7Quest bang: &f/gang quest &7· cá nhân: &f/gang personal &7(khác &f/dailyquest&7).'
    - '&c[Tip] &7Bang Chiến &f20:00 &7(đang phát triển): &f/gang war join &7hoặc &f/bangchien'
