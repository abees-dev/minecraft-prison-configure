# Docs:
#   Purpose: Player/admin messages for the redeem-code module.
#   Reload: /codeadmin reload
#   Legacy '&' color codes. {placeholders} substituted per message.

prefix: "&6&l[CODE]&r"

cooldown: "{prefix} &cVui lòng chờ vài giây trước khi nhập lại!"
usage: "{prefix} &fCú pháp: &e/code <mã>"
no-permission: "{prefix} &cBạn không có quyền dùng lệnh này!"
invalid: "{prefix} &cMã không hợp lệ hoặc không tồn tại!"
disabled: "{prefix} &cMã này đã bị tắt!"
expired: "{prefix} &cMã này đã hết hạn!"
already-used: "{prefix} &cBạn đã sử dụng mã này rồi!"
max-uses: "{prefix} &cMã này đã hết lượt sử dụng!"
no-rewards: "{prefix} &cMã này chưa có phần thưởng. Liên hệ admin!"
success: "{prefix} &aNhập mã thành công! &7(&e{code}&7)"

admin-no-permission: "{prefix} &cBạn không có quyền admin!"
admin-unknown: "{prefix} &cLệnh không rõ. Dùng &e/codeadmin &fđể xem giúp đỡ."
admin-create-usage: "{prefix} &fCú pháp: &e/codeadmin create <mã> [maxUses] [perPlayer]"
admin-create-exists: "{prefix} &cMã &e{code} &cđã tồn tại!"
admin-create-ok: "{prefix} &aĐã tạo mã &e{code}&a. maxUses=&e{max}&a perPlayer=&e{per}&a. Thêm reward bằng &e/codeadmin reward {code} add <cmd>"
admin-not-found: "{prefix} &cKhông tìm thấy mã &e{code}&c!"
admin-delete-ok: "{prefix} &aĐã xóa mã &e{code}&a (kèm lịch sử redeem)."
admin-enable-ok: "{prefix} &aĐã bật mã &e{code}&a."
admin-disable-ok: "{prefix} &aĐã tắt mã &e{code}&a."
admin-expire-usage: "{prefix} &fCú pháp: &e/codeadmin expire <mã> <hours|-1>"
admin-expire-ok: "{prefix} &aĐã đặt hết hạn mã &e{code}&a: &e{expire}"
admin-expire-never: "không hết hạn"
admin-expire-in: "sau {hours} giờ"
admin-reward-usage: "{prefix} &fCú pháp: &e/codeadmin reward <mã> <add|clear|list> [command...]"
admin-reward-add-ok: "{prefix} &aĐã thêm reward cho &e{code}&a: &7{cmd}"
admin-reward-clear-ok: "{prefix} &aĐã xóa hết reward của &e{code}&a."
admin-reward-empty: "{prefix} &eMã &f{code} &echưa có reward."
admin-reward-header: "{prefix} &fRewards của &e{code}&f:"
admin-reward-line: "&7  {index}. &f{cmd}"
admin-list-empty: "{prefix} &eChưa có mã nào."
admin-list-header: "{prefix} &fDanh sách mã (&e{count}&f):"
admin-list-line: "&7  &e{code} &8| &fuse={uses}/{max} &8| &fper={per} &8| &f{status} &8| &f{expire}"
admin-info-header: "{prefix} &fThông tin mã &e{code}&f:"
admin-info-line: "&7  {key}: &f{value}"
admin-reload-ok: "{prefix} &aĐã reload config/messages."
admin-help:
  - "{prefix} &e/codeadmin create <mã> [maxUses] [perPlayer]"
  - "{prefix} &e/codeadmin reward <mã> add <console command...>"
  - "{prefix} &e/codeadmin reward <mã> clear|list"
  - "{prefix} &e/codeadmin delete|enable|disable <mã>"
  - "{prefix} &e/codeadmin expire <mã> <hours|-1>"
  - "{prefix} &e/codeadmin list|info <mã>|reload"
