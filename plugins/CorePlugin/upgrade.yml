# ============================================================================
# CorePlugin - Upgrade ("Cường Hóa") module configuration
# ============================================================================
# Controls the equipment-upgrade GUI opened by /cuonghoa (aliases: /nangcap,
# /upgrade).
#
# Changes take effect after either:
#   - /cuonghoa reload   (requires permission: coreplugin.upgrade.reload)
#   - a server restart
#
# This file is only copied out ONCE, the first time the module starts. If
# you hand-add a new key later it will be read normally. If a key is simply
# missing, the plugin falls back to a safe built-in default instead of
# breaking - it will NOT overwrite or regenerate this file, so your comments
# and edits are safe.
# ============================================================================

gui:
  title: "&8[&c✦&8] &c&lCƯỜNG HÓA TRANG BỊ"
  rows: 6
  slots:
    equipment: 19 # player places the gear to upgrade here
    stone: 25 # player places the upgrade stone here
    info: 22 # decorative info icon, no action on click
    confirm: 40 # click to attempt the upgrade
    close: 49 # click to close the GUI (unplaced items are returned)

# Max upgrade level an item can reach.
max-level: 100

# MMOItems item types (MMOITEMS_ITEM_TYPE) counted as a "weapon" vs "armor"
# for the purposes of matching a stone's weapon/armor marker below. Anything
# not in either list can't be upgraded at all (UNSUPPORTED_TYPE).
weapon-item-types:
  - SWORD
  - AXE
  - STAFF
  - DAGGER
  - BOW
  - CROSSBOW
  - HAMMER
  - GAUNTLET
  - MUSKET
  - SPEAR
  - TOOL
armor-item-types:
  - ARMOR
  - HELMET
  - CHESTPLATE
  - LEGGINGS
  - BOOTS
  - SHIELD
  - ACCESSORY
  - RING
  - AMULET
  - BRACELET
  - GLOVES

# A stone's MMOITEMS_ITEM_ID must contain the matching marker below for the
# kind of gear it's used on, unless it's the universal stone.
weapon-stone-marker: "_VU_KHI_"
armor-stone-marker: "_GIAP_"

# One universal stone that works on anything, at any level, at a guaranteed rate.
universal-stone:
  id: DA_CUONG_HOA_THIEN_MENH
  rate: 100

# Tiers: a stone's MMOITEMS_ITEM_ID must contain the tier's name (e.g.
# "SO_CAP") as a substring to match. Unlike the universal stone, every tier
# below works at ANY current level - there's no min/max-level window anymore.
# Instead the success rate decays smoothly as the item's level rises:
#
#   rate = base-rate * (decay-factor ^ current-level), floored at min-rate
#
# Higher tiers start with a higher base-rate (and floor), so a better stone
# always beats a worse one at the same item level. e.g. HUYEN_THOAI at
# base-rate 85, decay-factor 0.97: ~85% at level 0, ~46.7% at level 20,
# ~25.6% at level 40, then flattens at its 5% floor; SO_CAP with base-rate
# 10 is always weaker at every level.
tiers:
  SO_CAP:
    base-rate: 10
    decay-factor: 0.97
    min-rate: 1
  TRUNG_CAP:
    base-rate: 25
    decay-factor: 0.97
    min-rate: 2
  CAO_CAP:
    base-rate: 45
    decay-factor: 0.97
    min-rate: 2
  SIEU_CAP:
    base-rate: 65
    decay-factor: 0.97
    min-rate: 2
  HUYEN_THOAI:
    base-rate: 85
    decay-factor: 0.97
    min-rate: 2

# {value1}/{value2} get substituted per message - see UpgradeService.kt for
# exactly what each one is when a message is sent.
messages:
  SUCCESS: "&a&l[✦] CƯỜNG HÓA THÀNH CÔNG! &7Trang bị đã được nâng cấp lên &e+{value1}&7!"
  FAIL: "&c&l[-] CƯỜNG HÓA THẤT BẠI! &7Đã tiêu hao 1x Đá Cường Hóa, trang bị giữ nguyên cấp &e+{value1}&7."
  NO_ITEM: "&c[!] Hãy đặt Trang Bị cần cường hóa vào ô bên trái!"
  INVALID_ITEM: "&c[!] Vật phẩm này không hợp lệ hoặc không có dữ liệu MMOItems!"
  NOT_MMOITEM: "&c[!] Trang bị này không phải là MMOItem hợp lệ!"
  MAX_LEVEL: "&e[!] Trang bị này đã đạt Cấp Cường Hóa Tối Đa (LV {value1})!"
  NO_STONE: "&c[!] Hãy đặt Đá Cường Hóa vào ô bên phải!"
  INVALID_STONE: "&c[!] Vật phẩm đá không phải Đá Cường Hóa hợp lệ!"
  UNSUPPORTED_TYPE: "&c[!] Loại trang bị '{value1}' không hỗ trợ cường hóa!"
  MISMATCH_STONE: "&c[!] Đá cường hóa không phù hợp với trang bị!"
