# ============================================================================
# CorePlugin - Prison module configuration
# ============================================================================
# Kotlin port of Skript/scripts/prison/ (pickaxe_upgrade.sk, mine_rank_limit.sk,
# level_gate.sk):
#   - /nangcapcuoc            pickaxe upgrade (MMOItems + Vault money + stones)
#   - block-break gating      per-mine rank requirement (WorldGuard regions,
#                             X-Prison ranks) + optional daily block limit
#   - /minelimit              mining status / admin reset / reload
#   - /xrankup, /xrankuppoint level-gated rankup (MMOCore level requirement),
#                             plus interception of /rankup, /rank, ... aliases
#
# Changes take effect after either:
#   - /minelimit reload   (requires permission: coreplugin.prison.admin)
#   - a server restart
#
# This file is only copied out ONCE, the first time the module starts. If a
# key is missing the plugin falls back to a safe built-in default instead of
# breaking - it will NOT overwrite or regenerate this file, so your comments
# and edits are safe.
#
# Player-facing strings live in messages.yml (same folder). This module has
# no configurable GUI (rank menu is delegated to another plugin), so there's
# no gui.yml.
# ============================================================================

# The 9 prison ranks, keyed by X-Prison rank id (1 = lowest). Per rank:
#   slug                 used to build MMOItems ids (see pickaxe-upgrade below)
#   display              rank name shown in messages (legacy '&' codes)
#   mine-region          WorldGuard region id of this rank's mine
#   mine-display         mine name shown in messages
#   daily-block-limit    max blocks/day when daily-limit.enabled is true
#                        (-1 = unlimited)
#   level-for-next-rank  MMOCore level required to rank up FROM this rank
#   point-cost           PlayerPoints price to rank up TO this rank via
#                        /xrankuppoint (ignored for rank 1)
#   pickaxe-base-value   base money used for this rank's pickaxe upgrade costs
