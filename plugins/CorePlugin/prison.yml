# Optional daily mining cap (per player, per rank, resets at midnight server
# time). Off by default - same as the Skript's ENABLE_DAILY_LIMIT option.
# Counters live in memory only, so a server restart also resets them.
daily-limit:
  enabled: false
  # Seconds between repeated "not enough rank" / "limit reached" warnings to
  # the same player (they keep getting blocked, just not re-spammed).
  warn-cooldown-seconds: 3

# Pickaxe upgrade (/nangcapcuoc). Item ids are built from the patterns below:
# each rank has pickaxes {rank-slug} step 1..max-step (e.g. PICKAXE_TAN_BINH_3)
# and one upgrade stone (e.g. DA_NANG_CAP_TAN_BINH). Upgrading step N -> N+1
# uses row N of `steps`: it costs round(pickaxe-base-value * money-percent)
# money plus stone-cost stones, and succeeds success-rate % of the time.
# Money and stones are consumed on BOTH success and failure (the pickaxe
# itself is never lost) - same rule as the Skript.
pickaxe-upgrade:
  item-id-pattern: "PICKAXE_{rank}_{step}"
  stone-id-pattern: "DA_NANG_CAP_{rank}"
  # Highest pickaxe step that exists. Steps below only need entries up to
  # max-step - 1 (the last step has nothing to upgrade into).
  max-step: 5
  steps:
    1:
      money-percent: 0.05
      stone-cost: 8
      success-rate: 70
    2:
      money-percent: 0.08
      stone-cost: 16
      success-rate: 50
    3:
      money-percent: 0.12
      stone-cost: 32
      success-rate: 30
    4:
      money-percent: 0.18
      stone-cost: 64
      success-rate: 15
  # Console commands used to consume/grant the MMOItems involved.
  # {id} {player} {amount} are substituted.
  commands:
    take-stone: "mmoitems take MATERIAL {id} {player} {amount}"
    take-pickaxe: "mmoitems take TOOL {id} {player} 1"
    give-pickaxe: "mmoitems give TOOL {id} {player} 1"

commands:
  # Typed commands that get intercepted and replaced by this module's
  # level-gated rankup (money variant). X-Prison's own /rankup never runs.
  rankup-aliases:
    - rankup
    - rankupmax
    - autorankup
  # Typed commands that get intercepted and redirected to open-ranks-menu.
  menu-aliases:
    - rankgui
    - ranksmenu
    - ranks
    - rank
    - rankmenu
    - vip
    - viprank
    - vipranks
  # Console command templates. {player} {rank} {amount} are substituted.
  setrank: "setrank {player} {rank}"
  points-take: "points take {player} {amount}"
  open-ranks-menu: "dm open ranks_master {player}"

