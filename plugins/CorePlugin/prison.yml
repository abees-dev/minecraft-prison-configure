#   mine-region          WorldGuard region id of this rank's mine
#   mine-display         mine name shown in messages
#   daily-block-limit    max blocks/day when daily-limit.enabled is true
#                        (-1 = unlimited)
#   level-for-next-rank  MMOCore level required to rank up FROM this rank
#   point-cost           PlayerPoints price to rank up TO this rank via
