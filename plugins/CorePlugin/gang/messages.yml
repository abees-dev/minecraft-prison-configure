# Docs:
#   Purpose: Player-facing messages for the Gang ("Bang Hội") module.
#   Reload: /gang reload
#   Style: no "[GANG]" tag prefix — a leading colored "✦" marks the tone
#   (green = success, red = error, yellow = neutral/warning). Longer
#   transactional messages (create/upgrade/level up/disband/KOTH/invite) are
#   multi-line blocks using a literal "\n" — Minecraft chat renders embedded
#   newlines as real line breaks within a single message.

