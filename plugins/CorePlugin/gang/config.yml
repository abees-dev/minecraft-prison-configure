# Docs:
#   Purpose: Gang ("Bang Hội") — create/invite/bank/vault/shop, danh vọng
#     upgrades, Gang Protection, VIP KOTH mine (WorldGuard).
#   Reload: /gang reload (YAML only; storage.type requires restart)
#   Server: Paper 1.19.4+
#   Copied once on first enable — plugin never overwrites this file.
#   Player-facing strings live in messages.yml; GUI titles/bank-amounts live
#   in gui.yml (same folder). DB schema files (schema-sqlite.sql/
#   schema-mysql.sql) also live in this folder.

create:
  # Cost to create a gang, indexed by how many gangs already exist.
  # Index 0 = first gang on the server, last entry reused for overflow.
  costs:
    - 100000
    - 250000
    - 500000
    - 1000000
  default-member-slots: 5
  default-vault-capacity: 256
  name-max-length: 30
  # Visible characters after stripping & color codes (and hex &#rrggbb).
  prefix-max-length: 6

invite:
  timeout-seconds: 300

disband:
  # Pending /gang disband confirm expires after this many seconds.
  confirm-timeout-seconds: 60

# Materials accepted into the vault (any pickaxe works — gated only by
# the gang's vault toggle, see `vault:` below).
ore-whitelist:
  - COAL_ORE
  - DEEPSLATE_COAL_ORE
  - IRON_ORE
  - DEEPSLATE_IRON_ORE
  - COPPER_ORE
  - DEEPSLATE_COPPER_ORE
  - GOLD_ORE
  - DEEPSLATE_GOLD_ORE
  - REDSTONE_ORE
  - DEEPSLATE_REDSTONE_ORE
  - LAPIS_ORE
  - DEEPSLATE_LAPIS_ORE
  - DIAMOND_ORE
  - DEEPSLATE_DIAMOND_ORE
  - EMERALD_ORE
  - DEEPSLATE_EMERALD_ORE
  - NETHER_GOLD_ORE
  - NETHER_QUARTZ_ORE
  - ANCIENT_DEBRIS
  - RAW_IRON
  - RAW_GOLD
  - RAW_COPPER
  - COAL
  - DIAMOND
  - EMERALD
  - LAPIS_LAZULI
  - REDSTONE
  - QUARTZ
  - IRON_INGOT
  - GOLD_INGOT
  - COPPER_INGOT
  - NETHERITE_SCRAP

# Fixed sell prices for /gang vault "Bán Tất Cả" (money → gang bank).
sell-prices:
  COAL: 5
  COAL_ORE: 5
  DEEPSLATE_COAL_ORE: 6
  RAW_IRON: 12
  IRON_ORE: 12
  DEEPSLATE_IRON_ORE: 14
  IRON_INGOT: 20
  RAW_COPPER: 8
  COPPER_ORE: 8
  DEEPSLATE_COPPER_ORE: 9
  COPPER_INGOT: 14
  RAW_GOLD: 25
  GOLD_ORE: 25
  DEEPSLATE_GOLD_ORE: 28
  NETHER_GOLD_ORE: 22
  GOLD_INGOT: 40
  REDSTONE: 4
  REDSTONE_ORE: 8
  DEEPSLATE_REDSTONE_ORE: 9
  LAPIS_LAZULI: 6
  LAPIS_ORE: 12
  DEEPSLATE_LAPIS_ORE: 14
  DIAMOND: 100
  DIAMOND_ORE: 80
  DEEPSLATE_DIAMOND_ORE: 90
  EMERALD: 120
  EMERALD_ORE: 100
  DEEPSLATE_EMERALD_ORE: 110
  QUARTZ: 8
  NETHER_QUARTZ_ORE: 8
  ANCIENT_DEBRIS: 500
  NETHERITE_SCRAP: 600

# Danh vọng (reputation) gained per item deposited into the vault.
reputation-per-item: 1

# Phase 2 — permanent upgrades (paid with the gang's shared reputation AND
# money from the gang bank — both are required). max-level here is also
# capped by the gang's current Bang Level (see `level:` below) — whichever
# is lower wins.
upgrades:
  sell:
    max-level: 5
    # Reputation cost to reach level 1, 2, ... (last reused).
    reputation-costs: [100, 250, 500, 1000, 2000]
    # Money cost (from gang bank), same indexing as reputation-costs above.
    money-costs: [50000, 150000, 400000, 900000, 2000000]
    multiplier-per-level: 0.1
  magnet:
    max-level: 5
    reputation-costs: [100, 250, 500, 1000, 2000]
    money-costs: [50000, 150000, 400000, 900000, 2000000]
    # Extra % ores deposited into vault per level.
    bonus-percent-per-level: 5
  protection:
    max-level: 5
    reputation-costs: [150, 300, 600, 1200, 2400]
    money-costs: [75000, 200000, 500000, 1200000, 2500000]
    reduction-per-level: 0.05
    max-reduction: 0.40

# Bang Level — permanent gang-wide progression, paid with gang reputation
# (danh vọng) AND money from the gang bank (both required). Each level:
#   - raises the max reachable level for Sell/Magnet/Protection above by 1
#     (still capped at each upgrade's own max-level)
#   - permanently grows the vault capacity by vault-capacity-per-level
#   - reaching vault.required-level below unlocks toggling the ore vault on
level:
  max-level: 10
  # Reputation cost to reach level 2, 3, ... 10 (index 0 = cost to reach level 2).
  reputation-costs: [200, 400, 700, 1100, 1600, 2200, 3000, 4000, 5500]
  # Money cost (from gang bank), same indexing as reputation-costs above.
  money-costs:
    [
      500000,
      1000000,
      2000000,
      3500000,
      5500000,
      8000000,
      11000000,
      15000000,
      20000000,
    ]
  # Vault capacity gained EACH time the gang levels up (flat bonus, stacks
  # with Shop's "Mở rộng sức chứa kho" purchases).
  vault-capacity-per-level: 50

# Ore vault auto-deposit toggle — PER MEMBER (any member can flip their own,
# see /gang vault GUI), so one player farming for themselves doesn't need
# the leader online to flip a shared switch.
vault:
  # Minimum Bang Level required before a member can toggle their own switch on.
  required-level: 3
  # Cho phép member lấy khoáng ra khỏi kho (click trong GUI).
  # Khi BẬT: cùng lúc chỉ 1 người được mở kho bang (anti-dupe).
  allow-take: true

bank:
  # Seconds to type a custom deposit/withdraw amount in chat (bank GUI
  # "Nhập số" buttons) before the prompt expires.
  custom-amount-timeout-seconds: 30

# Quest Bang Hội (Gunny-style). Open / reset / ticket = GUI only.
# Command: /gang quest (GUI), /gang quest info (read-only).
# Objective pools: quests.yml. STATION_CRAFT = MMOItems station on NPC
# (not vanilla CRAFT_ITEM; trade at warp does not count).
# pick-count: distinct random quests per open; all must finish for one reward.
quest:
  daily-opens: 1
  # Hour (0-23, server timezone) when daily open counters reset.
  reset-hour: 0
  free-resets: 1
  max-paid-resets: 3
  ticket:
    mmoitems-type: CONSUMABLE
    mmoitems-id: GUILD_QUEST_TICKET
  boss-bar:
    enabled: true
    color: YELLOW
    style: SOLID
    # Overall board progress only — no per-quest names. Details: /gang quest info
    title: "&eQuest Bang Lv{level} &8| &f{percent}% &7({progress}/{target})"
  levels:
    1:
      min-members: 1
      min-online: 1
      # Random distinct quests from pool each open (pool smaller → take all).
      pick-count: 3
      duration-minutes: 60
      open-cost: { money: 10000.0, reputation: 50 }
      reset-cost: { money: 5000.0, reputation: 25 }
      reward-reputation: 200
    2:
      min-members: 3
      min-online: 2
      pick-count: 3
      duration-minutes: 90
      open-cost: { money: 50000.0, reputation: 150 }
      reset-cost: { money: 25000.0, reputation: 75 }
      reward-reputation: 600
    3:
      min-members: 5
      min-online: 3
      pick-count: 3
      duration-minutes: 120
      open-cost: { money: 150000.0, reputation: 400 }
      reset-cost: { money: 75000.0, reputation: 200 }
      reward-reputation: 1500

# Phase 2 — VIP KOTH mine (WorldGuard region).
koth:
  enabled: true
  region: gang_vip_mine
  # Seconds of uncontested presence to capture.
  capture-seconds: 60
  money-per-ore: 10
  # Owner gang members earn money-per-ore * this multiplier.
  owner-multiplier: 5.0
  # Fraction of non-owner VIP earnings paid into the owner gang bank.
  tax-rate: 0.2

shop:
  expand-slots:
    cost: 50000
    amount: 1
  expand-capacity:
    cost: 25000
    amount: 64
  buff-sell-2x:
    cost: 100000
    duration-seconds: 3600
    multiplier: 2.0
  buff-haste:
    cost: 50000
    duration-seconds: 3600
    amplifier: 2

# Read once at startup. type: sqlite or mysql.
storage:
  type: sqlite
  sqlite:
    file: gang.db
  mysql:
    host: localhost
    port: 3306
    database: coreplugin
    username: root
    password: ""
    pool-size: 4
