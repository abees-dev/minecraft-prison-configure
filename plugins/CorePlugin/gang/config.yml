# Docs:
#   Full gameplay + config guide: README.md (same folder / jar path gang/).
#   Purpose: Gang ("Bang Hội") — create/invite/bank/vault/shop, danh vọng
#     upgrades, Gang Protection, VIP KOTH mine (WorldGuard).
#   Reload: /gang reload (YAML only; storage.type requires restart)
#   Server: Paper 1.19.4+
#   Copied once on first enable — plugin never overwrites this file.
#   Player-facing strings live in messages.yml; GUI titles/bank-amounts live
#   in gui.yml (same folder). DB schema files (schema-sqlite.sql/
#   schema-mysql.sql) also live in this folder.

create:
  # Cost to create a gang, indexed by how many gangs already exist.
  # Index 0 = first gang on the server, last entry reused for overflow.
  costs:
    - 1000000
    - 2500000
    - 5000000
    - 10000000
  default-member-slots: 5
  default-vault-capacity: 1000
  name-max-length: 30
  # Visible characters after stripping & color codes (and hex &#rrggbb).
  prefix-max-length: 6

invite:
  timeout-seconds: 300

disband:
  # Pending /gang disband confirm expires after this many seconds.
  confirm-timeout-seconds: 60

# Shared GUI anti-spam for shop / upgrade / bank / kick / etc.
gui:
  # Milliseconds between action clicks per player (spam guard).
  click-cooldown-millis: 100

# Materials accepted into the vault (any pickaxe works — gated only by
# the gang's vault toggle, see `vault:` below).
# Khớp block/item từ 9 mine X-Prison + drop + dạng nấu/nén (Ores.yml) —
# KHÔNG thêm copper / deepslate (không có trong world_prison).
ore-whitelist:
  # Đá mỏ sơ cấp
  - STONE
  - COBBLESTONE
  - SMOOTH_STONE
  # Quặng block (Silk Touch / block trong mỏ)
  - COAL_ORE
  - IRON_ORE
  - GOLD_ORE
  - REDSTONE_ORE
  - LAPIS_ORE
  - DIAMOND_ORE
  - EMERALD_ORE
  - NETHER_GOLD_ORE
  - NETHER_QUARTZ_ORE
  - ANCIENT_DEBRIS
  # Drop thô khi đào (không Silk Touch)
  - COAL
  - RAW_IRON
  - RAW_GOLD
  - REDSTONE
  - LAPIS_LAZULI
  - DIAMOND
  - EMERALD
  - QUARTZ
  - GOLD_NUGGET
  # Quặng đã nấu (furnace / blast)
  - IRON_INGOT
  - GOLD_INGOT
  - NETHERITE_SCRAP
  - NETHERITE_INGOT
  # Block nén (9 ore → 1 block; dùng refinery + Sell All)

# Fixed sell prices for /gang vault "Bán Tất Cả" (money → gang bank).
# Đồng bộ với EconomyShopGUI/shops/Ores.yml; server không dùng X-Prison AutoSell.
# Item, ore, thỏi và block nén dùng cùng mặt bằng giá để không lách qua chế tạo.
# Sau Sell All còn nhân upgrade Sell / buff shop / paragon.
sell-prices:
  # Economy scale 2026-08-07: toàn bộ bảng giá ×10; money sink chính cũng ×10.
  # Đá
  STONE: 10
  COBBLESTONE: 20
  SMOOTH_STONE: 10
  # Than
  COAL: 80
  COAL_ORE: 80
  COAL_BLOCK: 720
  # Sắt
  RAW_IRON: 100
  IRON_ORE: 100
  IRON_INGOT: 200
  RAW_IRON_BLOCK: 900
  IRON_BLOCK: 1800
  # Vàng
  RAW_GOLD: 200
  GOLD_ORE: 200
  GOLD_NUGGET: 30
  NETHER_GOLD_ORE: 120
  GOLD_INGOT: 400
  RAW_GOLD_BLOCK: 1800
  GOLD_BLOCK: 3600
  # Redstone / Lapis / Quartz
  REDSTONE: 150
  REDSTONE_ORE: 150
  REDSTONE_BLOCK: 1350
  LAPIS_LAZULI: 80
  LAPIS_ORE: 80
  LAPIS_BLOCK: 720
  QUARTZ: 20
  NETHER_QUARTZ_ORE: 20
  QUARTZ_BLOCK: 80
  # Kim cương / Emerald / Netherite
  # Balance 2026-08-07: giá nền nhắm ~500K/phút với cuốc max tại map gần
  # cuối khi Bang chưa nâng Sell; đồng bộ cả item, ore và block nén.
  DIAMOND: 1000
  DIAMOND_ORE: 1000
  DIAMOND_BLOCK: 9000
  EMERALD: 1500
  EMERALD_ORE: 1500
  EMERALD_BLOCK: 13500
  ANCIENT_DEBRIS: 2000
  NETHERITE_SCRAP: 2000
  NETHERITE_INGOT: 6000
  NETHERITE_BLOCK: 54000
  # Stub — không nằm 9 mỏ, không trong whitelist (phòng Sell All legacy)
  DEEPSLATE_COAL_ORE: 80
  DEEPSLATE_IRON_ORE: 100
  RAW_COPPER: 50
  COPPER_ORE: 50
  DEEPSLATE_COPPER_ORE: 50
  COPPER_INGOT: 100
  DEEPSLATE_GOLD_ORE: 200
  DEEPSLATE_REDSTONE_ORE: 150
  DEEPSLATE_LAPIS_ORE: 80
  DEEPSLATE_DIAMOND_ORE: 1000
  DEEPSLATE_EMERALD_ORE: 1500

# Danh vọng (reputation) gained per item deposited into the vault.
reputation-per-item: 1

# Phase 2 — permanent upgrades (paid with the gang's shared reputation AND
# money from the gang bank — both are required). Each tier lists the minimum
# Bang Level in `required-bang-levels` (index 0 = upgrade Lv1). Missing list
# falls back to 1:1 (upgrade Lv N needs Bang Lv N).
upgrades:
  sell:
    max-level: 5
    required-bang-levels:
      - 1
      - 2
      - 3
      - 4
      - 5
    # Reputation cost to reach level 1, 2, ... (last reused).
    reputation-costs:
      - 100
      - 250
      - 500
      - 1000
      - 2000
    # Money cost (from gang bank), same indexing as reputation-costs above.
    money-costs:
      - 500000
      - 1500000
      - 4000000
      - 9000000
      - 20000000
    multiplier-per-level: 0.1
  magnet:
    max-level: 5
    required-bang-levels:
      - 1
      - 2
      - 3
      - 4
      - 5
    reputation-costs:
      - 100
      - 250
      - 500
      - 1000
      - 2000
    money-costs:
      - 500000
      - 1500000
      - 4000000
      - 9000000
      - 20000000
    # Extra % ores deposited into vault per level.
    bonus-percent-per-level: 5
  protection:
    max-level: 5
    required-bang-levels:
      - 1
      - 2
      - 3
      - 4
      - 5
    reputation-costs:
      - 150
      - 300
      - 600
      - 1200
      - 2400
    money-costs:
      - 750000
      - 2000000
      - 5000000
      - 12000000
      - 25000000
    reduction-per-level: 0.05
    max-reduction: 0.4
  quest-mastery:
    max-level: 5
    required-bang-levels:
      - 2
      - 3
      - 4
      - 6
      - 8
    reputation-costs:
      - 150
      - 300
      - 600
      - 1200
      - 2400
    money-costs:
      - 750000
      - 2000000
      - 5000000
      - 12000000
      - 25000000
    # Extra % reputation + season points on shared-quest clear.
    reward-bonus-per-level: 0.05
  quest-efficiency:
    max-level: 5
    required-bang-levels:
      - 2
      - 3
      - 4
      - 6
      - 8
    reputation-costs:
      - 150
      - 300
      - 600
      - 1200
      - 2400
    money-costs:
      - 750000
      - 2000000
      - 5000000
      - 12000000
      - 25000000
    # % off open/reset money+reputation costs.
    cost-reduction-per-level: 0.05
    max-reduction: 0.4
  quest-capacity:
    max-level: 5
    required-bang-levels:
      - 2
      - 3
      - 4
      - 6
      - 8
    reputation-costs:
      - 150
      - 300
      - 600
      - 1200
      - 2400
    money-costs:
      - 750000
      - 2000000
      - 5000000
      - 12000000
      - 25000000
    # Extra shared-quest daily opens per level.
    opens-per-level: 1
  warlord:
    max-level: 5
    required-bang-levels:
      - 3
      - 4
      - 6
      - 8
      - 10
    reputation-costs:
      - 150
      - 300
      - 600
      - 1200
      - 2400
    money-costs:
      - 750000
      - 2000000
      - 5000000
      - 12000000
      - 25000000
    # Extra % PvP damage vs players in another gang.
    damage-bonus-per-level: 0.04
    max-bonus: 0.2
  koth-control:
    max-level: 5
    required-bang-levels:
      - 3
      - 4
      - 6
      - 8
      - 10
    reputation-costs:
      - 150
      - 300
      - 600
      - 1200
      - 2400
    money-costs:
      - 750000
      - 2000000
      - 5000000
      - 12000000
      - 25000000
    # Seconds shaved off capture / added to post-capture defense per level.
    capture-seconds-per-level: 4
    defense-seconds-per-level: 5

# Bang Level — permanent gang-wide progression, paid with gang reputation
# (danh vọng) AND money from the gang bank (both required). Each level:
#   - unlocks higher permanent-upgrade tiers via each upgrade's
#     required-bang-levels (see upgrades: above)
#   - permanently grows the vault capacity by vault-capacity-per-level
#   - reaching vault.required-level below unlocks toggling the ore vault on
level:
  max-level: 10
  # Reputation cost to reach level 2, 3, ... 10 (index 0 = cost to reach level 2).
  reputation-costs:
    - 200
    - 400
    - 700
    - 1100
    - 1600
    - 2200
    - 3000
    - 4000
    - 5500
  # Money cost (from gang bank), same indexing as reputation-costs above.
  money-costs:
    - 5000000
    - 10000000
    - 20000000
    - 35000000
    - 55000000
    - 80000000
    - 110000000
    - 150000000
    - 200000000
  # Vault capacity gained EACH time the gang levels up (flat bonus, stacks
  # with Shop's "Mở rộng sức chứa kho" purchases).
  vault-capacity-per-level: 500

# Ore vault auto-deposit toggle — PER MEMBER (any member can flip their own,
# see /gang vault GUI), so one player farming for themselves doesn't need
# the leader online to flip a shared switch.
vault:
  # Minimum Bang Level required before a member can toggle their own switch on.
  required-level: 1
  # Cho phép member lấy khoáng ra khỏi kho (click trong GUI).
  # Khi BẬT: cùng lúc chỉ 1 người được mở kho bang (anti-dupe).
  allow-take: true

bank:
  # Seconds to type a custom deposit/withdraw amount in chat (bank GUI
  # "Nhập số" buttons) before the prompt expires.
  custom-amount-timeout-seconds: 30
  deposit-tax-rate: 0.3

# Quest Bang Hội (Gunny-style). Open / reset / ticket = GUI only.
# Command: /gang quest (GUI), /gang quest info (read-only).
# Objective pools: quests.yml. STATION_CRAFT = MMOItems station on NPC
# (not vanilla CRAFT_ITEM; trade at warp does not count).
# pick-count: distinct random quests per open; all must finish for one reward.
quest:
  daily-opens: 1
  # Hour (0-23, server timezone) when daily open counters reset.
  reset-hour: 0
  free-resets: 1
  max-paid-resets: 3
  ticket:
    mmoitems-type: CONSUMABLE
    mmoitems-id: GUILD_QUEST_TICKET
    # Player-facing name in GUI/messages. Empty → show type/id.
    display: Phiếu Quest Bang
  boss-bar:
    enabled: true
    color: YELLOW
    style: SOLID
    # Overall board progress only — no per-quest names. Details: /gang quest info
    title: "&eQuest Bang Lv{level} &8| &f{percent}% &7({progress}/{target})"
  levels:
    "1":
      min-members: 1
      min-online: 1
      # Random distinct quests from pool each open (pool smaller → take all).
      pick-count: 2
      duration-minutes: 60
      open-cost:
        money: 10000000.0
        reputation: 0
      reset-cost:
        money: 25000000.0
        reputation: 0
      reward-reputation: 200
    "2":
      min-members: 3
      min-online: 2
      pick-count: 3
      duration-minutes: 90
      open-cost:
        money: 500000.0
        reputation: 150
      reset-cost:
        money: 12500000.0
        reputation: 75
      reward-reputation: 600
    "3":
      min-members: 5
      min-online: 3
      pick-count: 4
      duration-minutes: 120
      open-cost:
        money: 75000000.0
        reputation: 400
      reset-cost:
        money: 750000.0
        reputation: 200
      reward-reputation: 1500

# Phase 2 — VIP KOTH mine (WorldGuard region).
koth:
  enabled: true
  region: gang_vip_mine
  # Seconds of uncontested presence to capture.
  capture-seconds: 60
  money-per-ore: 10
  # Owner gang members earn money-per-ore * this multiplier.
  owner-multiplier: 5.0
  # Fraction of non-owner VIP earnings paid into the owner gang bank.
  tax-rate: 0.2
  # If non-empty, the active KOTH region rotates among these on a timer;
  # otherwise `region` above is always active.
  regions:
    - gang_vip_mine
  # Hours between rotations across `regions`.
  rotate-hours: 6
  # Seconds after a capture during which the region cannot be contested.
  defense-seconds: 30
  # Extra season points per consecutive capture by the same gang.
  capture-streak-bonus-points: 5

shop:
  expand-slots:
    cost: 500000
    amount: 1
  expand-capacity:
    cost: 25000000
    amount: 500
  buff-sell-2x:
    cost: 1000000
    duration-seconds: 3600
    multiplier: 2.0
  buff-haste:
    cost: 500000
    duration-seconds: 3600
    amplifier: 2
  buff-mmocore-exp:
    cost: 750000
    duration-seconds: 3600
    # Multiplier on MMOCore EXP gains for all gang members while active.
    multiplier: 1.25

# Phase 1 — role gates. Each action lists the roles allowed to perform it.
# LEADER-only disband is hardcoded and not configurable here.
roles:
  open-quest:
    - LEADER
    - CO_LEADER
  # Highest shared-quest level each role may open.
  open-quest-max-level:
    LEADER: 3
    CO_LEADER: 1
  sell-vault:
    - LEADER
    - CO_LEADER
  upgrade:
    - LEADER
    - CO_LEADER
  set-home:
    - LEADER
    - CO_LEADER
  invite:
    - LEADER
    - CO_LEADER
  buy-war-lives:
    - LEADER

# Phase 1 — per-player daily personal quests (pool: quests.yml `personal:`).
personal-quest:
  enabled: true
  # Distinct quests rolled per player per day.
  pick-count: 2
  # Hour (0-23, server timezone) when the personal day resets.
  reset-hour: 0
  # Paid to the player (Vault) on claim.
  reward-money: 5000
  # Personal contribution + small gang reputation share on claim.
  reward-reputation: 20

# Phase 1 — per-gang weekly board (pool: quests.yml `weekly:`).
weekly:
  enabled: true
  reset-day: MONDAY
  reset-hour: 0
  # Distinct quests rolled per gang per week.
  pick-count: 4
  reward-reputation: 800
  reward-sell-buff-seconds: 3600
  reward-sell-buff-multiplier: 2.0
  season-points: 50
  # Broadcast weekly completions to the top-N gangs of the season.
  top-broadcast: 3

# Phase 2 — Paragon Sell prestige (only once Bang Level is maxed).
paragon:
  enabled: true
  max-level: 20
  # Reputation cost per level (last value reused past the list end).
  reputation-costs:
    - 3000
    - 4000
    - 5000
    - 6500
    - 8000
  # Money cost per level (from the gang bank), same indexing.
  money-costs:
    - 250000000
    - 300000000
    - 350000000
    - 400000000
    - 500000000
  # Absolute bonus added to the Sell multiplier per Paragon level (+1%).
  sell-bonus-per-level: 0.01

# Phase 2 — competitive season (points from quests / KOTH / weekly).
season:
  enabled: true
  duration-days: 28
  points-quest-clear: 10
  points-koth-capture: 25
  points-weekly-complete: 50
  reward-top1-bank: 5000000
  reward-top2-bank: 2500000
  reward-top3-bank: 1000000

# Phase 1 — gang home warp.
home:
  enabled: true
  warp-cooldown-seconds: 120
  # Player money cost (Vault) to warp; 0 disables the cost.
  warp-cost: 10000

# Read once at startup. type: sqlite or mysql.
storage:
  type: sqlite
  sqlite:
    file: gang.db
  mysql:
    host: localhost
    port: 3306
    database: coreplugin
    username: root
    password: ""
    pool-size: 4
war:
  enabled: true
  duration-minutes: 10
  countdown-seconds: 160
  win-points: 500
  points-per-second: 3
  kill-points: 20
  boss-mob-id: TONG_QUAN_NGUC
  boss-kill-points: 100
  lives:
    per-player: 2
    respawn-seconds: 60
    buy:
      enabled: true
      cost: 25000000
      lives-each: 1
      max-purchases: 1
  cancel-friendly-fire: true
  last-standing-wins: true
  arena-region: war_arena
  gates:
    - id: gate_a
      region: war_gate_a
      display: "&eCổng Đông"
    - id: gate_b
      region: war_gate_b
      display: "&eCổng Tây"
    - id: gate_c
      region: war_gate_c
      display: "&eCổng Nam"
    - id: gate_d
      region: war_gate_d
      display: "&eCổng Bắc"
  rewards:
    bank: 2000000
    reputation: 500
    season-points: 100
  boss-bar:
    enabled: true
    color: RED
    style: SOLID
    title: "&c&lBANG CHIẾN &8| &f#{rank} {gang} &e{points} &7• &fCòn {remain}"
  hologram:
    enabled: true
    y-offset: 1.0
    lines-empty:
      - "&7&l✧ CỔNG XUẤT ✧"
      - "{gate}"
      - "&8▬▬▬▬▬▬▬▬▬▬▬"
      - "&7Chưa bang nào chiếm"
      - "&8» &7Đứng đây để chiếm"
    lines-holding:
      - "&a&l✦ ĐANG CHIẾM ✦"
      - "{gate}"
      - "&8▬▬▬▬▬▬▬▬▬▬▬"
      - "&a&l{gang}"
      - "&7Ghi &a+{pps} &7điểm/giây"
    lines-contested:
      - "&c&l⚔ TRANH CHẤP ⚔"
      - "{gate}"
      - "&8▬▬▬▬▬▬▬▬▬▬▬"
      - "&cKhông bang nào ghi điểm"
      - "&8» &7Hạ đối thủ để chiếm"
  mobs:
    gate-selection: RANDOM_HELD
    spawn-offset-y: 1.0
    soldiers:
      enabled: true
      mob-id: TONG_QUAN_NGUC_LINH
      interval-seconds: 30
      amount-per-wave: 4
      kill-points: 3
      max-alive: 24
    boss:
      enabled: true
      mob-id: TONG_QUAN_NGUC
      interval-seconds: 60
      spawn-at-match-start: true
      max-alive: 2
      kill-points: 100
  schedule:
    enabled: true
    timezone: Asia/Ho_Chi_Minh
    hour: 20
    minute: 0
