# Docs:
#   Purpose: GUI titles + every button's material/name/lore for the Gang
#     menus. Reload: /gang reload
#   Placeholders: each item below documents the {tokens} it supports next
#     to it. Slots/layout stay in code — only material/name/lore are
#     configurable here. A missing material/name/lore key (or an unknown
#     material) falls back to the plugin's built-in default for that item.
#   Shared buttons: an item can say `template: <name>` instead of defining
#     its own material/name/lore — the material/name/lore then come from
#     `templates.<name>` in gui-templates.yml (same folder). See "back" on
#     every item below for an example.

vault-title: "&8[&a✦&8] &a&lKHO BANG HỘI"
shop-title: "&8[&a✦&8] &a&lSHOP BANG HỘI"
upgrade-title: "&8[&a✦&8] &a&lNÂNG CẤP BANG"
main-title: "&8[&a✦&8] &a&lBANG HỘI"
members-title: "&8[&a✦&8] &a&lTHÀNH VIÊN"
member-title: "&8[&a✦&8] &a&lQUẢN LÝ THÀNH VIÊN"
bank-title: "&8[&a✦&8] &a&lNGÂN HÀNG BANG"
disband-title: "&8[&c✦&8] &c&lGIẢI TÁN BANG?"
quest-title: "&8[&e✦&8] &e&lQUEST BANG HỘI"
# Các mốc tiền cho nút nạp/rút nhanh trong GUI Ngân hàng (tối đa 6 mốc).
# Nút "Tất cả" luôn có sẵn, không cần khai báo ở đây.
bank-amounts: [10000, 100000, 1000000]

items:
  hub:
    # {gang} {prefix} {level} {max-level} {bank} {members} {member-slots}
    # {vault-used} {vault-capacity} {reputation} {sell} {magnet} {protection}
    info:
      material: NETHER_STAR
      name: "&a&l✦ {gang}"
      lore:
        - "&7Prefix: &f{prefix}"
        - "&7Bang Lv: &e{level}&7/&e{max-level}"
        - ""
        - "&7Bank: &e{bank}"
        - "&7Thành viên: &e{members}&7/&e{member-slots}"
        - "&7Kho: &e{vault-used}&7/&e{vault-capacity}"
        - "&7Danh vọng: &e{reputation}"
        - ""
        - "&7Upgrade: &eSell {sell} &8• &eMagnet {magnet} &8• &eProt {protection}"
    # {player}
    members:
      name: "&f{player}"
      lore:
        - "&7Xem danh sách & quản lý"
        - "&7thành viên trong bang"
        - ""
        - "&a➤ Click để mở"
    # {bank}
    bank:
      material: GOLD_INGOT
      name: "&a&l💰 Ngân Hàng Bang"
      lore:
        - "&7Số dư: &e{bank}"
        - ""
        - "&a➤ Click để nạp / rút tiền"
    # {vault-used} {vault-capacity} {vault-status}
    vault:
      material: ENDER_CHEST
      name: "&a&l📦 Kho Bang"
      lore:
        - "&7Dung lượng: &e{vault-used}&7/&e{vault-capacity}"
        - "&7Nạp kho của bạn: {vault-status}"
        - ""
        - "&a➤ Click để mở kho"
    shop:
      material: EMERALD
      name: "&a&l🛒 Shop Bang"
      lore:
        - "&7Mua mở rộng slot / kho, buff"
        - ""
        - "&a➤ Click để mở shop"
    upgrade:
      material: ANVIL
      name: "&a&l⭐ Nâng Cấp Bang"
      lore:
        - "&7Nâng cấp vĩnh viễn bằng danh vọng"
        - ""
        - "&a➤ Click để mở nâng cấp"
    quest:
      material: WRITABLE_BOOK
      name: "&e&l📜 Quest Bang"
      lore:
        - "&7Mở quest chung cho bang"
        - "&8Leader: mở / reset / phiếu trong GUI"
        - ""
        - "&e➤ Click để mở"
    # {owner}
    koth:
      material: BEACON
      name: "&b&l🏆 Mỏ VIP (KOTH)"
      lore:
        - "&7Chủ sở hữu: &e{owner}"
        - ""
        - "&b➤ Click để xem trạng thái"
    leave:
      material: OAK_DOOR
      name: "&c&l🚪 Rời Bang"
      lore:
        - "&7Leader phải thăng chức hoặc"
        - "&7giải tán bang trước khi rời"
        - ""
        - "&c➤ Click để rời bang"
    disband:
      material: TNT
      name: "&c&l💥 Giải Tán Bang"
      lore:
        - "&7Xóa vĩnh viễn bang này"
        - "&7Mất toàn bộ &cbank + kho&7!"
        - ""
        - "&c➤ Click để xác nhận"

  members:
    # {player} {role} {contribution}
    entry:
      name: "&f{player}"
      lore:
        - "&7Chức vụ: &e{role}"
        - "&7Đóng góp: &e{contribution}"
