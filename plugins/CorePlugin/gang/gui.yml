# Docs:
#   Purpose: GUI titles + every button's material/name/lore for the Gang
#     menus. Reload: /gang reload
#   Placeholders: each item below documents the {tokens} it supports next
#     to it. Slots/layout stay in code — only material/name/lore are
#     configurable here. A missing material/name/lore key (or an unknown
#     material) falls back to the plugin's built-in default for that item.
#   Shared buttons: an item can say `template: <name>` instead of defining
#     its own material/name/lore — the material/name/lore then come from
#     `templates.<name>` in gui-templates.yml (same folder). See "back" on
#     every item below for an example.

vault-title: '&8[&a✦&8] &a&lKHO BANG HỘI'
shop-title: '&8[&a✦&8] &a&lSHOP BANG HỘI'
upgrade-title: '&8[&a✦&8] &a&lNÂNG CẤP BANG'
main-title: '&8[&a✦&8] &a&lBANG HỘI'
members-title: '&8[&a✦&8] &a&lTHÀNH VIÊN'
member-title: '&8[&a✦&8] &a&lQUẢN LÝ THÀNH VIÊN'
bank-title: '&8[&a✦&8] &a&lNGÂN HÀNG BANG'
disband-title: '&8[&c✦&8] &c&lGIẢI TÁN BANG?'
quest-title: '&8[&e✦&8] &e&lQUEST BANG HỘI'
# Các mốc tiền cho nút nạp/rút nhanh trong GUI Ngân hàng (tối đa 6 mốc).
# Nút "Tất cả" luôn có sẵn, không cần khai báo ở đây.
bank-amounts:
- 10000
- 100000
- 1000000

items:
