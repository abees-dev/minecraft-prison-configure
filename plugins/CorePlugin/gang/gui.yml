    # {gang} {prefix} {level} {max-level} {bank} {members} {member-slots}
    # {vault-used} {vault-capacity} {reputation} {sell} {magnet} {protection}
    info:
      material: NETHER_STAR
      name: '&a&l✦ {gang}'
      lore:
      - '&7Prefix: &f{prefix}'
      - '&7Bang Lv: &e{level}&7/&e{max-level}'
      - ''
      - '&7Bank: &e{bank}'
      - '&7Thành viên: &e{members}&7/&e{member-slots}'
      - '&7Kho: &e{vault-used}&7/&e{vault-capacity}'
      - '&7Danh vọng: &e{reputation}'
      - ''
      - '&7Upgrade: &eSell {sell} &8• &eMagnet {magnet} &8• &eProt {protection}'
    # {player}
