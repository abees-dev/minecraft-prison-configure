# Docs:
#   Purpose: Quest Bang Hội pools by level (1/2/3). Reload: /gang reload
#   GUI-only actions: open level, reset quest, use ticket (no command).
#   Command: /gang quest (opens GUI), /gang quest info (read-only status).
#
#   Each open randomizes pick-count distinct quests from this pool (config.yml
#   levels.<n>.pick-count). Pool smaller than pick-count → take all — pools below
#   are sized well above pick-count so opens/resets actually vary. All picked
#   quests run in parallel; board completes only when every objective hits target
#   → one gang reputation reward. BossBar shows overall % + Lv only; details via
#   /gang quest info or the quest GUI.
#
#   Objective types:
#     KILL_MOB     — CHỈ MythicMobs. filter = internal Mythic mob name
#                    (vd PRISON_TAN_BINH_NORMAL). Kill vanilla EntityType KHÔNG đếm.
#                    Chỉ dùng mob NORMAL/ELITE (spawn thường xuyên qua spawner) —
#                    KHÔNG dùng biến thể *_BOSS (spawn hiếm/định kỳ qua boss
#                    spawner riêng, không phù hợp mục tiêu đếm số lượng).
#     BREAK_BLOCK  — Material name in filter. BẮT BUỘC có worlds (hoặc world)
#                    — chỉ đếm phá block trong world liệt kê (anti-farm ngoài mỏ).
#                    Filter PHẢI khớp đúng block mine X-Prison thật sinh ra
#                    (xem bảng mine bên dưới, nguồn: docs/xprison-config-notes.md
#                    mục 7 + xác nhận qua global-sell-prices trong
#                    plugins/X-Prison/autosell.yml). KHÔNG dùng COPPER_ORE hay
#                    bất kỳ biến thể DEEPSLATE_* nào — không tồn tại trong bất kỳ
#                    mine nào của server (plugin Prison cũ đã NGỪNG DÙNG, thay
#                    bằng X-Prison — xem docs/xprison-config-notes.md).
#     STATION_CRAFT — MMOItems crafting station (NPC). Filter by mmoitems-type +
#                     mmoitems-id của item KẾT QUẢ (RESULT), khớp output của
#                     trạm refinery-<rank> (plugins/MMOItems/crafting-stations/).
#                     Không đếm vanilla CraftItemEvent hay trade/sell ở warp.
#     VAULT_DEPOSIT — đếm khoáng tự nạp vào kho bang (toggle Nạp Kho trong
#                     /gang vault). Cũng dùng được ở board chung, không chỉ
#                     personal/weekly.
#     CUSTOM       — no listener; push via GangQuestService.addCustomProgress
#
#   CRAFT_ITEM (vanilla table) is intentionally unsupported — this server crafts
#   via MMOItems stations attached to NPCs.
#
#   Rank thật của server (mob MythicMobs + item MMOItems + mine X-Prison, xem
#   plugins/MythicMobs/mobs/prison_rank_mobs.yml,
#   plugins/MMOItems/crafting-stations/refinery-*.yml,
#   docs/xprison-config-notes.md mục 7 — plugin Prison cũ (rockindeveloper) ĐÃ
#   NGỪNG DÙNG, giữ lại trên đĩa nhưng không load ý nghĩa gì, KHÔNG dùng data
#   của nó (plugins/Prison/data_storage/mines/) để suy ra block mine):
#     Rank | Tên            | Mob KILL_MOB (NORMAL/ELITE)        | STATION_CRAFT id          | Mine X-Prison (% block, đề xuất đã áp dụng)
#     1    Tân Binh        PRISON_TAN_BINH_NORMAL/ELITE         DA_NANG_CAP_TAN_BINH        tan_binh: STONE 60 / COBBLESTONE 30 / COAL_ORE 10
#     2    Tù Nhân         PRISON_TU_NHAN_NORMAL/ELITE          DA_NANG_CAP_TU_NHAN         tu_nhan: STONE 50 / COAL_ORE 30 / IRON_ORE 20
#     3    Lao Công        PRISON_LAO_CONG_NORMAL/ELITE         DA_NANG_CAP_LAO_CONG        lao_cong: IRON_ORE 40 / COAL_ORE 30 / GOLD_ORE 20 / LAPIS_ORE 10
#     4    Thợ Đào         PRISON_THO_DAO_NORMAL/ELITE          DA_NANG_CAP_THO_DAO         tho_dao: GOLD_ORE 35 / LAPIS_ORE 25 / REDSTONE_ORE 25 / DIAMOND_ORE 15
#     5    Đội Trưởng      PRISON_DOI_TRUONG_NORMAL/ELITE       DA_NANG_CAP_DOI_TRUONG      doi_truong: REDSTONE_ORE 30 / DIAMOND_ORE 30 / EMERALD_ORE 25 / IRON_ORE 15
#     6    Phó Quản Ngục   PRISON_PHO_QUAN_NGUC_NORMAL/ELITE    DA_NANG_CAP_PHO_QUAN_NGUC   pho_quan_nguc: DIAMOND_ORE 35 / EMERALD_ORE 35 / GOLD_ORE 20 / NETHER_GOLD_ORE 10
#     7    Quản Ngục       PRISON_QUAN_NGUC_NORMAL/ELITE        DA_NANG_CAP_QUAN_NGUC       quan_nguc: EMERALD_ORE 35 / DIAMOND_ORE 30 / NETHER_QUARTZ_ORE 20 / ANCIENT_DEBRIS 15
#     8    Bá Chủ Ngục Tù  PRISON_BA_CHU_NGUC_TU_NORMAL/ELITE   DA_NANG_CAP_BA_CHU_NGUC_TU  ba_chu_nguc_tu: ANCIENT_DEBRIS 35 / EMERALD_ORE 35 / DIAMOND_ORE 30
#     9    Vượt Ngục       PRISON_VUOT_NGUC_NORMAL/ELITE        DA_NANG_CAP_VUOT_NGUC       vuot_nguc: ANCIENT_DEBRIS 50 / EMERALD_ORE 25 / DIAMOND_ORE 25
#   Mining: world_prison only. KHÔNG có COPPER_ORE hay DEEPSLATE_* nào trong
#   bất kỳ mine nào — không dùng trong filter.

