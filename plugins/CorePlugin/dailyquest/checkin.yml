# Docs:
#   Purpose: Daily check-in (điểm danh) — once per calendar day; streak breaks if a day is missed.
#   Reload: /dailyquest reload
#   Command: /checkin
#   Streak rewards: keyed by streak day number (string). Falls back to default-rewards.
#   Reward types: vault-money | mmoitem | crate | crate-key | command | mmocore-exp
#     - display: (tùy chọn) chuỗi lore/chat thay cho label tự ghép từ type/id.

# Enable check-in feature.
enabled: true

# Minimum streak day shown in messages (cosmetic).
display-min-streak: 1

# Rewards when no matching streak-rewards entry exists.
default-rewards:
  - type: vault-money
    amount: 200
  - type: mmocore-exp
    amount: 10

# Optional rewards for specific streak milestones (day count after successful claim).
streak-rewards:
  '3':
    - type: vault-money
      amount: 800
    - type: mmocore-exp
      amount: 25
  '7':
    - type: vault-money
      amount: 2500
    - type: crate
      crate: daily_crate
      amount: 1
      display: '&dHòm Ngày &7x1'
    - type: mmoitem
      mi-type: CONSUMABLE
      mi-id: CHECKIN_WEEKLY
      amount: 1
      display: '&6Token Check-in Tuần &7x1'
  '14':
    - type: vault-money
      amount: 5000
    - type: mmocore-exp
      amount: 75
  '30':
    - type: vault-money
      amount: 15000
    - type: crate
      crate: weekly_crate
      amount: 1
      display: '&dHòm Tuần &7x1'
