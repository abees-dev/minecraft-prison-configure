# Docs:
#   Purpose: Daily check-in (điểm danh) — once per calendar day; streak breaks if a day is missed.
#   Reload: /dailyquest reload
#   Command: /checkin
#   Streak rewards: keyed by streak day number (string). Falls back to default-rewards.
#   Reward types: vault-money | mmoitem | crate | crate-key | player-points | command | mmocore-exp

enabled: true

display-min-streak: 1

default-rewards:
  - type: vault-money
    amount: 800
  - type: mmocore-exp
    amount: 20
  - type: player-points
    amount: 1

streak-rewards:
  '3':
    - type: vault-money
      amount: 2000
    - type: mmocore-exp
      amount: 40
    - type: mmoitem
      mi-type: MATERIAL
      mi-id: DA_CUONG_HOA_VU_KHI_SO_CAP
      amount: 1
    - type: player-points
      amount: 2
  '7':
    - type: vault-money
      amount: 5000
    - type: mmocore-exp
      amount: 80
    - type: crate-key
      key: chia_khoa_trang_suc_free
      amount: 1
    - type: player-points
      amount: 5
    - type: mmoitem
      mi-type: MATERIAL
      mi-id: DA_CUONG_HOA_GIAP_SO_CAP
      amount: 2
  '14':
