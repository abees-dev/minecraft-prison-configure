# Docs:
#   Purpose: Player-facing and console message templates.
#   Placeholders: %player%, %quest%, %quest_name%, %progress%, %target%, %streak%, %day%, %rows%.
#   Reload: /dailyquest reload
#   rewards.*: shared reward preview header/empty line for GUI lore and claim chat.

prefix: '&b◆ &f'

# Shared reward preview (quest icons, clear-all, check-in, claim chat).
rewards:
  header: '&7Thưởng:'
  none: '&8• &7(không có)'
  label:
    vault-money: '&a$%amount%'
    mmocore-exp: '&b%amount% XP'
    crate: '&dCrate &f%crate% &7x%amount%'
    crate-key: '&dChìa &f%key% &7x%amount%'
    player-points: '&#AED6F1%amount% Point'
    mmoitem: '&6%mi_type%:%mi_id% &7x%amount%'
    command: '&7/%command%'
    unknown: '&7%type%'

quest:
  progress: '&7%quest_name% &8(%quest%): &f%progress%&7/&f%target%'
  completed: '&aHoàn thành &f%quest%&a! Mở /dailyquest để nhận thưởng.'
  claimed: '&aĐã nhận thưởng &f%quest_name%&a.'
  already-claimed: '&cBạn đã nhận thưởng quest này trong kỳ hiện tại.'
  not-complete: '&cQuest &f%quest_name% &cchưa hoàn thành (&f%progress%&7/&f%target%&c).'
  unknown: '&cKhông tìm thấy quest &f%quest%&c.'
  list-header: '&f%period% &7(%period_key%):'
  # %period% trong các dòng clear-all = nhãn kỳ bên dưới (ngày/tuần).
  period-daily: ngày
  period-weekly: tuần
  clear-all-bonus: '&6Bonus clear-all! &aBạn đã nhận thưởng hoàn thành tất cả nhiệm
    vụ %period%.'
  clear-all-locked: '&cHãy claim hết quest %period% trước khi nhận bonus.'
  clear-all-locked-name: '&7Bonus Clear-All'
  clear-all-locked-lore: '&8Claim hết quest %period% để mở khóa'
  clear-all-claimable-name: '&6Bonus Clear-All'
  clear-all-claimable-lore: '&aClick để nhận thưởng clear-all'
  clear-all-claimed-name: '&aBonus Clear-All'
  clear-all-claimed-lore: '&2Đã nhận bonus kỳ này'
  # Daily/weekly assignment re-roll (GUI button).
  reroll-success: '&aĐã đổi bộ nhiệm vụ. Còn &f%remaining%&a lượt kỳ này.'
  reroll-exhausted: '&cBạn đã hết lượt đổi nhiệm vụ kỳ này.'
  reroll-disabled: '&cĐổi nhiệm vụ đang tắt.'

checkin:
  success: '&aĐiểm danh thành công! Streak: &f%streak%'
  already: '&cBạn đã điểm danh hôm nay rồi. Streak: &f%streak%'
  disabled: '&cHệ thống điểm danh đang tắt.'
  gui-available: '&aClick để điểm danh'
  gui-done: '&7Đã điểm danh hôm nay · Streak &f%streak%'
  # Claim button display name / lore in check-in GUI.
  gui-claim-name: '&6Điểm danh'
  gui-streak-lore: '&7Streak: &f%streak%'
  calendar-day-name: '&eNgày &f%day%'
  calendar-claimed: '&aĐã điểm danh'
  calendar-today: '&6Hôm nay — click nút điểm danh'
  calendar-upcoming: '&7Chưa tới'
  calendar-milestone: '&dMốc thưởng đặc biệt'
  # Kept for older configs; code prefers rewards.header / rewards.none.
  calendar-rewards-header: '&7Thưởng:'
  calendar-reward-none: '&8• &7(không có)'

admin:
  reloaded: '&aĐã reload config DailyQuest.'
  no-permission: '&cBạn không có quyền.'
  reset-ok: '&aĐã reset (&f%scope%&a) cho &f%player%&a (&f%rows%&a dòng).'
  force-claim-ok: '&aForce-claim &f%quest% &acho &f%player%&a.'
  force-claim-fail: '&cForce-claim thất bại: &f%result%'
  # %type% = objective type, %filter% = filter đã cộng ("-" nếu không có), %amount% = số tiến độ.
  progress-ok: '&aĐã cộng &f%amount% &atiến độ &f%type%&7/&f%filter% &acho &f%player%&a.'
  usage: '&e/dailyquest admin reset <player> <all|daily|weekly|checkin>|&e/dailyquest
    admin force-claim <player> <daily|weekly> <questId>|&e/dailyquest admin progress
    <player> <type> [filter|-] [số]'
  player-not-found: '&cKhông tìm thấy player &f%player%&c (phải online).'

gui:
  open-failed: '&cKhông mở được GUI.'

errors:
  database: '&cLỗi cơ sở dữ liệu. Thử lại sau.'
  player-only: '&cChỉ người chơi mới dùng được lệnh này.'
  # Command usage hints. %label% = alias the player actually typed (dq, quests...).
  usage: '&e/%label% [daily|weekly|list|claim|reload|admin]'
  usage-claim: '&e/%label% claim <daily|weekly> <questId>'
  period-invalid: '&cKỳ phải là daily hoặc weekly.'
