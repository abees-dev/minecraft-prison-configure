# Docs:
#   Purpose: Paper inventory GUI layout for daily / weekly quests and check-in.
#   Reload: /dailyquest reload
#   Materials: Bukkit Material names. Size must be a multiple of 9 (9–54).
#   clear-all-slot: per-period clear-all bonus icon; -1 to hide (icon also hides
#   itself when the period's clear-all-bonus in quests/*.yml is disabled/empty).
#   calendar: streak day preview in check-in GUI.
#   Frame: every menu is painted with the shared CorePlugin GUI style — an
#   outer ring of border-material, a filler-material interior, and
#   accent-material panes on the corners/edge midpoints (accent color is
#   per-menu). Quest icons only ever fill INTERIOR slots (never the border
#   ring), so with size 54 there are exactly 28 usable quest slots.

# Interior pane for empty slots.
filler-material: GRAY_STAINED_GLASS_PANE
# Outer border ring pane (shared by all three menus).
border-material: BLACK_STAINED_GLASS_PANE

daily:
  # Chest title (legacy color codes).
  title: "&8[&e✦&8] &e&lNHIỆM VỤ NGÀY"
  size: 54
  # Corner/edge accent pane for this menu.
  accent-material: YELLOW_STAINED_GLASS_PANE
  # First slot index used for quest icons (then sequential, interior only).
  quest-start-slot: 10
  # Max quest icons shown.
  max-quests: 28
  # Clear-all bonus icon (claimable after every daily quest is claimed).
  clear-all-slot: 47
  clear-all:
    locked-material: GRAY_DYE
    claimable-material: NETHER_STAR
    claimed-material: LIME_DYE
  # Nav buttons.
  buttons:
    weekly:
      slot: 46
      material: CLOCK
      name: "&6&l⇄ NHIỆM VỤ TUẦN"
      lore:
        - "&7Click để mở nhiệm vụ tuần."
    checkin:
      slot: 49
      material: GOLD_INGOT
      name: "&a&l✦ ĐIỂM DANH"
      lore:
        - "&7Click để mở điểm danh."
    close:
      slot: 53
      material: BARRIER
      name: "&c&l✖ ĐÓNG GIAO DIỆN"
      lore: []

weekly:
  title: "&8[&6✦&8] &6&lNHIỆM VỤ TUẦN"
  size: 54
  accent-material: ORANGE_STAINED_GLASS_PANE
  quest-start-slot: 10
  max-quests: 28
  # Clear-all bonus icon (claimable after every weekly quest is claimed —
  # rewards in quests/weekly.yml clear-all-bonus).
  clear-all-slot: 47
  clear-all:
    locked-material: GRAY_DYE
    claimable-material: NETHER_STAR
    claimed-material: LIME_DYE
  buttons:
    daily:
      slot: 46
      material: SUNFLOWER
      name: "&e&l⇄ NHIỆM VỤ NGÀY"
      lore:
        - "&7Click để mở nhiệm vụ ngày."
    checkin:
      slot: 49
      material: GOLD_INGOT
      name: "&a&l✦ ĐIỂM DANH"
      lore:
        - "&7Click để mở điểm danh."
    close:
      slot: 53
      material: BARRIER
      name: "&c&l✖ ĐÓNG GIAO DIỆN"
      lore: []

checkin:
  title: "&8[&a✦&8] &a&lĐIỂM DANH HÀNG NGÀY"
  size: 54
  accent-material: LIME_STAINED_GLASS_PANE
  # Main claim button slot (glows while today's check-in is unclaimed).
  claim-slot: 13
  claimed-material: LIME_DYE
  available-material: GOLD_INGOT
  already-material: RED_DYE
  # Streak calendar preview (days 1..N from start-slot).
  calendar:
    enabled: true
    start-slot: 19
    days: 7
    claimed-material: LIME_STAINED_GLASS_PANE
    today-material: GOLD_BLOCK
    upcoming-material: GRAY_DYE
    milestone-material: ENDER_CHEST
  buttons:
    daily:
      slot: 46
      material: BOOK
      name: "&e&l⇄ NHIỆM VỤ NGÀY"
      lore: []
    weekly:
      slot: 48
      material: BOOK
      name: "&6&l⇄ NHIỆM VỤ TUẦN"
      lore: []
    close:
      slot: 52
      material: BARRIER
      name: "&c&l✖ ĐÓNG GIAO DIỆN"
      lore: []

# Quest icon appearance by status.
# %rewards% expands to one lore line per reward (see messages.yml rewards.*).
quest-icons:
  in-progress:
    material: PAPER
    name: "&f%quest_name%"
    lore:
      - "%description%"
      - ""
      - "&7Tiến độ: &f%progress%&7/&f%target%"
      - "&7Trạng thái: &eĐang làm"
      - ""
      - "&7Thưởng:"
      - "%rewards%"
  claimable:
    material: CHEST
    name: "&a%quest_name%"
    lore:
      - "%description%"
      - ""
      - "&7Tiến độ: &a%progress%&7/&a%target%"
      - "&aClick để nhận thưởng"
      - ""
      - "&7Thưởng:"
      - "%rewards%"
  claimed:
    material: LIME_CONCRETE
    name: "&a%quest_name%"
    lore:
      - "%description%"
      - ""
      - "&7Tiến độ: &a%progress%&7/&a%target%"
      - "&2Đã nhận thưởng"
      - ""
      - "&7Thưởng:"
      - "%rewards%"
