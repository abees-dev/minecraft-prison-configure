# Docs:
#   Purpose: Weekly quest definitions (Prison RPG). Reset Monday 00:00 in config.yml reset-timezone.
#   Reload: /dailyquest reload
#   Same schema as quests/daily.yml (id, revision, type, target, filter, worlds, rewards).
#   clear-all-bonus: claim sau khi claim hết weekly — chìa Long Tộc (loi-choi §6.2 H).
#   Key & PlayerPoints giữ nguyên; tiền / EXP / đá tăng. Có mốc dễ + stretch.

clear-all-bonus:
  enabled: true
  rewards:
  - type: crate-key
    key: chia_khoa_long_toc
    amount: 1
  - type: player-points
    amount: 10
  - type: vault-money
    amount: 15000
  - type: mmocore-exp
    amount: 220

