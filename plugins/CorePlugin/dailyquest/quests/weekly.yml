# Docs:
#   Purpose: Weekly quest definitions — always (optional) + per-rank random pools.
#   Reload: /dailyquest reload
#   Assignment: same config.yml assignment.* as daily (period key = ISO week).
#   Same schema as quests/daily.yml — always / global / rank / worlds / STATION_CRAFT / CONSUME_ITEM.
#   STATION_CRAFT: mmoitems-type + mmoitems-id (DA_NANG_CAP_<RANK> tại refinery).
#   global: true — mix pool mọi rank (CONSUME_ITEM, …).
#   PlayerPoints: keep quests + clear-all ≤ 15 points/week total.
#   Clear-all grants 2 MMOCore ATT points via a console command (once/week).

clear-all-bonus:
  enabled: true
  rewards:
  - type: crate-key
    key: chia_khoa_long_toc
    amount: 1
    display: '&dChìa Khóa Long Tộc &7x1'
  - type: player-points
    amount: 3
    display: '&#AED6F13 Point'
  - type: command
    command: 'mmocore admin attribute-points give %player% 2'
    display: '&6+2 Điểm ATT'

quests:
  # --- Global mix pool (mọi rank) ---
  W_EAT_GOLDEN_APPLE:
    global: true
    name: '&6Ăn táo vàng tuần'
