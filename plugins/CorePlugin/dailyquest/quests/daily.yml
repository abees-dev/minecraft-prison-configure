# Docs:
#   Purpose: Daily quest definitions — always + global mix + per-rank random pools.
#   Reload: /dailyquest reload
#   Assignment: always:true (cố định) + random-count từ (rank:N ∪ global:true).
#   Quest IDs: UPPER_SNAKE_CASE. Bump revision when changing objectives for an existing ID.
#   Objective types: KILL_MOB | BREAK_BLOCK | STATION_CRAFT | CONSUME_ITEM | CRAFT_ITEM | LOGIN | CHECKIN | CUSTOM
#     - KILL_MOB filter: Mythic internal name (PRISON_*_NORMAL/ELITE/BOSS) or EntityType.
#     - worlds: gate progress (world_prison mines; world_dungeon ranks 1–5; world_magadungeon 6–9).
#     - STATION_CRAFT: craft tại MMOItems station (NPC). Khớp output bằng
#       mmoitems-type + mmoitems-id (vd DA_NANG_CAP_<RANK> tại refinery).
#     - CONSUME_ITEM filter: Material (GOLDEN_APPLE) | FOOD (mọi đồ ăn) | POTION.
#     - global: true — vào pool random chung mọi rank (không gắn rank:N).
#   Reward types: vault-money | mmoitem | crate | crate-key | player-points | command | mmocore-exp
#     - display: optional lore/chat label override.
#   PlayerPoints budget: keep quests + clear-all ≤ 5 points/day total.
#   clear-all-bonus: granted once after all *assigned* daily quests are claimed.

clear-all-bonus:
  enabled: true
  rewards:
  - type: vault-money
    amount: 2500
  - type: mmocore-exp
    amount: 50
  - type: player-points
    amount: 1
    display: '&#AED6F11 Point'
  - type: crate-key
    key: chia_khoa_trang_suc_free
    amount: 1
    display: '&aChìa Khóa Trang Sức Free &7x1'
  # Daily progression: one point for class skills and one global point for
  # the class-oriented skill trees. Both are granted only once per day.
  - type: command
    command: 'mmocore admin skill-points give %player% 1'
    display: '&a+1 Điểm Kỹ Năng'
  - type: command
    command: 'mmocore admin skill-tree-points give %player% 1 global'
    display: '&6+1 Điểm Cây Kỹ Năng'

quests:
